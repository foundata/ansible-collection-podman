# Verify the state after the "host" role converge.

- name: "Molecule | Verify | host | Determine the installed Podman version"
  ansible.builtin.command:
    argv:
      - "/usr/bin/podman"
      - "--version"
  register: __testing_host_podman_version_result
  changed_when: false


- name: "Molecule | Verify | host | Check Podman is installed and new enough"
  ansible.builtin.assert:
    that:
      - __testing_host_podman_version_result['rc'] == 0
      - >-
        (__testing_host_podman_version_result['stdout']
         | ansible.builtin.regex_search('[0-9]+\.[0-9]+(\.[0-9]+)?'))
        is ansible.builtin.version('5.0.0', '>=')
    quiet: true


- name: "Molecule | Verify | host | Read the containers.conf drop-in"
  ansible.builtin.slurp:
    src: "/etc/containers/containers.conf.d/50-managed.conf"
  register: __testing_host_containers_dropin_slurp


- name: "Molecule | Verify | host | Check the containers.conf drop-in content"
  ansible.builtin.assert:
    that:
      - "'[containers]' in __testing_host_containers_dropin_content"
      - "'log_driver = \"journald\"' in __testing_host_containers_dropin_content"
      - "'Managed by Ansible (foundata.podman.host)' in __testing_host_containers_dropin_content"
    quiet: true
  vars:
    __testing_host_containers_dropin_content: "{{ __testing_host_containers_dropin_slurp['content'] | ansible.builtin.b64decode }}"


- name: "Molecule | Verify | host | Read the automatic image update timer drop-in"
  ansible.builtin.slurp:
    src: "/etc/systemd/system/podman-auto-update.timer.d/00-managed.conf"
  register: __testing_host_timer_dropin_slurp


- name: "Molecule | Verify | host | Check the automatic image update timer drop-in content"
  ansible.builtin.assert:
    that:
      - "'[Timer]' in __testing_host_timer_dropin_content"
      - "'OnCalendar=*-*-* 04:00:00' in __testing_host_timer_dropin_content"
      - "'RandomizedDelaySec=30m' in __testing_host_timer_dropin_content"
      - "'Persistent=true' in __testing_host_timer_dropin_content"
    quiet: true
  vars:
    __testing_host_timer_dropin_content: "{{ __testing_host_timer_dropin_slurp['content'] | ansible.builtin.b64decode }}"

# The repeatable time-trigger directives share one list in systemd, so the
# drop-in must carry
# exactly ONE empty reset line: a second one would wipe the triggers rendered
# before it. The two configured OnCalendar values must therefore appear as two
# assignments after that single reset.
- name: "Molecule | Verify | host | Assert the timer drop-in carries exactly one trigger reset"
  vars:
    __testing_host_timer_dropin_content: >-
      {{ __testing_host_timer_dropin_slurp['content'] | ansible.builtin.b64decode }}
  ansible.builtin.assert:
    that:
      - >-
        (__testing_host_timer_dropin_content | ansible.builtin.regex_findall('(?m)^OnCalendar=$')
         | ansible.builtin.length) == 1
      - >-
        (__testing_host_timer_dropin_content | ansible.builtin.regex_findall('(?m)^OnCalendar=.+$')
         | ansible.builtin.length) == 2
    fail_msg: >-
      The rendered timer drop-in must contain exactly one empty 'OnCalendar=' reset line
      followed by the two configured expressions.
      Actual content: {{ __testing_host_timer_dropin_content }}
    success_msg: >-
      The rendered timer drop-in carries exactly one trigger reset followed by both
      configured OnCalendar expressions.


- name: "Molecule | Verify | host | Get the effective calendar schedule of the image update timer"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "show"
      - "--property=TimersCalendar"
      - "--property=TimersMonotonic"
      - "--property=OnClockChange"
      - "podman-auto-update.timer"
  register: __testing_host_timer_calendar
  changed_when: false


- name: "Molecule | Verify | host | Check the drop-in replaces the vendor schedule instead of accumulating"
  ansible.builtin.assert:
    that:
      # OnCalendar is list-typed: without a reset line the drop-in schedule adds
      # to the vendor's (daily). Exactly the configured entries, nothing more.
      - "'04:00:00' in __testing_host_timer_calendar['stdout']"
      - "'05:00:00' in __testing_host_timer_calendar['stdout']"
      # both configured expressions, and nothing from the vendor unit
      - "(__testing_host_timer_calendar['stdout'] | ansible.builtin.regex_findall('OnCalendar=') | ansible.builtin.length) == 2"
      # the configured monotonic trigger must survive next to the calendar one
      - "'OnActiveUSec=1w' in __testing_host_timer_calendar['stdout']"
      # the boolean event trigger must be effective as well
      - "'OnClockChange=yes' in __testing_host_timer_calendar['stdout']"
    fail_msg: >-
      podman-auto-update.timer has an unexpected effective schedule: the drop-in
      must replace the vendor OnCalendar, not add to it. Got
      '{{ __testing_host_timer_calendar['stdout'] }}'.
    success_msg: >-
      podman-auto-update.timer runs only on the configured schedule
      ('{{ __testing_host_timer_calendar['stdout'] }}').


- name: "Molecule | Verify | host | Query the automatic image update timer state"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "is-enabled"
      - "podman-auto-update.timer"
  register: __testing_host_timer_enabled_result
  changed_when: false


- name: "Molecule | Verify | host | Check the automatic image update timer is enabled"
  ansible.builtin.assert:
    that:
      - __testing_host_timer_enabled_result['stdout'] == 'enabled'
    quiet: true


- name: "Molecule | Verify | host | Check lingering and subordinate IDs of the rootless account"
  block:

    - name: "Molecule | Verify | host | Check the linger flag of the rootless account"
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/containerapp"
      register: __testing_host_linger_stat


    - name: "Molecule | Verify | host | Query the subordinate ID assignments of the rootless account"
      ansible.builtin.command:
        argv:
          - "/usr/bin/grep"
          - "-E"
          - "^containerapp:"
          - "/etc/subuid"
          - "/etc/subgid"
      register: __testing_host_subid_result
      changed_when: false


    - name: "Molecule | Verify | host | Check the rootless prerequisites"
      ansible.builtin.assert:
        that:
          - __testing_host_linger_stat['stat']['exists']
          - __testing_host_subid_result['rc'] == 0
          - (__testing_host_subid_result['stdout_lines'] | ansible.builtin.length) == 2
        quiet: true


## Timer settings validation (init-only)
#
# The init tasks must reject timer settings the templates cannot render into a
# valid unit, and an empty list must be the supported way to drop a built-in
# trigger default. Each rejection case runs the role's init with one invalid
# mapping and expects the run to fail inside the validation; the positive case
# proves the empty-list removal is accepted and reaches the effective settings.

- name: "Molecule | Verify | Run timer settings rejection checks (init-only)"
  ansible.builtin.include_tasks:
    file: >-
      {{ (lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY')
          | ansible.builtin.default('../../default')) }}/tasks/verify/checks/timer-settings-reject.yml
  vars:
    __testing_reject_case: "{{ item }}"
  loop:
    - label: "empty string trigger"
      varname: "host_podman_auto_update_timer_settings"
      settings:
        OnCalendar: ""
    - label: "invalid list member"
      varname: "host_podman_auto_update_timer_settings"
      settings:
        OnCalendar:
          - "daily"
          - true
    - label: "list for non-repeatable directive"
      varname: "host_podman_auto_update_timer_settings"
      settings:
        RandomizedDelaySec:
          - "30m"
    - label: "mapping for non-repeatable directive"
      varname: "host_podman_auto_update_timer_settings"
      settings:
        RandomizedDelaySec:
          bad: "value"
    - label: "no trigger left"
      varname: "host_podman_auto_update_timer_settings"
      settings:
        OnCalendar: []
    - label: "non-boolean event trigger"
      varname: "host_podman_auto_update_timer_settings"
      settings:
        OnClockChange: "true"
    - label: "event triggers false and no other trigger"
      varname: "host_podman_auto_update_timer_settings"
      settings:
        OnCalendar: []
        OnClockChange: false
        OnTimezoneChange: false
  loop_control:
    label: "{{ item['label'] }}"


- name: "Molecule | Verify | Timer settings: apply an empty-list removal with a monotonic trigger"
  ansible.builtin.set_fact:
    __testing_timer_settings_saved: "{{ host_podman_auto_update_timer_settings | ansible.builtin.default({}) }}"
    host_podman_auto_update_timer_settings:
      OnCalendar: []
      OnBootSec: "10min"


- name: "Molecule | Verify | Timer settings: include the role's init (must accept the removal)"
  ansible.builtin.include_role:
    name: "foundata.podman.host"
    tasks_from: "init"
    # Unlike the other verify files, this one never exposes the role's variables
    # to the play, and the effective timer settings are computed lazily in the
    # role's vars/main.yml. Export them so the assertion below can dereference
    # the merged result.
    public: true


- name: "Molecule | Verify | Timer settings: assert the removal reached the effective settings"
  ansible.builtin.assert:
    that:
      - (__host_podman_auto_update_timer_settings_effective['OnCalendar'] | ansible.builtin.length) == 0
      - "__host_podman_auto_update_timer_settings_effective['OnBootSec'] == '10min'"
    fail_msg: >-
      The empty-list removal did not reach the effective timer settings.
      Got: {{ __host_podman_auto_update_timer_settings_effective }}
    success_msg: >-
      An empty OnCalendar list drops the built-in default while the monotonic
      trigger remains.


- name: "Molecule | Verify | Timer settings: restore the saved settings"
  ansible.builtin.set_fact:
    host_podman_auto_update_timer_settings: "{{ __testing_timer_settings_saved }}"


- name: "Molecule | Verify | Timer settings: apply an event-only configuration"
  ansible.builtin.set_fact:
    __testing_timer_settings_saved: "{{ host_podman_auto_update_timer_settings | ansible.builtin.default({}) }}"
    host_podman_auto_update_timer_settings:
      OnCalendar: []
      OnClockChange: true


- name: "Molecule | Verify | Timer settings: include the role's init (must accept the event-only timer)"
  ansible.builtin.include_role:
    name: "foundata.podman.host"
    tasks_from: "init"
    public: true


- name: "Molecule | Verify | Timer settings: assert the event-only configuration reached the effective settings"
  ansible.builtin.assert:
    that:
      - (__host_podman_auto_update_timer_settings_effective['OnCalendar'] | ansible.builtin.length) == 0
      - __host_podman_auto_update_timer_settings_effective['OnClockChange'] | ansible.builtin.bool
    fail_msg: >-
      The event-only timer configuration did not reach the effective settings.
      Got: {{ __host_podman_auto_update_timer_settings_effective }}
    success_msg: >-
      An event-only timer (all repeatable triggers dropped, OnClockChange true)
      is accepted.


- name: "Molecule | Verify | Timer settings: restore the saved settings again"
  ansible.builtin.set_fact:
    host_podman_auto_update_timer_settings: "{{ __testing_timer_settings_saved }}"


## Timer settings: event-only timer applied to the system (integration)
#
# The init-only positive case above proves acceptance, but not the rendered
# result. Re-run the role with an event-only configuration and ask systemd:
# the drop-in must carry the single reset and nothing else next to the event
# trigger, and the unit must end up with empty calendar/monotonic trigger
# lists while OnClockChange is active. This is the path that would regress if
# the reset detection stopped counting event triggers.

- name: "Molecule | Verify | Timer settings | event-only integration: save the current settings"
  ansible.builtin.set_fact:
    __testing_timer_settings_saved: "{{ host_podman_auto_update_timer_settings | ansible.builtin.default({}) }}"
    host_podman_auto_update_timer_settings:
      OnCalendar: []
      OnClockChange: true


- name: "Molecule | Verify | Timer settings | event-only integration: apply the role"
  ansible.builtin.include_role:
    name: "foundata.podman.host"


- name: "Molecule | Verify | Timer settings | event-only integration: run pending handlers (daemon-reload)"
  ansible.builtin.meta: flush_handlers


- name: "Molecule | Verify | Timer settings | event-only integration: read the rendered drop-in"
  ansible.builtin.slurp:
    src: "/etc/systemd/system/podman-auto-update.timer.d/00-managed.conf"
  register: __testing_timer_eventonly_dropin


- name: "Molecule | Verify | Timer settings | event-only integration: assert the rendered drop-in"
  vars:
    __testing_timer_eventonly_decoded: "{{ __testing_timer_eventonly_dropin['content'] | ansible.builtin.b64decode }}"
  ansible.builtin.assert:
    that:
      # exactly the single shared reset, no calendar or monotonic assignment
      - >-
        (__testing_timer_eventonly_decoded
         | ansible.builtin.regex_findall('(?m)^OnCalendar=$') | ansible.builtin.length) == 1
      - >-
        (__testing_timer_eventonly_decoded
         | ansible.builtin.regex_findall('(?m)^On\w+=.+$')
         | ansible.builtin.reject('match', '^OnClockChange=')
         | ansible.builtin.list | ansible.builtin.length) == 0
      - "'OnClockChange=true' in __testing_timer_eventonly_decoded"
    fail_msg: >-
      The event-only drop-in must contain exactly one empty 'OnCalendar=' reset and the
      event trigger, nothing else. Actual content: {{ __testing_timer_eventonly_decoded }}
    success_msg: "The event-only drop-in carries the single reset and the event trigger."


- name: "Molecule | Verify | Timer settings | event-only integration: get the parsed unit properties"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "show"
      - "--property=TimersCalendar"
      - "--property=TimersMonotonic"
      - "--property=OnClockChange"
      - "podman-auto-update.timer"
  register: __testing_timer_eventonly_props
  changed_when:
    - false


- name: "Molecule | Verify | Timer settings | event-only integration: assert the effective unit state"
  ansible.builtin.assert:
    that:
      # Both trigger lists must be empty: the reset removed the vendor schedule.
      # "systemctl show" omits empty properties unless --all is given, so assert
      # the absence of the non-empty form ("TimersCalendar={ ... }"), which is
      # robust across systemd versions.
      - "'TimersCalendar={' not in __testing_timer_eventonly_props['stdout']"
      - "'TimersMonotonic={' not in __testing_timer_eventonly_props['stdout']"
      - "'OnClockChange=yes' in __testing_timer_eventonly_props['stdout']"
    fail_msg: >-
      The event-only timer does not have the expected effective state (empty trigger
      lists, active OnClockChange). Got: {{ __testing_timer_eventonly_props['stdout'] }}
    success_msg: "The event-only timer is effective: empty trigger lists, OnClockChange active."


- name: "Molecule | Verify | Timer settings | event-only integration: restore the saved settings"
  ansible.builtin.set_fact:
    host_podman_auto_update_timer_settings: "{{ __testing_timer_settings_saved }}"


- name: "Molecule | Verify | Timer settings | event-only integration: re-apply the role with the restored settings"
  ansible.builtin.include_role:
    name: "foundata.podman.host"


- name: "Molecule | Verify | Timer settings | event-only integration: run pending handlers again"
  ansible.builtin.meta: flush_handlers


## Timer settings: triggerless settings accepted while the timer is unmanaged
#
# The "keeps at least one trigger" check mirrors the conditions under which the
# config tasks manage the timer. Prove the mirroring: with host_podman_auto_update set to false
# the same triggerless settings that are rejected above must pass init.

- name: "Molecule | Verify | Timer settings | unmanaged: save the current settings and flags"
  ansible.builtin.set_fact:
    __testing_timer_settings_saved: "{{ host_podman_auto_update_timer_settings | ansible.builtin.default({}) }}"
    __testing_timer_autoupdate_saved: "{{ host_podman_auto_update | ansible.builtin.default(true) }}"
    host_podman_auto_update_timer_settings:
      OnCalendar: []
    host_podman_auto_update: false


- name: "Molecule | Verify | Timer settings | unmanaged: include the role's init (must accept triggerless settings)"
  ansible.builtin.include_role:
    name: "foundata.podman.host"
    tasks_from: "init"
    # This verify file never exposes the role's variables to the play; export
    # them so the lazily computed effective settings can be asserted below.
    public: true


- name: "Molecule | Verify | Timer settings | unmanaged: assert the triggerless settings were in effect"
  ansible.builtin.assert:
    that:
      - (__host_podman_auto_update_timer_settings_effective['OnCalendar'] | ansible.builtin.length) == 0
    fail_msg: >-
      The triggerless settings were not in effect during the init run, the acceptance
      is vacuous. Got: {{ __host_podman_auto_update_timer_settings_effective }}
    success_msg: >-
      Triggerless settings pass init while the timer is not managed, so the trigger
      check mirrors the management conditions.


- name: "Molecule | Verify | Timer settings | unmanaged: restore the saved settings and flags"
  ansible.builtin.set_fact:
    host_podman_auto_update_timer_settings: "{{ __testing_timer_settings_saved }}"
    host_podman_auto_update: "{{ __testing_timer_autoupdate_saved }}"


## Timer settings: triggerless settings accepted while the service state is unmanaged
#
# The case above disables host_podman_auto_update, a condition the trigger
# check carried from the start. The service-state condition is one of the newly
# mirrored ones, so it needs its own case: with automatic updates still
# enabled, host_podman_service_state set to unmanaged alone must make the
# triggerless settings pass.

- name: "Molecule | Verify | Timer settings | service state unmanaged: save the settings and flags"
  ansible.builtin.set_fact:
    __testing_timer_settings_saved: "{{ host_podman_auto_update_timer_settings | ansible.builtin.default({}) }}"
    __testing_timer_service_state_saved: "{{ host_podman_service_state | ansible.builtin.default('enabled') }}"
    host_podman_auto_update_timer_settings:
      OnCalendar: []
    host_podman_service_state: "unmanaged"


- name: "Molecule | Verify | Timer settings | service state unmanaged: include the role's init (must accept triggerless settings)"
  ansible.builtin.include_role:
    name: "foundata.podman.host"
    tasks_from: "init"
    # Export the role's variables so the lazily computed effective settings can
    # be asserted below (this verify file never exposes them otherwise).
    public: true


- name: "Molecule | Verify | Timer settings | service state unmanaged: assert the triggerless settings were in effect"
  ansible.builtin.assert:
    that:
      - (__host_podman_auto_update_timer_settings_effective['OnCalendar'] | ansible.builtin.length) == 0
    fail_msg: >-
      The triggerless settings were not in effect during the init run, the acceptance
      is vacuous. Got: {{ __host_podman_auto_update_timer_settings_effective }}
    success_msg: >-
      Triggerless settings pass init while the service state is unmanaged, so the
      trigger check mirrors the management conditions.


- name: "Molecule | Verify | Timer settings | service state unmanaged: restore the saved settings and flags"
  ansible.builtin.set_fact:
    host_podman_auto_update_timer_settings: "{{ __testing_timer_settings_saved }}"
    host_podman_service_state: "{{ __testing_timer_service_state_saved }}"


## Timer settings: triggerless settings accepted on a non-systemd service manager
#
# The service-manager condition is the remaining newly mirrored one. Passing
# ansible_facts as an include variable shadows the magic mapping for that
# include only, so the real gathered facts stay untouched and nothing needs
# restoring.

- name: "Molecule | Verify | Timer settings | non-systemd: save the settings and build the fact override"
  ansible.builtin.set_fact:
    __testing_timer_settings_saved: "{{ host_podman_auto_update_timer_settings | ansible.builtin.default({}) }}"
    __testing_facts_override: "{{ ansible_facts | ansible.builtin.combine({'service_mgr': 'openrc'}) }}"
    host_podman_auto_update_timer_settings:
      OnCalendar: []


- name: "Molecule | Verify | Timer settings | non-systemd: include the role's init (must accept triggerless settings)"
  ansible.builtin.include_role:
    name: "foundata.podman.host"
    tasks_from: "init"
    public: true
  vars:
    ansible_facts: "{{ __testing_facts_override }}"


- name: "Molecule | Verify | Timer settings | non-systemd: assert the triggerless settings were in effect"
  ansible.builtin.assert:
    that:
      - (__host_podman_auto_update_timer_settings_effective['OnCalendar'] | ansible.builtin.length) == 0
    fail_msg: >-
      The triggerless settings were not in effect during the init run, the acceptance
      is vacuous. Got: {{ __host_podman_auto_update_timer_settings_effective }}
    success_msg: >-
      Triggerless settings pass init on a non-systemd service manager, so the trigger
      check mirrors the management conditions.


- name: "Molecule | Verify | Timer settings | non-systemd: restore the saved settings"
  ansible.builtin.set_fact:
    host_podman_auto_update_timer_settings: "{{ __testing_timer_settings_saved }}"


## Subordinate ID validation (init-only)
#
# host_podman_rootless_users writes to the shared /etc/subuid and /etc/subgid
# files; malformed or colliding input must be rejected before anything gets
# written. Each rejection case runs the role's init with one invalid list and
# expects the run to fail inside the subordinate ID validation.

- name: "Molecule | Verify | Run subordinate ID rejection checks (init-only)"
  ansible.builtin.include_tasks:
    file: >-
      {{ (lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY')
          | ansible.builtin.default('../../default')) }}/tasks/verify/checks/subid-reject.yml
  vars:
    __testing_reject_case: "{{ item }}"
  loop:
    - label: "duplicate account names"
      users:
        - name: "dupuser"
        - name: "dupuser"
    - label: "malformed range separator"
      users:
        - name: "someuser"
          subuid: "20000-20000"
    - label: "non-numeric range"
      users:
        - name: "someuser"
          subgid: "abc:65536"
    - label: "zero start (would map the host's root ID)"
      users:
        - name: "someuser"
          subuid: "0:65536"
    - label: "zero count"
      users:
        - name: "someuser"
          subgid: "20000:0"
    - label: "overlapping explicit ranges between entries"
      users:
        - name: "someuser"
          subuid: "20000:20000"
        - name: "otheruser"
          subuid: "30000:20000"
  loop_control:
    label: "{{ item['label'] }}"


## Subordinate ID validation: overlap with existing assignments (integration)
#
# The init-only cases above are static; the overlap against ranges already
# assigned on the host is only checkable at execution time. The converge gave
# 'containerapp' the explicit range 20000:20000 ([20000, 40000)), so a second
# account requesting 30000:20000 ([30000, 50000)) must be rejected by the
# config tasks before anything is written to /etc/subuid.

- name: "Molecule | Verify | Subid overlap integration: create a second test account"
  ansible.builtin.user:
    name: "overlapuser"
    state: "present"
    system: true
    password: "!"


- name: "Molecule | Verify | Subid overlap integration: run the role and expect rejection"
  block:

    - name: "Molecule | Verify | Subid overlap integration: include the role with an overlapping range"
      ansible.builtin.include_role:
        name: "foundata.podman.host"
      vars:
        host_podman_rootless_users:
          - name: "overlapuser"
            # linger off: the account is removed again right below and must
            # not keep a running user manager behind
            linger: false
            subuid: "30000:20000"

    - name: "Molecule | Verify | Subid overlap integration: fail because the overlap was accepted"
      ansible.builtin.fail:
        msg: >-
          The subordinate UID range 30000:20000 overlapping the existing
          containerapp assignment 20000:20000 was accepted by the role.

  rescue:

    - name: "Molecule | Verify | Subid overlap integration: assert the run failed in the overlap check"
      ansible.builtin.assert:
        that:
          - >-
            (ansible_failed_task['name'] | ansible.builtin.default(''))
            is ansible.builtin.search('do not overlap assignments of other accounts')
        fail_msg: >-
          The run failed, but not in the overlap check as expected
          (failed task: '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: "The overlapping explicit range was rejected at execution time."

  always:

    - name: "Molecule | Verify | Subid overlap integration: query /etc/subuid for the second account"
      ansible.builtin.command:
        argv:
          - "/usr/bin/grep"
          - "-E"
          - "^overlapuser:"
          - "/etc/subuid"
          - "/etc/subgid"
      register: __testing_subid_overlap_grep
      changed_when: false
      failed_when:
        - __testing_subid_overlap_grep['rc'] not in [0, 1]

    - name: "Molecule | Verify | Subid overlap integration: assert nothing was written for the second account"
      ansible.builtin.assert:
        that:
          - __testing_subid_overlap_grep['rc'] == 1
        fail_msg: >-
          The rejected range still ended up in /etc/subuid or /etc/subgid:
          {{ __testing_subid_overlap_grep['stdout_lines'] | ansible.builtin.default([]) }}
        success_msg: "The rejected range was not written to /etc/subuid or /etc/subgid."

    - name: "Molecule | Verify | Subid overlap integration: remove the second test account"
      ansible.builtin.user:
        name: "overlapuser"
        state: "absent"
        remove: true


## storage.conf / policy.json transition contract
#
# Supplying host_podman_storage / host_podman_policy replaces whole
# distribution files; clearing them again (or uninstalling) must restore the
# saved pre-role original instead of leaving the last role-written file in
# effect. This block is self-contained: it captures the current state (the
# earlier role runs in this verify used empty settings, which must have
# cleared the converge-managed state already), applies settings, clears them
# again and compares against the capture. The converge state is re-applied at
# the end.

# Not every platform ships a stock policy.json or storage.conf, so the
# captures tolerate absence and the assertions compare against the captured
# existence state.
- name: "Molecule | Verify | Transition: check for a current policy.json"
  ansible.builtin.stat:
    path: "/etc/containers/policy.json"
  register: __testing_transition_policy_pre_stat


- name: "Molecule | Verify | Transition: read the current policy.json (if any)"
  ansible.builtin.slurp:
    src: "/etc/containers/policy.json"
  register: __testing_transition_policy_pre
  when:
    - __testing_transition_policy_pre_stat['stat']['exists']


- name: "Molecule | Verify | Transition: check for a current storage.conf"
  ansible.builtin.stat:
    path: "/etc/containers/storage.conf"
  register: __testing_transition_storage_pre_stat


- name: "Molecule | Verify | Transition: read the current storage.conf (if any)"
  ansible.builtin.slurp:
    src: "/etc/containers/storage.conf"
  register: __testing_transition_storage_pre
  when:
    - __testing_transition_storage_pre_stat['stat']['exists']


# This also proves the implicit clear: the earlier role includes in this
# verify ran with empty storage/policy settings against the converge-managed
# state, which must have restored the stock files.
- name: "Molecule | Verify | Transition: assert the starting point is unmanaged"
  ansible.builtin.assert:
    that:
      - >-
        (not __testing_transition_storage_pre_stat['stat']['exists'])
        or ('Managed by Ansible (foundata.podman.host)'
            not in (__testing_transition_storage_pre['content'] | ansible.builtin.b64decode))
    fail_msg: >-
      storage.conf still carries the role marker before the transition test,
      so the earlier role runs with empty settings did not clear the managed
      state.
    success_msg: "The starting point is unmanaged (the implicit clears worked)."


- name: "Molecule | Verify | Transition: apply storage and policy settings"
  ansible.builtin.include_role:
    name: "foundata.podman.host"
  vars:
    host_podman_storage:
      storage:
        driver: "overlay"
    host_podman_policy:
      default:
        - type: "insecureAcceptAnything"


- name: "Molecule | Verify | Transition: read the managed storage.conf and policy.json"
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: __testing_transition_managed_slurp
  loop:
    - "/etc/containers/storage.conf"
    - "/etc/containers/policy.json"


- name: "Molecule | Verify | Transition: check for the saved pre-role originals"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_transition_backup_stat
  loop:
    - "/etc/containers/storage.conf.ansible-orig"
    - "/etc/containers/policy.json.ansible-orig"


- name: "Molecule | Verify | Transition: assert the managed state and the saved originals"
  ansible.builtin.assert:
    that:
      - >-
        'Managed by Ansible (foundata.podman.host)'
        in (__testing_transition_managed_slurp['results'][0]['content'] | ansible.builtin.b64decode)
      - >-
        (__testing_transition_managed_slurp['results'][1]['content']
         | ansible.builtin.b64decode | ansible.builtin.from_json)
        == {'default': [{'type': 'insecureAcceptAnything'}]}
      # the storage original is saved exactly when there was a pre-role file;
      # the policy backup always exists (zero-length sentinel when no pre-role
      # policy.json existed)
      - >-
        __testing_transition_backup_stat['results'][0]['stat']['exists']
        == __testing_transition_storage_pre_stat['stat']['exists']
      - __testing_transition_backup_stat['results'][1]['stat']['exists']
      - >-
        (__testing_transition_backup_stat['results'][1]['stat']['size'] | ansible.builtin.int > 0)
        == __testing_transition_policy_pre_stat['stat']['exists']
    fail_msg: >-
      Applying storage/policy settings did not produce the expected managed
      files and saved originals.
    success_msg: "The managed files are in place and the pre-role originals were saved."


- name: "Molecule | Verify | Transition: assert the saved storage.conf original matches the pre-role state"
  ansible.builtin.slurp:
    src: "/etc/containers/storage.conf.ansible-orig"
  register: __testing_transition_storage_backup
  when:
    - __testing_transition_storage_pre_stat['stat']['exists']


- name: "Molecule | Verify | Transition: check the saved originals carry the pre-role content"
  ansible.builtin.assert:
    that:
      - >-
        (not __testing_transition_storage_pre_stat['stat']['exists'])
        or (__testing_transition_storage_backup['content'] == __testing_transition_storage_pre['content'])
    fail_msg: "The saved storage.conf original does not match the pre-role file."
    success_msg: "The saved storage.conf original matches the pre-role file."


- name: "Molecule | Verify | Transition: clear the settings again"
  ansible.builtin.include_role:
    name: "foundata.podman.host"
  vars:
    host_podman_storage: {}
    host_podman_policy: {}


- name: "Molecule | Verify | Transition: check the resulting files and backups"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_transition_post_stat
  loop:
    - "/etc/containers/storage.conf"
    - "/etc/containers/storage.conf.ansible-orig"
    - "/etc/containers/policy.json.ansible-orig"
    - "/etc/containers/policy.json"


- name: "Molecule | Verify | Transition: read the resulting policy.json (if any)"
  ansible.builtin.slurp:
    src: "/etc/containers/policy.json"
  register: __testing_transition_policy_post
  when:
    - __testing_transition_post_stat['results'][3]['stat']['exists']


- name: "Molecule | Verify | Transition: read the restored storage.conf (if any)"
  ansible.builtin.slurp:
    src: "/etc/containers/storage.conf"
  register: __testing_transition_storage_post
  when:
    - __testing_transition_post_stat['results'][0]['stat']['exists']


- name: "Molecule | Verify | Transition: assert the pre-role state was restored"
  ansible.builtin.assert:
    that:
      # storage.conf: restored original or removed, matching the pre-role state
      - >-
        __testing_transition_post_stat['results'][0]['stat']['exists']
        == __testing_transition_storage_pre_stat['stat']['exists']
      - >-
        (not __testing_transition_storage_pre_stat['stat']['exists'])
        or (__testing_transition_storage_post['content'] == __testing_transition_storage_pre['content'])
      # policy.json: the pre-role state is in effect again (the saved trust
      # policy, or no file at all when none existed before)
      - >-
        __testing_transition_post_stat['results'][3]['stat']['exists']
        == __testing_transition_policy_pre_stat['stat']['exists']
      - >-
        (not __testing_transition_policy_pre_stat['stat']['exists'])
        or (__testing_transition_policy_post['content'] == __testing_transition_policy_pre['content'])
      # the saved originals are cleaned up
      - not __testing_transition_post_stat['results'][1]['stat']['exists']
      - not __testing_transition_post_stat['results'][2]['stat']['exists']
    fail_msg: >-
      Clearing the storage/policy settings did not restore the pre-role state
      (stale role-written files or leftover saved originals remain).
    success_msg: "Clearing the settings restored the pre-role state."


# Leave the system in the converge-managed state, as converge configured it.
- name: "Molecule | Verify | Transition: re-apply the converge state"
  ansible.builtin.include_role:
    name: "foundata.podman.host"
  vars:
    host_podman_storage:
      storage:
        driver: "overlay"
    host_podman_policy:
      default:
        - type: "insecureAcceptAnything"
