# Included in a loop from role-host.yml, once per __testing_reject_case
# ({label, users}). Applies an invalid host_podman_rootless_users list, runs
# the role's init and expects it to fail in the subordinate ID validation. The
# previous value is restored afterwards, so later tasks keep seeing the
# converge state.

- name: "Molecule | Verify | Subid reject | save the current list: {{ __testing_reject_case['label'] }}"
  ansible.builtin.set_fact:
    __testing_subid_reject_saved: "{{ lookup('ansible.builtin.vars', 'host_podman_rootless_users', default=[]) }}"


- name: "Molecule | Verify | Subid reject | apply the invalid list: {{ __testing_reject_case['label'] }}"
  ansible.builtin.set_fact:
    host_podman_rootless_users: "{{ __testing_reject_case['users'] }}"


- name: "Molecule | Verify | Subid reject | run init and expect rejection: {{ __testing_reject_case['label'] }}"
  block:

    - name: "Molecule | Verify | Subid reject | include the role's init: {{ __testing_reject_case['label'] }}"
      ansible.builtin.include_role:
        name: "foundata.podman.host"
        tasks_from: "init"

    - name: "Molecule | Verify | Subid reject | fail because the list was accepted: {{ __testing_reject_case['label'] }}"
      ansible.builtin.fail:
        msg: >-
          The invalid host_podman_rootless_users list
          '{{ __testing_reject_case['users'] }}' was accepted by the role's init.

  rescue:

    - name: "Molecule | Verify | Subid reject | assert init failed in the subordinate ID validation: {{ __testing_reject_case['label'] }}"
      ansible.builtin.assert:
        that:
          - >-
            (ansible_failed_task['name'] | ansible.builtin.default(''))
            is ansible.builtin.search('names in host_podman_rootless_users are unique|ranges are well-formed|ranges do not overlap between entries')
        fail_msg: >-
          The run failed, but not in the subordinate ID validation as expected
          (failed task: '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: >-
          The invalid list was rejected by the role's init
          ('{{ ansible_failed_task['name'] | ansible.builtin.default('') }}').

  always:

    - name: "Molecule | Verify | Subid reject | restore the saved list: {{ __testing_reject_case['label'] }}"
      ansible.builtin.set_fact:
        host_podman_rootless_users: "{{ __testing_subid_reject_saved }}"
