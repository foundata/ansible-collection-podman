# Verify the state after the "quadlet" role converge (the rootful "webtest"
# and the rootless "usertest" application).

### Rootful application ("webtest")

- name: "Molecule | Verify | quadlet | Read the webtest container unit file"
  ansible.builtin.slurp:
    src: "/etc/containers/systemd/webtest.container"
  register: __testing_quadlet_webtest_unit_slurp


- name: "Molecule | Verify | quadlet | Check the webtest container unit content"
  ansible.builtin.assert:
    that:
      # ownership marker (load-bearing for the cleanup logic)
      - "'Managed by Ansible (foundata.podman.quadlet): app=webtest' in __testing_quadlet_webtest_unit_content"
      - "'Image=quay.io/libpod/testimage:20241011' in __testing_quadlet_webtest_unit_content"
      - "'Secret=webtest_secret,type=env,target=WEBTEST_SECRET' in __testing_quadlet_webtest_unit_content"
      # whitespace value quoted for systemd (unquoted it would be word-split)
      - "'Environment=\"WEBTEST_SPACES=first second\"' in __testing_quadlet_webtest_unit_content"
      # dependency expansion: "webtest-data" (volume) -> webtest-data-volume.service
      - "'After=webtest-data-volume.service' in __testing_quadlet_webtest_unit_content"
      # unit defaults merged into the [Service] section
      - "'Restart=on-failure' in __testing_quadlet_webtest_unit_content"
    quiet: true
  vars:
    __testing_quadlet_webtest_unit_content: "{{ __testing_quadlet_webtest_unit_slurp['content'] | ansible.builtin.b64decode }}"


## ServiceName override ("svctest" unit, service "webtest-alias.service")

- name: "Molecule | Verify | quadlet | Query the state of the overridden and the derived service name"
  ansible.builtin.command:
    argv: ["systemctl", "is-active", "{{ item }}"]
  register: __testing_quadlet_svcname_state
  changed_when:
    - false
  failed_when:
    - false
  loop:
    - "webtest-alias.service"
    - "svctest.service"


- name: "Molecule | Verify | quadlet | Assert the service runs under the overridden name only"
  ansible.builtin.assert:
    that:
      - __testing_quadlet_svcname_state['results'][0]['stdout'] == 'active'
      - __testing_quadlet_svcname_state['results'][1]['stdout'] != 'active'
    fail_msg: >-
      ServiceName override not honored:
      webtest-alias.service={{ __testing_quadlet_svcname_state['results'][0]['stdout'] }},
      svctest.service={{ __testing_quadlet_svcname_state['results'][1]['stdout'] }}.
    success_msg: "The unit runs as webtest-alias.service, as its ServiceName demands."


# The quoting must survive the whole chain (unit file -> Quadlet generator
# -> podman --env -> container): the variable has to arrive with both words.
- name: "Molecule | Verify | quadlet | Read the environment of the running webtest container"
  ansible.builtin.command:
    argv: ["podman", "exec", "webtest", "env"]
  register: __testing_quadlet_webtest_env
  changed_when:
    - false


- name: "Molecule | Verify | quadlet | Assert the whitespace environment value arrived intact"
  ansible.builtin.assert:
    that:
      - "'WEBTEST_SPACES=first second' in __testing_quadlet_webtest_env['stdout_lines']"
    fail_msg: >-
      The whitespace-containing environment value was corrupted on its way
      into the container:
      {{ __testing_quadlet_webtest_env['stdout_lines'] | ansible.builtin.select('ansible.builtin.match', '^WEBTEST_') | ansible.builtin.list }}
    success_msg: "Whitespace-containing environment values arrive in the container intact."


- name: "Molecule | Verify | quadlet | Query the webtest service state"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "is-active"
      - "webtest.service"
  register: __testing_quadlet_webtest_active_result
  changed_when: false


- name: "Molecule | Verify | quadlet | Check the webtest service is active"
  ansible.builtin.assert:
    that:
      - __testing_quadlet_webtest_active_result['stdout'] == 'active'
    quiet: true


- name: "Molecule | Verify | quadlet | Query the Podman secrets"
  ansible.builtin.command:
    argv:
      - "/usr/bin/podman"
      - "secret"
      - "ls"
      - "--format"
      - "{{ '{{.Name}}' }}"
  register: __testing_quadlet_secret_result
  changed_when: false


- name: "Molecule | Verify | quadlet | Check the webtest secret exists"
  ansible.builtin.assert:
    that:
      - "'webtest_secret' in __testing_quadlet_secret_result['stdout_lines']"
    quiet: true


- name: "Molecule | Verify | quadlet | Read the webtest environment file"
  ansible.builtin.slurp:
    src: "/var/lib/webtest/app.env"
  register: __testing_quadlet_webtest_env_slurp


- name: "Molecule | Verify | quadlet | Check the webtest environment file content"
  ansible.builtin.assert:
    that:
      - "'WEBTEST_GREETING=hello' in (__testing_quadlet_webtest_env_slurp['content'] | ansible.builtin.b64decode)"
    quiet: true


## Run-once patterns and plain systemd units (rootful "webtest")

- name: "Molecule | Verify | quadlet | Read the webtest-job container unit file"
  ansible.builtin.slurp:
    src: "/etc/containers/systemd/webtest-job.container"
  register: __testing_quadlet_job_unit_slurp


- name: "Molecule | Verify | quadlet | Check the null-drop rendering of the webtest-job unit"
  ansible.builtin.assert:
    that:
      - "'Managed by Ansible (foundata.podman.quadlet): app=webtest' in __testing_quadlet_job_unit_content"
      # "Restart: ~" dropped the unit_defaults Restart (and thereby the whole
      # Service section), "Install: ~" suppressed any Install section
      - "'Restart=' not in __testing_quadlet_job_unit_content"
      - "'[Service]' not in __testing_quadlet_job_unit_content"
      - "'[Install]' not in __testing_quadlet_job_unit_content"
    fail_msg: >-
      A null section/setting value did not drop the entry from the rendered
      unit. Content: {{ __testing_quadlet_job_unit_content }}
    quiet: true
  vars:
    __testing_quadlet_job_unit_content: "{{ __testing_quadlet_job_unit_slurp['content'] | ansible.builtin.b64decode }}"


- name: "Molecule | Verify | quadlet | Read the webtest-job timer unit file"
  ansible.builtin.slurp:
    src: "/etc/systemd/system/webtest-job.timer"
  register: __testing_quadlet_timer_unit_slurp


- name: "Molecule | Verify | quadlet | Check the webtest-job timer unit content"
  ansible.builtin.assert:
    that:
      # ownership marker (load-bearing for the cleanup logic)
      - "'Managed by Ansible (foundata.podman.quadlet): app=webtest' in __testing_quadlet_timer_unit_content"
      # [Timer] Unit= expansion: "webtest-job" -> webtest-job.service
      - "'Unit=webtest-job.service' in __testing_quadlet_timer_unit_content"
      - "'OnCalendar=2099-01-01 03:00:00' in __testing_quadlet_timer_unit_content"
    quiet: true
  vars:
    __testing_quadlet_timer_unit_content: "{{ __testing_quadlet_timer_unit_slurp['content'] | ansible.builtin.b64decode }}"


- name: "Molecule | Verify | quadlet | Read the webtest-sock socket unit file"
  ansible.builtin.slurp:
    src: "/etc/systemd/system/webtest-sock.socket"
  register: __testing_quadlet_socket_unit_slurp


- name: "Molecule | Verify | quadlet | Check the webtest-sock socket unit content"
  ansible.builtin.assert:
    that:
      - "'Managed by Ansible (foundata.podman.quadlet): app=webtest' in __testing_quadlet_socket_unit_content"
      # [Socket] Service= expansion: "webtest-job" -> webtest-job.service
      - "'Service=webtest-job.service' in __testing_quadlet_socket_unit_content"
    quiet: true
  vars:
    __testing_quadlet_socket_unit_content: "{{ __testing_quadlet_socket_unit_slurp['content'] | ansible.builtin.b64decode }}"


- name: "Molecule | Verify | quadlet | Query the webtest-job timer and webtest-sock socket state"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "{{ item[0] }}"
      - "{{ item[1] }}"
  changed_when: false
  failed_when: false
  loop:
    - ["is-enabled", "webtest-job.timer"]
    - ["is-active", "webtest-job.timer"]
    - ["is-enabled", "webtest-sock.socket"]
    - ["is-active", "webtest-sock.socket"]
  register: __testing_quadlet_timer_state_result


- name: "Molecule | Verify | quadlet | Check the webtest-job timer and webtest-sock socket are enabled and active"
  ansible.builtin.assert:
    that:
      # plain units support real systemctl enablement (unlike generated ones)
      - __testing_quadlet_timer_state_result['results'][0]['stdout'] == 'enabled'
      - __testing_quadlet_timer_state_result['results'][1]['stdout'] == 'active'
      - __testing_quadlet_timer_state_result['results'][2]['stdout'] == 'enabled'
      - __testing_quadlet_timer_state_result['results'][3]['stdout'] == 'active'
    fail_msg: >-
      The webtest-job timer or webtest-sock socket is not enabled/active:
      {{ __testing_quadlet_timer_state_result['results'] | ansible.builtin.map(attribute='stdout') | ansible.builtin.list }}
    quiet: true


- name: "Molecule | Verify | quadlet | Query the run-once service states"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "is-active"
      - "{{ item }}"
  changed_when: false
  failed_when: false
  loop:
    - "webtest-job.service"
    - "webtest-init.service"
  register: __testing_quadlet_runonce_state_result


- name: "Molecule | Verify | quadlet | Check the run-once service states"
  ansible.builtin.assert:
    that:
      # "unmanaged": deployed but never started by the role
      - __testing_quadlet_runonce_state_result['results'][0]['stdout'] == 'inactive'
      # RemainAfterExit: started once by the role, parked in "active (exited)"
      # (this also keeps the start task idempotent on the second converge)
      - __testing_quadlet_runonce_state_result['results'][1]['stdout'] == 'active'
    fail_msg: >-
      Unexpected run-once service states (job should be inactive, init
      active):
      {{ __testing_quadlet_runonce_state_result['results'] | ansible.builtin.map(attribute='stdout') | ansible.builtin.list }}
    quiet: true


## Check mode on the deployed application
#
# A --check run against the deployed application must succeed (regression:
# the read-only Podman version probe was skipped in check mode and the next
# task failed dereferencing the missing stdout) and must not change anything.
# Only the app identity is passed, so a REAL run with these variables would
# reap the deployed units; the surviving unit file below proves check mode
# did not.

- name: "Molecule | Verify | quadlet | Run the role in check mode on the deployed application"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
    apply:
      check_mode: true
  vars:
    quadlet_podman_app: "webtest"
    quadlet_podman_state: "present"


- name: "Molecule | Verify | quadlet | Check mode: get information about the webtest unit file"
  ansible.builtin.stat:
    path: "/etc/containers/systemd/webtest.container"
  register: __testing_quadlet_checkmode_unit_stat


- name: "Molecule | Verify | quadlet | Check mode: assert nothing was changed"
  ansible.builtin.assert:
    that:
      - __testing_quadlet_checkmode_unit_stat['stat']['exists']
    fail_msg: "The check-mode run removed the deployed webtest unit file."
    success_msg: "The check-mode run succeeded without changing the deployed application."


### Rootless application ("usertest", account "containerapp")

- name: "Molecule | Verify | quadlet | Read the usertest container unit file (rootless)"
  ansible.builtin.slurp:
    src: "/var/lib/podman/containerapp/.config/containers/systemd/usertest.container"
  register: __testing_quadlet_usertest_unit_slurp


- name: "Molecule | Verify | quadlet | Check the usertest container unit content (rootless)"
  ansible.builtin.assert:
    that:
      - "'Managed by Ansible (foundata.podman.quadlet): app=usertest' in __testing_quadlet_usertest_unit_content"
      - "'Image=quay.io/libpod/testimage:20241011' in __testing_quadlet_usertest_unit_content"
    quiet: true
  vars:
    __testing_quadlet_usertest_unit_content: "{{ __testing_quadlet_usertest_unit_slurp['content'] | ansible.builtin.b64decode }}"


- name: "Molecule | Verify | quadlet | Determine the UID of the rootless account"
  ansible.builtin.getent:
    database: "passwd"
    key: "containerapp"


# The molecule instances are virtual machines, so the rootless START is
# testable on every platform (see the comment in
# tasks/converge/role-quadlet.yml).
- name: "Molecule | Verify | quadlet | Query the usertest service state (rootless)"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "--user"
      - "is-active"
      - "usertest.service"
  become: true
  become_user: "containerapp"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['containerapp'][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['getent_passwd']['containerapp'][1] }}/bus"
  register: __testing_quadlet_usertest_active_result
  changed_when: false


- name: "Molecule | Verify | quadlet | Check the usertest service is active (rootless)"
  ansible.builtin.assert:
    that:
      - __testing_quadlet_usertest_active_result['stdout'] == 'active'
    quiet: true


# The manifest's file paths get removed with root privileges on later runs,
# so the rootless account must not be able to edit it: root-owned, not
# group/world-writable and outside the account's writable tree. A user-owned
# manifest would let the service account have arbitrary paths (e.g.
# /etc/shadow) deleted as root.
- name: "Molecule | Verify | quadlet | Get information about the rootless manifest"
  ansible.builtin.stat:
    path: "/var/lib/ansible-podman-quadlet/user-containerapp/usertest.ansible-manifest"
  register: __testing_quadlet_usertest_manifest_stat


- name: "Molecule | Verify | quadlet | Check the rootless manifest is out of the account's reach"
  ansible.builtin.assert:
    that:
      - __testing_quadlet_usertest_manifest_stat['stat']['exists']
      - __testing_quadlet_usertest_manifest_stat['stat']['pw_name'] == 'root'
      - __testing_quadlet_usertest_manifest_stat['stat']['gr_name'] == 'root'
      - __testing_quadlet_usertest_manifest_stat['stat']['mode'] == '0600'
    fail_msg: >-
      The rootless manifest is missing or writable by the service account;
      its recorded paths get removed as root, so this would allow arbitrary
      file deletion with root privileges.
    success_msg: "The rootless manifest is root-owned and out of the account's reach."


## Plain systemd user units (rootless "usertest")

- name: "Molecule | Verify | quadlet | Read the usertest-job timer unit file (rootless)"
  ansible.builtin.slurp:
    src: "/var/lib/podman/containerapp/.config/systemd/user/usertest-job.timer"
  register: __testing_quadlet_usertimer_slurp


- name: "Molecule | Verify | quadlet | Check the usertest-job timer unit content (rootless)"
  ansible.builtin.assert:
    that:
      - "'Managed by Ansible (foundata.podman.quadlet): app=usertest' in __testing_quadlet_usertimer_content"
      # a value containing a dot is passed through verbatim
      - "'Unit=usertest-job.service' in __testing_quadlet_usertimer_content"
    quiet: true
  vars:
    __testing_quadlet_usertimer_content: "{{ __testing_quadlet_usertimer_slurp['content'] | ansible.builtin.b64decode }}"


- name: "Molecule | Verify | quadlet | Query the plain user unit states (rootless)"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "--user"
      - "{{ item[0] }}"
      - "{{ item[1] }}"
  become: true
  become_user: "containerapp"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['containerapp'][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['getent_passwd']['containerapp'][1] }}/bus"
  changed_when: false
  failed_when: false
  loop:
    - ["is-enabled", "usertest-job.timer"]
    - ["is-active", "usertest-job.timer"]
    - ["is-active", "usertest-job.service"]
  register: __testing_quadlet_userunit_state_result


- name: "Molecule | Verify | quadlet | Check the plain user unit states (rootless)"
  ansible.builtin.assert:
    that:
      - __testing_quadlet_userunit_state_result['results'][0]['stdout'] == 'enabled'
      - __testing_quadlet_userunit_state_result['results'][1]['stdout'] == 'active'
      # "unmanaged": deployed but never started by the role
      - __testing_quadlet_userunit_state_result['results'][2]['stdout'] == 'inactive'
    fail_msg: >-
      Unexpected plain user unit states (timer should be enabled and active,
      the unmanaged oneshot service inactive):
      {{ __testing_quadlet_userunit_state_result['results'] | ansible.builtin.map(attribute='stdout') | ansible.builtin.list }}
    quiet: true


# An administrator's own unit file (no ownership marker): the cleanup and
# uninstall sweeps below must leave it alone even though it lives in the unit
# directory. The content mentions the webtest marker as a substring on
# purpose: ownership requires the exact marker line, a mere mention (e.g.
# quoted in a comment) must not get the file deleted. Planted before the reap
# re-runs so both the cleanup and the uninstall sweeps process it.
- name: "Molecule | Verify | quadlet | Plant an administrator-owned unit file without the marker"
  ansible.builtin.copy:
    dest: "/etc/containers/systemd/admin-own-decoy.container"
    content: |
      # hand-made by the administrator, not Ansible. Files containing the
      # exact "# Managed by Ansible (foundata.podman.quadlet): app=webtest"
      # line are owned by the webtest application; this one merely quotes it.
      [Container]
      ContainerName=admin-own-decoy
      Image=quay.io/libpod/testimage:20241011
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o="


# Same protection for the shared systemd unit directory: the plain-unit
# sweeps only own marker-carrying files and must leave every other unit file
# (the vast majority in /etc/systemd/system) alone.
- name: "Molecule | Verify | quadlet | Plant an administrator-owned timer file without the marker"
  ansible.builtin.copy:
    dest: "/etc/systemd/system/admin-own-decoy.timer"
    content: |
      # hand-made by the administrator, not Ansible; merely quotes the
      # "# Managed by Ansible (foundata.podman.quadlet): app=webtest" marker.
      [Timer]
      OnCalendar=2099-01-01 03:00:00
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o="


## Application manifest and cleanup reconciliation (rootful "webtest")
#
# The role records secrets, managed files and registry logins in a
# per-application manifest so renamed or de-listed resources get cleaned up
# and "absent" removes the application completely. The blocks below verify the
# manifest content after converge, the reap of de-listed resources, the
# registry logout reconciliation (offline, via a crafted authfile entry) and
# finally the complete removal with empty declared lists. The removal test
# runs last on purpose and leaves the webtest application uninstalled.

- name: "Molecule | Verify | quadlet | Read the webtest application manifest"
  ansible.builtin.slurp:
    src: "/var/lib/ansible-podman-quadlet/system/webtest.ansible-manifest"
  register: __testing_quadlet_manifest_slurp


- name: "Molecule | Verify | quadlet | Check the manifest records the converge resources"
  ansible.builtin.assert:
    that:
      - "'Managed by Ansible (foundata.podman.quadlet): app=webtest' in __testing_quadlet_manifest_content"
      - __testing_quadlet_manifest_parsed['secrets'] == ['webtest_secret']
      - __testing_quadlet_manifest_parsed['files'] == ['/var/lib/webtest/app.env']
      - (__testing_quadlet_manifest_parsed['registries'] | ansible.builtin.length) == 0
    fail_msg: >-
      The webtest manifest does not record the converge resources.
      Content: {{ __testing_quadlet_manifest_content }}
    success_msg: "The webtest manifest records the converge resources."
  vars:
    __testing_quadlet_manifest_content: "{{ __testing_quadlet_manifest_slurp['content'] | ansible.builtin.b64decode }}"
    __testing_quadlet_manifest_parsed: "{{ __testing_quadlet_manifest_content | ansible.builtin.from_yaml }}"


- name: "Molecule | Verify | quadlet | Reap: re-run the role with an additional secret and file"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "webtest"
    quadlet_podman_state: "present"
    quadlet_podman_service_state: "enabled"
    quadlet_podman_directories:
      - path: "/var/lib/webtest"
    quadlet_podman_files:
      - dest: "/var/lib/webtest/app.env"
        content: |
          WEBTEST_GREETING=hello
      - dest: "/var/lib/webtest/temp.env"
        content: |
          WEBTEST_TEMP=value
    quadlet_podman_secrets:
      - name: "webtest_secret"
        value: "molecule-test-value"
      - name: "webtest_tempsecret"
        value: "molecule-temp-value"
    quadlet_podman_unit_defaults:
      container:
        Service:
          Restart: "on-failure"
    quadlet_podman_units:
      - name: "webtest-data"
        type: "volume"
        sections:
          Volume:
            VolumeName: "webtest-data"
      - name: "webtest"
        type: "container"
        sections:
          Unit:
            Description: "Molecule webtest container"
            After:
              - "webtest-data"
          Container:
            ContainerName: "webtest"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "top"
            Volume:
              - "webtest-data.volume:/data"
            EnvironmentFile:
              - "/var/lib/webtest/app.env"
            Secret:
              - "webtest_secret,type=env,target=WEBTEST_SECRET"
          Install:
            WantedBy:
              - "multi-user.target"


- name: "Molecule | Verify | quadlet | Reap: query the Podman secrets after adding"
  ansible.builtin.command:
    argv:
      - "/usr/bin/podman"
      - "secret"
      - "ls"
      - "--format"
      - "{{ '{{.Name}}' }}"
  register: __testing_quadlet_reap_added_secrets
  changed_when: false


- name: "Molecule | Verify | quadlet | Reap: read the manifest after adding"
  ansible.builtin.slurp:
    src: "/var/lib/ansible-podman-quadlet/system/webtest.ansible-manifest"
  register: __testing_quadlet_reap_added_manifest


- name: "Molecule | Verify | quadlet | Reap: check the additional resources exist and are recorded"
  ansible.builtin.assert:
    that:
      - "'webtest_tempsecret' in __testing_quadlet_reap_added_secrets['stdout_lines']"
      - "'webtest_tempsecret' in __testing_quadlet_reap_manifest_parsed['secrets']"
      - "'/var/lib/webtest/temp.env' in __testing_quadlet_reap_manifest_parsed['files']"
    fail_msg: >-
      The additional secret/file did not get created or recorded in the
      manifest.
    success_msg: "The additional secret and file exist and are recorded."
  vars:
    __testing_quadlet_reap_manifest_parsed: >-
      {{ __testing_quadlet_reap_added_manifest['content'] | ansible.builtin.b64decode | ansible.builtin.from_yaml }}


# Same input as converge again: the previously added secret and file are now
# de-listed (the rename scenario) and must be removed by the reconciliation.
# The de-listing below removes a declared file (temp.env). That has to
# restart the application services - a container consuming a removed file
# would otherwise keep using the dead copy until an unrelated restart - so
# the service start timestamp is recorded here and compared after the run
# (plus handler flush).
- name: "Molecule | Verify | quadlet | Reap: record the webtest start timestamp before de-listing"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "show"
      - "webtest.service"
      - "--property"
      - "ActiveEnterTimestampMonotonic"
      - "--value"
  register: __testing_quadlet_reap_started_before
  changed_when: false


- name: "Molecule | Verify | quadlet | Reap: re-run the role without the additional resources"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "webtest"
    quadlet_podman_state: "present"
    quadlet_podman_service_state: "enabled"
    quadlet_podman_directories:
      - path: "/var/lib/webtest"
    quadlet_podman_files:
      - dest: "/var/lib/webtest/app.env"
        content: |
          WEBTEST_GREETING=hello
    quadlet_podman_secrets:
      - name: "webtest_secret"
        value: "molecule-test-value"
    quadlet_podman_unit_defaults:
      container:
        Service:
          Restart: "on-failure"
    quadlet_podman_units:
      - name: "webtest-data"
        type: "volume"
        sections:
          Volume:
            VolumeName: "webtest-data"
      - name: "webtest"
        type: "container"
        sections:
          Unit:
            Description: "Molecule webtest container"
            After:
              - "webtest-data"
          Container:
            ContainerName: "webtest"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "top"
            Volume:
              - "webtest-data.volume:/data"
            EnvironmentFile:
              - "/var/lib/webtest/app.env"
            Secret:
              - "webtest_secret,type=env,target=WEBTEST_SECRET"
          Install:
            WantedBy:
              - "multi-user.target"


# The role notifies its restart handler for the removed file; run it now so
# the restart can be asserted (handlers otherwise wait for the end of the play).
- name: "Molecule | Verify | quadlet | Reap: flush the notified handlers"
  ansible.builtin.meta: "flush_handlers"


- name: "Molecule | Verify | quadlet | Reap: record the webtest start timestamp after de-listing"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "show"
      - "webtest.service"
      - "--property"
      - "ActiveEnterTimestampMonotonic"
      - "--value"
  register: __testing_quadlet_reap_started_after
  changed_when: false


- name: "Molecule | Verify | quadlet | Reap: check the removed file triggered a service restart"
  ansible.builtin.assert:
    that:
      - (__testing_quadlet_reap_started_after['stdout'] | ansible.builtin.int)
        > (__testing_quadlet_reap_started_before['stdout'] | ansible.builtin.int)
    fail_msg: >-
      Removing a declared file did not restart the application services
      (start timestamp {{ __testing_quadlet_reap_started_before['stdout'] }}
      unchanged) - the container would keep using the dead bind-mount source
      of the removed file until an unrelated restart.
    success_msg: "Removing a declared file restarted the application services."


- name: "Molecule | Verify | quadlet | Reap: query the Podman secrets after de-listing"
  ansible.builtin.command:
    argv:
      - "/usr/bin/podman"
      - "secret"
      - "ls"
      - "--format"
      - "{{ '{{.Name}}' }}"
  register: __testing_quadlet_reap_removed_secrets
  changed_when: false


- name: "Molecule | Verify | quadlet | Reap: check the temp file is gone"
  ansible.builtin.stat:
    path: "/var/lib/webtest/temp.env"
  register: __testing_quadlet_reap_tempfile_stat


- name: "Molecule | Verify | quadlet | Reap: read the manifest after de-listing"
  ansible.builtin.slurp:
    src: "/var/lib/ansible-podman-quadlet/system/webtest.ansible-manifest"
  register: __testing_quadlet_reap_removed_manifest


- name: "Molecule | Verify | quadlet | Reap: check the de-listed resources were removed"
  ansible.builtin.assert:
    that:
      - "'webtest_tempsecret' not in __testing_quadlet_reap_removed_secrets['stdout_lines']"
      - "'webtest_secret' in __testing_quadlet_reap_removed_secrets['stdout_lines']"
      - not __testing_quadlet_reap_tempfile_stat['stat']['exists']
      - __testing_quadlet_reap_manifest_parsed['secrets'] == ['webtest_secret']
      - __testing_quadlet_reap_manifest_parsed['files'] == ['/var/lib/webtest/app.env']
    fail_msg: >-
      De-listed resources survived the reconciliation (renamed secrets/files
      would linger forever).
    success_msg: "De-listed secret and file were removed, declared ones survived."
  vars:
    __testing_quadlet_reap_manifest_parsed: >-
      {{ __testing_quadlet_reap_removed_manifest['content'] | ansible.builtin.b64decode | ansible.builtin.from_yaml }}


# The two reap re-runs above also de-listed the run-once units and the timer
# (their variable sets carry neither webtest-init/webtest-job nor any
# quadlet_podman_systemd_units), so the marker-based sweeps must have removed
# the files and stopped the timer.
- name: "Molecule | Verify | quadlet | Reap: check the de-listed run-once and timer unit files"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_quadlet_reap_units_stat
  loop:
    - "/etc/containers/systemd/webtest-init.container"
    - "/etc/containers/systemd/webtest-job.container"
    - "/etc/systemd/system/webtest-job.timer"
    - "/etc/systemd/system/webtest-sock.socket"


- name: "Molecule | Verify | quadlet | Reap: query the de-listed timer state"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "is-active"
      - "webtest-job.timer"
  changed_when: false
  failed_when: false
  register: __testing_quadlet_reap_timer_state


- name: "Molecule | Verify | quadlet | Reap: check the de-listed plain unit was removed and stopped"
  ansible.builtin.assert:
    that:
      - not __testing_quadlet_reap_units_stat['results'][0]['stat']['exists']
      - not __testing_quadlet_reap_units_stat['results'][1]['stat']['exists']
      - not __testing_quadlet_reap_units_stat['results'][2]['stat']['exists']
      - not __testing_quadlet_reap_units_stat['results'][3]['stat']['exists']
      - __testing_quadlet_reap_timer_state['stdout'] != 'active'
    fail_msg: >-
      De-listed run-once/timer units survived the reconciliation (file left
      behind or timer still active).
    success_msg: "De-listed run-once and timer units were removed and stopped."


## Registry logout reconciliation (offline)
#
# podman logout only edits the authentication file, so the reconciliation can
# be verified without a reachable registry: craft authfile entries, record
# the registries in the manifest, run the role without quadlet_podman_registry_auth
# and expect exactly the unclaimed entry to be logged out again. A second
# application's manifest claims one of the registries: all applications of a
# scope share the authfile, so a registry another application still declares
# must survive the logout (its image pulls would break otherwise).

- name: "Molecule | Verify | quadlet | Logout: craft two authfile entries"
  ansible.builtin.copy:
    content: |
      {"auths": {"registry.molecule.invalid": {"auth": "dGVzdDp0ZXN0"}, "registry-shared.molecule.invalid": {"auth": "dGVzdDp0ZXN0"}}}
    dest: "/etc/containers/auth.json"
    owner: "root"
    group: "root"
    mode: "u=rw,g=,o="


- name: "Molecule | Verify | quadlet | Logout: record both registries in the manifest"
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (foundata.podman.quadlet): app=webtest
      files:
        - /var/lib/webtest/app.env
      registries:
        - registry.molecule.invalid
        - registry-shared.molecule.invalid
      secrets:
        - webtest_secret
    dest: "/var/lib/ansible-podman-quadlet/system/webtest.ansible-manifest"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o="


- name: "Molecule | Verify | quadlet | Logout: plant a second application's manifest claiming the shared registry"
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (foundata.podman.quadlet): app=otherapp
      files: []
      registries:
        - registry-shared.molecule.invalid
      secrets: []
    dest: "/var/lib/ansible-podman-quadlet/system/otherapp.ansible-manifest"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o="


- name: "Molecule | Verify | quadlet | Logout: re-run the role without registry logins"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "webtest"
    quadlet_podman_state: "present"
    quadlet_podman_service_state: "enabled"
    quadlet_podman_directories:
      - path: "/var/lib/webtest"
    quadlet_podman_files:
      - dest: "/var/lib/webtest/app.env"
        content: |
          WEBTEST_GREETING=hello
    quadlet_podman_secrets:
      - name: "webtest_secret"
        value: "molecule-test-value"
    quadlet_podman_unit_defaults:
      container:
        Service:
          Restart: "on-failure"
    quadlet_podman_units:
      - name: "webtest-data"
        type: "volume"
        sections:
          Volume:
            VolumeName: "webtest-data"
      - name: "webtest"
        type: "container"
        sections:
          Unit:
            Description: "Molecule webtest container"
            After:
              - "webtest-data"
          Container:
            ContainerName: "webtest"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "top"
            Volume:
              - "webtest-data.volume:/data"
            EnvironmentFile:
              - "/var/lib/webtest/app.env"
            Secret:
              - "webtest_secret,type=env,target=WEBTEST_SECRET"
          Install:
            WantedBy:
              - "multi-user.target"


- name: "Molecule | Verify | quadlet | Logout: read the authfile"
  ansible.builtin.slurp:
    src: "/etc/containers/auth.json"
  register: __testing_quadlet_logout_authfile
  failed_when:
    # tolerate podman removing the whole file with its last entry
    - __testing_quadlet_logout_authfile['msg'] is ansible.builtin.defined
    - "'file not found' not in (__testing_quadlet_logout_authfile['msg'] | ansible.builtin.lower)"


- name: "Molecule | Verify | quadlet | Logout: read the manifest"
  ansible.builtin.slurp:
    src: "/var/lib/ansible-podman-quadlet/system/webtest.ansible-manifest"
  register: __testing_quadlet_logout_manifest


- name: "Molecule | Verify | quadlet | Logout: check the unclaimed entry was removed, the claimed one kept"
  ansible.builtin.assert:
    that:
      # the registry no other application declares is logged out (not a
      # substring of the shared registry's name, so plain matching is safe)
      - >-
        'registry.molecule.invalid' not in
        (__testing_quadlet_logout_authfile['content'] | ansible.builtin.default('') | ansible.builtin.b64decode)
      # the registry the second application's manifest still declares survives
      - >-
        'registry-shared.molecule.invalid' in
        (__testing_quadlet_logout_authfile['content'] | ansible.builtin.default('') | ansible.builtin.b64decode)
      # the webtest manifest no longer records any registry
      - >-
        ((__testing_quadlet_logout_manifest['content'] | ansible.builtin.b64decode
          | ansible.builtin.from_yaml)['registries'] | ansible.builtin.default([])
         | ansible.builtin.length) == 0
    fail_msg: >-
      The logout reconciliation did not remove exactly the unclaimed entry: a
      de-listed login lingering forever, or a registry another application
      still uses got logged out (breaking its image pulls).
    success_msg: >-
      Exactly the unclaimed registry was logged out; the one claimed by the
      second application survived.


# The planted second-application manifest and the crafted authfile only
# existed for this test; the webtest application never logged in anywhere.
- name: "Molecule | Verify | quadlet | Logout: remove the crafted test files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop:
    - "/var/lib/ansible-podman-quadlet/system/otherapp.ansible-manifest"
    - "/etc/containers/auth.json"


## Complete removal via the manifest (runs last on purpose)
#
# state "absent" with empty declared lists must remove everything the
# application ever created: the manifest, not the current variable values,
# is the source of truth. Data (host directories, named volumes) is
# deliberately kept. The webtest application stays uninstalled after this.

- name: "Molecule | Verify | quadlet | Absent: remove the webtest application with empty lists"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "webtest"
    quadlet_podman_state: "absent"


- name: "Molecule | Verify | quadlet | Absent: query the Podman secrets"
  ansible.builtin.command:
    argv:
      - "/usr/bin/podman"
      - "secret"
      - "ls"
      - "--format"
      - "{{ '{{.Name}}' }}"
  register: __testing_quadlet_absent_secrets
  changed_when: false


- name: "Molecule | Verify | quadlet | Absent: query the Podman volumes"
  ansible.builtin.command:
    argv:
      - "/usr/bin/podman"
      - "volume"
      - "ls"
      - "--format"
      - "{{ '{{.Name}}' }}"
  register: __testing_quadlet_absent_volumes
  changed_when: false


- name: "Molecule | Verify | quadlet | Absent: query the ServiceName-overridden service"
  ansible.builtin.command:
    argv: ["systemctl", "is-active", "webtest-alias.service"]
  register: __testing_quadlet_absent_alias
  changed_when:
    - false
  failed_when:
    - false


- name: "Molecule | Verify | quadlet | Absent: check the remaining artifacts"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_quadlet_absent_stat
  loop:
    - "/etc/containers/systemd/webtest.container"
    - "/etc/containers/systemd/svctest.container"
    - "/etc/containers/systemd/webtest-data.volume"
    - "/var/lib/ansible-podman-quadlet/system/webtest.ansible-manifest"
    - "/var/lib/webtest/app.env"
    - "/var/lib/webtest"


- name: "Molecule | Verify | quadlet | Absent: check the application is fully removed, data kept"
  ansible.builtin.assert:
    that:
      # units, manifest and managed file gone despite empty declared lists
      - not __testing_quadlet_absent_stat['results'][0]['stat']['exists']
      - not __testing_quadlet_absent_stat['results'][1]['stat']['exists']
      - not __testing_quadlet_absent_stat['results'][2]['stat']['exists']
      - not __testing_quadlet_absent_stat['results'][3]['stat']['exists']
      - not __testing_quadlet_absent_stat['results'][4]['stat']['exists']
      - "'webtest_secret' not in __testing_quadlet_absent_secrets['stdout_lines']"
      # the ServiceName-overridden service was stopped via its real name
      - __testing_quadlet_absent_alias['stdout'] != 'active'
      # persistent data is deliberately kept
      - __testing_quadlet_absent_stat['results'][5]['stat']['exists']
      - "'webtest-data' in __testing_quadlet_absent_volumes['stdout_lines']"
    fail_msg: >-
      state "absent" with empty declared lists did not remove the manifest
      recorded resources (or removed persistent data it must keep).
    success_msg: >-
      state "absent" removed all manifest-recorded resources and kept the
      persistent data.


### Implicit secret rotation, exclusive ownership and Pod= validation
### (self-contained "rotatest" application in the rootful scope)

- name: "Molecule | Verify | quadlet | Rotation: deploy the rotatest application (secret value 1)"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "rotatest"
    quadlet_podman_secrets:
      - name: "rotatest_secret"
        value: "molecule-rotate-1"
    quadlet_podman_units:
      - name: "rotatest"
        type: "container"
        sections:
          Unit:
            Description: "Molecule secret rotation container"
          Container:
            ContainerName: "rotatest"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "top"
            Secret: "rotatest_secret,type=env,target=ROTATEST_VALUE"
          Install:
            WantedBy:
              - "multi-user.target"


- name: "Molecule | Verify | quadlet | Rotation: read the container environment (value 1)"
  ansible.builtin.command:
    argv: ["podman", "exec", "rotatest", "env"]
  register: __testing_quadlet_rotate_env1
  changed_when:
    - false


# Implicit rotation: ONLY the declared value changes; the role has to detect
# the difference, replace the secret and restart the service so the
# recreated container sees the new value (regression: existing secrets were
# never compared, a changed value silently did nothing without force).
- name: "Molecule | Verify | quadlet | Rotation: converge again with a changed secret value"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "rotatest"
    quadlet_podman_secrets:
      - name: "rotatest_secret"
        value: "molecule-rotate-2"
    quadlet_podman_units:
      - name: "rotatest"
        type: "container"
        sections:
          Unit:
            Description: "Molecule secret rotation container"
          Container:
            ContainerName: "rotatest"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "top"
            Secret: "rotatest_secret,type=env,target=ROTATEST_VALUE"
          Install:
            WantedBy:
              - "multi-user.target"


- name: "Molecule | Verify | quadlet | Rotation: read the container environment (value 2)"
  ansible.builtin.command:
    argv: ["podman", "exec", "rotatest", "env"]
  register: __testing_quadlet_rotate_env2
  changed_when:
    - false


- name: "Molecule | Verify | quadlet | Rotation: assert the rotated value reached the running container"
  ansible.builtin.assert:
    that:
      - "'ROTATEST_VALUE=molecule-rotate-1' in __testing_quadlet_rotate_env1['stdout_lines']"
      - "'ROTATEST_VALUE=molecule-rotate-2' in __testing_quadlet_rotate_env2['stdout_lines']"
    fail_msg: >-
      Implicit secret rotation failed: the container environment did not
      follow the declared secret value
      ({{ __testing_quadlet_rotate_env1['stdout_lines'] | ansible.builtin.select('ansible.builtin.match', '^ROTATEST_') | ansible.builtin.list }}
      then
      {{ __testing_quadlet_rotate_env2['stdout_lines'] | ansible.builtin.select('ansible.builtin.match', '^ROTATEST_') | ansible.builtin.list }}).
    success_msg: "Changing the declared value rotated the secret and restarted the service."


# Exclusive ownership: a second application claiming rotatest's secret has
# to be rejected before anything is changed.
- name: "Molecule | Verify | quadlet | Ownership: attempt to claim the secret from another application"
  block:

    - name: "Molecule | Verify | quadlet | Ownership: include the role as a conflicting application"
      ansible.builtin.include_role:
        name: "foundata.podman.quadlet"
      vars:
        quadlet_podman_app: "conflictapp"
        quadlet_podman_secrets:
          - name: "rotatest_secret"
            value: "conflicting-value"

    - name: "Molecule | Verify | quadlet | Ownership: record that the conflicting claim was accepted"
      ansible.builtin.set_fact:
        __testing_quadlet_conflict_rejected: false

  rescue:

    - name: "Molecule | Verify | quadlet | Ownership: record that the conflicting claim was rejected"
      ansible.builtin.set_fact:
        __testing_quadlet_conflict_rejected: true


- name: "Molecule | Verify | quadlet | Ownership: read the container environment after the rejected claim"
  ansible.builtin.command:
    argv: ["podman", "exec", "rotatest", "env"]
  register: __testing_quadlet_rotate_env3
  changed_when:
    - false


- name: "Molecule | Verify | quadlet | Ownership: assert the conflicting claim was rejected and nothing changed"
  ansible.builtin.assert:
    that:
      - __testing_quadlet_conflict_rejected | ansible.builtin.bool
      - "'ROTATEST_VALUE=molecule-rotate-2' in __testing_quadlet_rotate_env3['stdout_lines']"
    fail_msg: >-
      A second application claiming an already-owned secret was not rejected
      (or the rejected run still modified the secret).
    success_msg: "Conflicting resource claims are rejected before any change."


- name: "Molecule | Verify | quadlet | Rotation: remove the rotatest application again"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "rotatest"
    quadlet_podman_state: "absent"


- name: "Molecule | Verify | quadlet | Rotation: query the Podman secrets after removal"
  ansible.builtin.command:
    argv:
      - "/usr/bin/podman"
      - "secret"
      - "ls"
      - "--format"
      - "{{ '{{.Name}}' }}"
  register: __testing_quadlet_rotate_secrets_after
  changed_when:
    - false


- name: "Molecule | Verify | quadlet | Rotation: assert the secret was removed with its application"
  ansible.builtin.assert:
    that:
      - "'rotatest_secret' not in __testing_quadlet_rotate_secrets_after['stdout_lines']"
    fail_msg: "state absent left the rotatest secret behind."
    success_msg: "state absent removed the application's secret."


# Pod= has to name the Quadlet FILE (with .pod suffix); a bare pod name
# passes the generator's grammar check nowhere, so the role must reject it
# during init, before any state is touched.
- name: "Molecule | Verify | quadlet | Pod reference: attempt a bare pod name"
  block:

    - name: "Molecule | Verify | quadlet | Pod reference: include the role with a bare Pod value"
      ansible.builtin.include_role:
        name: "foundata.podman.quadlet"
      vars:
        quadlet_podman_app: "podtest"
        quadlet_podman_units:
          - name: "podmember"
            type: "container"
            sections:
              Container:
                ContainerName: "podmember"
                Image: "quay.io/libpod/testimage:20241011"
                Exec: "top"
                Pod: "shared"

    - name: "Molecule | Verify | quadlet | Pod reference: record that the bare name was accepted"
      ansible.builtin.set_fact:
        __testing_quadlet_barepod_rejected: false

  rescue:

    - name: "Molecule | Verify | quadlet | Pod reference: record that the bare name was rejected"
      ansible.builtin.set_fact:
        __testing_quadlet_barepod_rejected: true


- name: "Molecule | Verify | quadlet | Pod reference: assert the bare pod name was rejected"
  ansible.builtin.assert:
    that:
      - __testing_quadlet_barepod_rejected | ansible.builtin.bool
    fail_msg: >-
      A bare Pod value without the '.pod' suffix passed validation; Podman's
      generator would reject the unit later.
    success_msg: "Pod references without the '.pod' file suffix are rejected."


- name: "Molecule | Verify | quadlet | Check the administrator's unit files survived the sweeps"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_quadlet_admin_decoy_stat
  failed_when:
    - not __testing_quadlet_admin_decoy_stat['stat']['exists']
  loop:
    - "/etc/containers/systemd/admin-own-decoy.container"
    - "/etc/systemd/system/admin-own-decoy.timer"


- name: "Molecule | Verify | quadlet | Remove the administrator-owned test files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop:
    - "/etc/containers/systemd/admin-own-decoy.container"
    - "/etc/systemd/system/admin-own-decoy.timer"


## Complete removal of the rootless application

- name: "Molecule | Verify | quadlet | Absent: remove the usertest application (rootless)"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "usertest"
    quadlet_podman_state: "absent"
    quadlet_podman_user: "containerapp"


- name: "Molecule | Verify | quadlet | Absent: check the rootless artifacts"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_quadlet_absent_rootless_stat
  loop:
    - "/var/lib/podman/containerapp/.config/containers/systemd/usertest.container"
    - "/var/lib/ansible-podman-quadlet/user-containerapp/usertest.ansible-manifest"
    # manifest-recorded managed file (declared lists are empty here)
    - "/var/lib/podman/containerapp/usertest.env"
    # marker-identified plain user units (declared list is empty here)
    - "/var/lib/podman/containerapp/.config/systemd/user/usertest-job.timer"
    - "/var/lib/podman/containerapp/.config/systemd/user/usertest-job.service"


- name: "Molecule | Verify | quadlet | Absent: check the rootless application is fully removed"
  ansible.builtin.assert:
    that:
      - not __testing_quadlet_absent_rootless_stat['results'][0]['stat']['exists']
      - not __testing_quadlet_absent_rootless_stat['results'][1]['stat']['exists']
      - not __testing_quadlet_absent_rootless_stat['results'][2]['stat']['exists']
      - not __testing_quadlet_absent_rootless_stat['results'][3]['stat']['exists']
      - not __testing_quadlet_absent_rootless_stat['results'][4]['stat']['exists']
    fail_msg: >-
      state "absent" left rootless unit files, plain user units, the manifest
      or a manifest-recorded file behind.
    success_msg: "state \"absent\" removed the rootless application."


## Root-side cleanup with a deleted service account
#
# Re-deploy the rootless application, then delete the account entirely: the
# account-dependent removals (services, unit files, secrets, logins) are
# skipped, but the root-owned manifest and the manifest-recorded files must
# still be cleaned up by state "absent".

- name: "Molecule | Verify | quadlet | Account gone: re-deploy the usertest application"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "usertest"
    quadlet_podman_state: "present"
    quadlet_podman_service_state: "enabled"
    quadlet_podman_user: "containerapp"
    quadlet_podman_files:
      - dest: "/var/lib/podman/containerapp/usertest.env"
        content: |
          USERTEST_GREETING=hello
    quadlet_podman_units:
      - name: "usertest"
        type: "container"
        sections:
          Unit:
            Description: "Molecule usertest container (rootless)"
          Container:
            ContainerName: "usertest"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "top"
          Install:
            WantedBy:
              - "default.target"


- name: "Molecule | Verify | quadlet | Account gone: stop the user services and delete the account"
  ansible.builtin.shell:
    cmd: |
      set -u
      loginctl disable-linger containerapp || true
      loginctl terminate-user containerapp || true
      sleep 2
      pkill -9 -u containerapp || true
      sleep 1
      userdel --remove --force containerapp
  args:
    executable: "/bin/bash"
  changed_when:
    - true


- name: "Molecule | Verify | quadlet | Account gone: run the role with state 'absent'"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "usertest"
    quadlet_podman_state: "absent"
    quadlet_podman_user: "containerapp"


- name: "Molecule | Verify | quadlet | Account gone: check the root-owned manifest"
  ansible.builtin.stat:
    path: "/var/lib/ansible-podman-quadlet/user-containerapp/usertest.ansible-manifest"
  register: __testing_quadlet_accountgone_manifest


- name: "Molecule | Verify | quadlet | Account gone: assert the manifest was cleaned up without the account"
  ansible.builtin.assert:
    that:
      - not __testing_quadlet_accountgone_manifest['stat']['exists']
    fail_msg: >-
      The root-owned manifest survived state "absent" although only the
      service account is gone; the root-side cleanup must not depend on the
      account.
    success_msg: "The root-side cleanup removed the manifest without the account."


- name: "Molecule | Verify | quadlet | Account gone: re-create the test account (later stages expect it)"
  ansible.builtin.user:
    name: "containerapp"
    state: "present"
    system: true
    home: "/var/lib/podman/containerapp"
    create_home: true
    shell: "/bin/bash"
    password: "!"


# userdel --remove also dropped the account's subordinate ID assignments; the
# host-absent checks later expect the converge-time ranges to survive.
- name: "Molecule | Verify | quadlet | Account gone: restore the subordinate ID ranges of the account"
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: "containerapp:20000:20000"
    state: "present"
  loop:
    - "/etc/subuid"
    - "/etc/subgid"


## Complete removal of the host role (runs after the applications are gone:
## it removes the Podman packages and reverts the rootless enablement the
## applications depend on)

- name: "Molecule | Verify | host absent: uninstall the foundata.podman.host role"
  ansible.builtin.include_role:
    name: "foundata.podman.host"
  vars:
    host_podman_state: "absent"
    host_podman_selinux_label_paths:
      - "/var/lib/podman"
    host_podman_rootless_users:
      - name: "containerapp"
        subuid: "20000:20000"
        subgid: "20000:20000"


- name: "Molecule | Verify | host absent: check the remaining artifacts"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_host_absent_stat
  loop:
    - "/etc/containers/containers.conf.d/50-managed.conf"
    - "/etc/systemd/system/podman-auto-update.timer.d/00-managed.conf"
    - "/var/lib/systemd/linger/containerapp"
    - "/var/lib/podman/containerapp/.config/containers/containers.conf"
    - "/var/lib/podman/containerapp/.config/containers/storage.conf"
    - "/var/lib/podman/containerapp/.config/containers/registries.conf"
    - "/usr/bin/podman"


- name: "Molecule | Verify | host absent: query the rootless account and its subordinate IDs"
  ansible.builtin.getent:
    database: "passwd"
    key: "containerapp"
    fail_key: false


- name: "Molecule | Verify | host absent: read /etc/subuid"
  ansible.builtin.slurp:
    src: "/etc/subuid"
  register: __testing_host_absent_subuid


- name: "Molecule | Verify | host absent: check the role reverted its changes and kept shared account state"
  ansible.builtin.assert:
    that:
      # managed drop-ins, linger flag and per-user configs are gone
      - not __testing_host_absent_stat['results'][0]['stat']['exists']
      - not __testing_host_absent_stat['results'][1]['stat']['exists']
      - not __testing_host_absent_stat['results'][2]['stat']['exists']
      - not __testing_host_absent_stat['results'][3]['stat']['exists']
      - not __testing_host_absent_stat['results'][4]['stat']['exists']
      - not __testing_host_absent_stat['results'][5]['stat']['exists']
      # the packages are removed
      - not __testing_host_absent_stat['results'][6]['stat']['exists']
      # shared account properties are deliberately kept (documented behavior):
      # the account itself and its subordinate ID assignments
      - ansible_facts['getent_passwd']['containerapp'] is not ansible.builtin.none
      - >-
        (__testing_host_absent_subuid['content'] | ansible.builtin.b64decode)
        is ansible.builtin.search('^containerapp:', multiline=true)
    fail_msg: >-
      state "absent" left role-managed host configuration behind, or removed
      shared account state (account, subordinate IDs) it has to keep.
    success_msg: >-
      state "absent" reverted the host configuration and kept the shared
      account state.
