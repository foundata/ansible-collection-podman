# Verify the state after the "quadlet" role converge (the rootful "webtest"
# and the rootless "usertest" application).

### Rootful application ("webtest")

- name: "Molecule | Verify | quadlet | Read the webtest container unit file"
  ansible.builtin.slurp:
    src: "/etc/containers/systemd/webtest.container"
  register: __testing_quadlet_webtest_unit_slurp


- name: "Molecule | Verify | quadlet | Check the webtest container unit content"
  ansible.builtin.assert:
    that:
      # ownership marker (load-bearing for the cleanup logic)
      - "'Managed by Ansible (foundata.podman.quadlet): app=webtest' in __testing_quadlet_webtest_unit_content"
      - "'Image=quay.io/libpod/testimage:20241011' in __testing_quadlet_webtest_unit_content"
      - "'Secret=webtest_secret,type=env,target=WEBTEST_SECRET' in __testing_quadlet_webtest_unit_content"
      # dependency expansion: "webtest-data" (volume) -> webtest-data-volume.service
      - "'After=webtest-data-volume.service' in __testing_quadlet_webtest_unit_content"
      # unit defaults merged into the [Service] section
      - "'Restart=on-failure' in __testing_quadlet_webtest_unit_content"
    quiet: true
  vars:
    __testing_quadlet_webtest_unit_content: "{{ __testing_quadlet_webtest_unit_slurp['content'] | ansible.builtin.b64decode }}"


- name: "Molecule | Verify | quadlet | Query the webtest service state"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "is-active"
      - "webtest.service"
  register: __testing_quadlet_webtest_active_result
  changed_when: false


- name: "Molecule | Verify | quadlet | Check the webtest service is active"
  ansible.builtin.assert:
    that:
      - __testing_quadlet_webtest_active_result['stdout'] == 'active'
    quiet: true


- name: "Molecule | Verify | quadlet | Query the Podman secrets"
  ansible.builtin.command:
    argv:
      - "/usr/bin/podman"
      - "secret"
      - "ls"
      - "--format"
      - "{{ '{{.Name}}' }}"
  register: __testing_quadlet_secret_result
  changed_when: false


- name: "Molecule | Verify | quadlet | Check the webtest secret exists"
  ansible.builtin.assert:
    that:
      - "'webtest_secret' in __testing_quadlet_secret_result['stdout_lines']"
    quiet: true


- name: "Molecule | Verify | quadlet | Read the webtest environment file"
  ansible.builtin.slurp:
    src: "/var/lib/webtest/app.env"
  register: __testing_quadlet_webtest_env_slurp


- name: "Molecule | Verify | quadlet | Check the webtest environment file content"
  ansible.builtin.assert:
    that:
      - "'WEBTEST_GREETING=hello' in (__testing_quadlet_webtest_env_slurp['content'] | ansible.builtin.b64decode)"
    quiet: true


### Rootless application ("usertest", account "containerapp")

- name: "Molecule | Verify | quadlet | Read the usertest container unit file (rootless)"
  ansible.builtin.slurp:
    src: "/var/lib/podman/containerapp/.config/containers/systemd/usertest.container"
  register: __testing_quadlet_usertest_unit_slurp


- name: "Molecule | Verify | quadlet | Check the usertest container unit content (rootless)"
  ansible.builtin.assert:
    that:
      - "'Managed by Ansible (foundata.podman.quadlet): app=usertest' in __testing_quadlet_usertest_unit_content"
      - "'Image=quay.io/libpod/testimage:20241011' in __testing_quadlet_usertest_unit_content"
    quiet: true
  vars:
    __testing_quadlet_usertest_unit_content: "{{ __testing_quadlet_usertest_unit_slurp['content'] | ansible.builtin.b64decode }}"


- name: "Molecule | Verify | quadlet | Determine the UID of the rootless account"
  ansible.builtin.getent:
    database: "passwd"
    key: "containerapp"


# The molecule instances are virtual machines, so the rootless START is
# testable on every platform (see the comment in
# tasks/converge/role-quadlet.yml).
- name: "Molecule | Verify | quadlet | Query the usertest service state (rootless)"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "--user"
      - "is-active"
      - "usertest.service"
  become: true
  become_user: "containerapp"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['containerapp'][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['getent_passwd']['containerapp'][1] }}/bus"
  register: __testing_quadlet_usertest_active_result
  changed_when: false


- name: "Molecule | Verify | quadlet | Check the usertest service is active (rootless)"
  ansible.builtin.assert:
    that:
      - __testing_quadlet_usertest_active_result['stdout'] == 'active'
    quiet: true


# The manifest's file paths get removed with root privileges on later runs,
# so the rootless account must not be able to edit it: root-owned, not
# group/world-writable and outside the account's writable tree. A user-owned
# manifest would let the service account have arbitrary paths (e.g.
# /etc/shadow) deleted as root.
- name: "Molecule | Verify | quadlet | Get information about the rootless manifest"
  ansible.builtin.stat:
    path: "/var/lib/ansible-podman-quadlet/user-containerapp/usertest.ansible-manifest"
  register: __testing_quadlet_usertest_manifest_stat


- name: "Molecule | Verify | quadlet | Check the rootless manifest is out of the account's reach"
  ansible.builtin.assert:
    that:
      - __testing_quadlet_usertest_manifest_stat['stat']['exists']
      - __testing_quadlet_usertest_manifest_stat['stat']['pw_name'] == 'root'
      - __testing_quadlet_usertest_manifest_stat['stat']['gr_name'] == 'root'
      - __testing_quadlet_usertest_manifest_stat['stat']['mode'] == '0600'
    fail_msg: >-
      The rootless manifest is missing or writable by the service account;
      its recorded paths get removed as root, so this would allow arbitrary
      file deletion with root privileges.
    success_msg: "The rootless manifest is root-owned and out of the account's reach."


## Application manifest and cleanup reconciliation (rootful "webtest")
#
# The role records secrets, managed files and registry logins in a
# per-application manifest so renamed or de-listed resources get cleaned up
# and "absent" removes the application completely. The blocks below verify the
# manifest content after converge, the reap of de-listed resources, the
# registry logout reconciliation (offline, via a crafted authfile entry) and
# finally the complete removal with empty declared lists. The removal test
# runs last on purpose and leaves the webtest application uninstalled.

- name: "Molecule | Verify | quadlet | Read the webtest application manifest"
  ansible.builtin.slurp:
    src: "/var/lib/ansible-podman-quadlet/system/webtest.ansible-manifest"
  register: __testing_quadlet_manifest_slurp


- name: "Molecule | Verify | quadlet | Check the manifest records the converge resources"
  ansible.builtin.assert:
    that:
      - "'Managed by Ansible (foundata.podman.quadlet): app=webtest' in __testing_quadlet_manifest_content"
      - __testing_quadlet_manifest_parsed['secrets'] == ['webtest_secret']
      - __testing_quadlet_manifest_parsed['files'] == ['/var/lib/webtest/app.env']
      - (__testing_quadlet_manifest_parsed['registries'] | ansible.builtin.length) == 0
    fail_msg: >-
      The webtest manifest does not record the converge resources.
      Content: {{ __testing_quadlet_manifest_content }}
    success_msg: "The webtest manifest records the converge resources."
  vars:
    __testing_quadlet_manifest_content: "{{ __testing_quadlet_manifest_slurp['content'] | ansible.builtin.b64decode }}"
    __testing_quadlet_manifest_parsed: "{{ __testing_quadlet_manifest_content | ansible.builtin.from_yaml }}"


- name: "Molecule | Verify | quadlet | Reap: re-run the role with an additional secret and file"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "webtest"
    quadlet_podman_state: "present"
    quadlet_podman_service_state: "enabled"
    quadlet_podman_directories:
      - path: "/var/lib/webtest"
    quadlet_podman_files:
      - dest: "/var/lib/webtest/app.env"
        content: |
          WEBTEST_GREETING=hello
      - dest: "/var/lib/webtest/temp.env"
        content: |
          WEBTEST_TEMP=value
    quadlet_podman_secrets:
      - name: "webtest_secret"
        value: "molecule-test-value"
      - name: "webtest_tempsecret"
        value: "molecule-temp-value"
    quadlet_podman_unit_defaults:
      container:
        Service:
          Restart: "on-failure"
    quadlet_podman_units:
      - name: "webtest-data"
        type: "volume"
        sections:
          Volume:
            VolumeName: "webtest-data"
      - name: "webtest"
        type: "container"
        sections:
          Unit:
            Description: "Molecule webtest container"
            After:
              - "webtest-data"
          Container:
            ContainerName: "webtest"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "top"
            Volume:
              - "webtest-data.volume:/data"
            EnvironmentFile:
              - "/var/lib/webtest/app.env"
            Secret:
              - "webtest_secret,type=env,target=WEBTEST_SECRET"
          Install:
            WantedBy:
              - "multi-user.target"


- name: "Molecule | Verify | quadlet | Reap: query the Podman secrets after adding"
  ansible.builtin.command:
    argv:
      - "/usr/bin/podman"
      - "secret"
      - "ls"
      - "--format"
      - "{{ '{{.Name}}' }}"
  register: __testing_quadlet_reap_added_secrets
  changed_when: false


- name: "Molecule | Verify | quadlet | Reap: read the manifest after adding"
  ansible.builtin.slurp:
    src: "/var/lib/ansible-podman-quadlet/system/webtest.ansible-manifest"
  register: __testing_quadlet_reap_added_manifest


- name: "Molecule | Verify | quadlet | Reap: check the additional resources exist and are recorded"
  ansible.builtin.assert:
    that:
      - "'webtest_tempsecret' in __testing_quadlet_reap_added_secrets['stdout_lines']"
      - "'webtest_tempsecret' in __testing_quadlet_reap_manifest_parsed['secrets']"
      - "'/var/lib/webtest/temp.env' in __testing_quadlet_reap_manifest_parsed['files']"
    fail_msg: >-
      The additional secret/file did not get created or recorded in the
      manifest.
    success_msg: "The additional secret and file exist and are recorded."
  vars:
    __testing_quadlet_reap_manifest_parsed: >-
      {{ __testing_quadlet_reap_added_manifest['content'] | ansible.builtin.b64decode | ansible.builtin.from_yaml }}


# Same input as converge again: the previously added secret and file are now
# de-listed (the rename scenario) and must be removed by the reconciliation.
# The de-listing below removes a declared file (temp.env). That has to
# restart the application services - a container consuming a removed file
# would otherwise keep using the dead copy until an unrelated restart - so
# the service start timestamp is recorded here and compared after the run
# (plus handler flush).
- name: "Molecule | Verify | quadlet | Reap: record the webtest start timestamp before de-listing"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "show"
      - "webtest.service"
      - "--property"
      - "ActiveEnterTimestampMonotonic"
      - "--value"
  register: __testing_quadlet_reap_started_before
  changed_when: false


- name: "Molecule | Verify | quadlet | Reap: re-run the role without the additional resources"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "webtest"
    quadlet_podman_state: "present"
    quadlet_podman_service_state: "enabled"
    quadlet_podman_directories:
      - path: "/var/lib/webtest"
    quadlet_podman_files:
      - dest: "/var/lib/webtest/app.env"
        content: |
          WEBTEST_GREETING=hello
    quadlet_podman_secrets:
      - name: "webtest_secret"
        value: "molecule-test-value"
    quadlet_podman_unit_defaults:
      container:
        Service:
          Restart: "on-failure"
    quadlet_podman_units:
      - name: "webtest-data"
        type: "volume"
        sections:
          Volume:
            VolumeName: "webtest-data"
      - name: "webtest"
        type: "container"
        sections:
          Unit:
            Description: "Molecule webtest container"
            After:
              - "webtest-data"
          Container:
            ContainerName: "webtest"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "top"
            Volume:
              - "webtest-data.volume:/data"
            EnvironmentFile:
              - "/var/lib/webtest/app.env"
            Secret:
              - "webtest_secret,type=env,target=WEBTEST_SECRET"
          Install:
            WantedBy:
              - "multi-user.target"


# The role notifies its restart handler for the removed file; run it now so
# the restart can be asserted (handlers otherwise wait for the end of the play).
- name: "Molecule | Verify | quadlet | Reap: flush the notified handlers"
  ansible.builtin.meta: "flush_handlers"


- name: "Molecule | Verify | quadlet | Reap: record the webtest start timestamp after de-listing"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "show"
      - "webtest.service"
      - "--property"
      - "ActiveEnterTimestampMonotonic"
      - "--value"
  register: __testing_quadlet_reap_started_after
  changed_when: false


- name: "Molecule | Verify | quadlet | Reap: check the removed file triggered a service restart"
  ansible.builtin.assert:
    that:
      - (__testing_quadlet_reap_started_after['stdout'] | ansible.builtin.int)
        > (__testing_quadlet_reap_started_before['stdout'] | ansible.builtin.int)
    fail_msg: >-
      Removing a declared file did not restart the application services
      (start timestamp {{ __testing_quadlet_reap_started_before['stdout'] }}
      unchanged) - the container would keep using the dead bind-mount source
      of the removed file until an unrelated restart.
    success_msg: "Removing a declared file restarted the application services."


- name: "Molecule | Verify | quadlet | Reap: query the Podman secrets after de-listing"
  ansible.builtin.command:
    argv:
      - "/usr/bin/podman"
      - "secret"
      - "ls"
      - "--format"
      - "{{ '{{.Name}}' }}"
  register: __testing_quadlet_reap_removed_secrets
  changed_when: false


- name: "Molecule | Verify | quadlet | Reap: check the temp file is gone"
  ansible.builtin.stat:
    path: "/var/lib/webtest/temp.env"
  register: __testing_quadlet_reap_tempfile_stat


- name: "Molecule | Verify | quadlet | Reap: read the manifest after de-listing"
  ansible.builtin.slurp:
    src: "/var/lib/ansible-podman-quadlet/system/webtest.ansible-manifest"
  register: __testing_quadlet_reap_removed_manifest


- name: "Molecule | Verify | quadlet | Reap: check the de-listed resources were removed"
  ansible.builtin.assert:
    that:
      - "'webtest_tempsecret' not in __testing_quadlet_reap_removed_secrets['stdout_lines']"
      - "'webtest_secret' in __testing_quadlet_reap_removed_secrets['stdout_lines']"
      - not __testing_quadlet_reap_tempfile_stat['stat']['exists']
      - __testing_quadlet_reap_manifest_parsed['secrets'] == ['webtest_secret']
      - __testing_quadlet_reap_manifest_parsed['files'] == ['/var/lib/webtest/app.env']
    fail_msg: >-
      De-listed resources survived the reconciliation (renamed secrets/files
      would linger forever).
    success_msg: "De-listed secret and file were removed, declared ones survived."
  vars:
    __testing_quadlet_reap_manifest_parsed: >-
      {{ __testing_quadlet_reap_removed_manifest['content'] | ansible.builtin.b64decode | ansible.builtin.from_yaml }}


## Registry logout reconciliation (offline)
#
# podman logout only edits the authentication file, so the reconciliation can
# be verified without a reachable registry: craft authfile entries, record
# the registries in the manifest, run the role without quadlet_podman_registry_auth
# and expect exactly the unclaimed entry to be logged out again. A second
# application's manifest claims one of the registries: all applications of a
# scope share the authfile, so a registry another application still declares
# must survive the logout (its image pulls would break otherwise).

- name: "Molecule | Verify | quadlet | Logout: craft two authfile entries"
  ansible.builtin.copy:
    content: |
      {"auths": {"registry.molecule.invalid": {"auth": "dGVzdDp0ZXN0"}, "registry-shared.molecule.invalid": {"auth": "dGVzdDp0ZXN0"}}}
    dest: "/etc/containers/auth.json"
    owner: "root"
    group: "root"
    mode: "u=rw,g=,o="


- name: "Molecule | Verify | quadlet | Logout: record both registries in the manifest"
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (foundata.podman.quadlet): app=webtest
      files:
        - /var/lib/webtest/app.env
      registries:
        - registry.molecule.invalid
        - registry-shared.molecule.invalid
      secrets:
        - webtest_secret
    dest: "/var/lib/ansible-podman-quadlet/system/webtest.ansible-manifest"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o="


- name: "Molecule | Verify | quadlet | Logout: plant a second application's manifest claiming the shared registry"
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (foundata.podman.quadlet): app=otherapp
      files: []
      registries:
        - registry-shared.molecule.invalid
      secrets: []
    dest: "/var/lib/ansible-podman-quadlet/system/otherapp.ansible-manifest"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o="


- name: "Molecule | Verify | quadlet | Logout: re-run the role without registry logins"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "webtest"
    quadlet_podman_state: "present"
    quadlet_podman_service_state: "enabled"
    quadlet_podman_directories:
      - path: "/var/lib/webtest"
    quadlet_podman_files:
      - dest: "/var/lib/webtest/app.env"
        content: |
          WEBTEST_GREETING=hello
    quadlet_podman_secrets:
      - name: "webtest_secret"
        value: "molecule-test-value"
    quadlet_podman_unit_defaults:
      container:
        Service:
          Restart: "on-failure"
    quadlet_podman_units:
      - name: "webtest-data"
        type: "volume"
        sections:
          Volume:
            VolumeName: "webtest-data"
      - name: "webtest"
        type: "container"
        sections:
          Unit:
            Description: "Molecule webtest container"
            After:
              - "webtest-data"
          Container:
            ContainerName: "webtest"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "top"
            Volume:
              - "webtest-data.volume:/data"
            EnvironmentFile:
              - "/var/lib/webtest/app.env"
            Secret:
              - "webtest_secret,type=env,target=WEBTEST_SECRET"
          Install:
            WantedBy:
              - "multi-user.target"


- name: "Molecule | Verify | quadlet | Logout: read the authfile"
  ansible.builtin.slurp:
    src: "/etc/containers/auth.json"
  register: __testing_quadlet_logout_authfile
  failed_when:
    # tolerate podman removing the whole file with its last entry
    - __testing_quadlet_logout_authfile['msg'] is ansible.builtin.defined
    - "'file not found' not in (__testing_quadlet_logout_authfile['msg'] | ansible.builtin.lower)"


- name: "Molecule | Verify | quadlet | Logout: read the manifest"
  ansible.builtin.slurp:
    src: "/var/lib/ansible-podman-quadlet/system/webtest.ansible-manifest"
  register: __testing_quadlet_logout_manifest


- name: "Molecule | Verify | quadlet | Logout: check the unclaimed entry was removed, the claimed one kept"
  ansible.builtin.assert:
    that:
      # the registry no other application declares is logged out (not a
      # substring of the shared registry's name, so plain matching is safe)
      - >-
        'registry.molecule.invalid' not in
        (__testing_quadlet_logout_authfile['content'] | ansible.builtin.default('') | ansible.builtin.b64decode)
      # the registry the second application's manifest still declares survives
      - >-
        'registry-shared.molecule.invalid' in
        (__testing_quadlet_logout_authfile['content'] | ansible.builtin.default('') | ansible.builtin.b64decode)
      # the webtest manifest no longer records any registry
      - >-
        ((__testing_quadlet_logout_manifest['content'] | ansible.builtin.b64decode
          | ansible.builtin.from_yaml)['registries'] | ansible.builtin.default([])
         | ansible.builtin.length) == 0
    fail_msg: >-
      The logout reconciliation did not remove exactly the unclaimed entry: a
      de-listed login lingering forever, or a registry another application
      still uses got logged out (breaking its image pulls).
    success_msg: >-
      Exactly the unclaimed registry was logged out; the one claimed by the
      second application survived.


# The planted second-application manifest and the crafted authfile only
# existed for this test; the webtest application never logged in anywhere.
- name: "Molecule | Verify | quadlet | Logout: remove the crafted test files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop:
    - "/var/lib/ansible-podman-quadlet/system/otherapp.ansible-manifest"
    - "/etc/containers/auth.json"


## Complete removal via the manifest (runs last on purpose)
#
# state "absent" with empty declared lists must remove everything the
# application ever created: the manifest, not the current variable values,
# is the source of truth. Data (host directories, named volumes) is
# deliberately kept. The webtest application stays uninstalled after this.

- name: "Molecule | Verify | quadlet | Absent: remove the webtest application with empty lists"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "webtest"
    quadlet_podman_state: "absent"


- name: "Molecule | Verify | quadlet | Absent: query the Podman secrets"
  ansible.builtin.command:
    argv:
      - "/usr/bin/podman"
      - "secret"
      - "ls"
      - "--format"
      - "{{ '{{.Name}}' }}"
  register: __testing_quadlet_absent_secrets
  changed_when: false


- name: "Molecule | Verify | quadlet | Absent: query the Podman volumes"
  ansible.builtin.command:
    argv:
      - "/usr/bin/podman"
      - "volume"
      - "ls"
      - "--format"
      - "{{ '{{.Name}}' }}"
  register: __testing_quadlet_absent_volumes
  changed_when: false


- name: "Molecule | Verify | quadlet | Absent: check the remaining artifacts"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_quadlet_absent_stat
  loop:
    - "/etc/containers/systemd/webtest.container"
    - "/etc/containers/systemd/webtest-data.volume"
    - "/var/lib/ansible-podman-quadlet/system/webtest.ansible-manifest"
    - "/var/lib/webtest/app.env"
    - "/var/lib/webtest"


- name: "Molecule | Verify | quadlet | Absent: check the application is fully removed, data kept"
  ansible.builtin.assert:
    that:
      # units, manifest and managed file gone despite empty declared lists
      - not __testing_quadlet_absent_stat['results'][0]['stat']['exists']
      - not __testing_quadlet_absent_stat['results'][1]['stat']['exists']
      - not __testing_quadlet_absent_stat['results'][2]['stat']['exists']
      - not __testing_quadlet_absent_stat['results'][3]['stat']['exists']
      - "'webtest_secret' not in __testing_quadlet_absent_secrets['stdout_lines']"
      # persistent data is deliberately kept
      - __testing_quadlet_absent_stat['results'][4]['stat']['exists']
      - "'webtest-data' in __testing_quadlet_absent_volumes['stdout_lines']"
    fail_msg: >-
      state "absent" with empty declared lists did not remove the manifest
      recorded resources (or removed persistent data it must keep).
    success_msg: >-
      state "absent" removed all manifest-recorded resources and kept the
      persistent data.


## Complete removal of the rootless application

- name: "Molecule | Verify | quadlet | Absent: remove the usertest application (rootless)"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "usertest"
    quadlet_podman_state: "absent"
    quadlet_podman_user: "containerapp"


- name: "Molecule | Verify | quadlet | Absent: check the rootless artifacts"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_quadlet_absent_rootless_stat
  loop:
    - "/var/lib/podman/containerapp/.config/containers/systemd/usertest.container"
    - "/var/lib/ansible-podman-quadlet/user-containerapp/usertest.ansible-manifest"
    # manifest-recorded managed file (declared lists are empty here)
    - "/var/lib/podman/containerapp/usertest.env"


- name: "Molecule | Verify | quadlet | Absent: check the rootless application is fully removed"
  ansible.builtin.assert:
    that:
      - not __testing_quadlet_absent_rootless_stat['results'][0]['stat']['exists']
      - not __testing_quadlet_absent_rootless_stat['results'][1]['stat']['exists']
      - not __testing_quadlet_absent_rootless_stat['results'][2]['stat']['exists']
    fail_msg: >-
      state "absent" left rootless unit files, the manifest or a
      manifest-recorded file behind.
    success_msg: "state \"absent\" removed the rootless application."


## Complete removal of the host role (runs after the applications are gone:
## it removes the Podman packages and reverts the rootless enablement the
## applications depend on)

- name: "Molecule | Verify | host absent: uninstall the foundata.podman.host role"
  ansible.builtin.include_role:
    name: "foundata.podman.host"
  vars:
    host_podman_state: "absent"
    host_podman_selinux_label_paths:
      - "/var/lib/podman"
    host_podman_rootless_users:
      - name: "containerapp"
        subuid: "20000:20000"
        subgid: "20000:20000"


- name: "Molecule | Verify | host absent: check the remaining artifacts"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_host_absent_stat
  loop:
    - "/etc/containers/containers.conf.d/50-managed.conf"
    - "/etc/systemd/system/podman-auto-update.timer.d/00-managed.conf"
    - "/var/lib/systemd/linger/containerapp"
    - "/var/lib/podman/containerapp/.config/containers/containers.conf"
    - "/var/lib/podman/containerapp/.config/containers/storage.conf"
    - "/var/lib/podman/containerapp/.config/containers/registries.conf"
    - "/usr/bin/podman"


- name: "Molecule | Verify | host absent: query the rootless account and its subordinate IDs"
  ansible.builtin.getent:
    database: "passwd"
    key: "containerapp"
    fail_key: false


- name: "Molecule | Verify | host absent: read /etc/subuid"
  ansible.builtin.slurp:
    src: "/etc/subuid"
  register: __testing_host_absent_subuid


- name: "Molecule | Verify | host absent: check the role reverted its changes and kept shared account state"
  ansible.builtin.assert:
    that:
      # managed drop-ins, linger flag and per-user configs are gone
      - not __testing_host_absent_stat['results'][0]['stat']['exists']
      - not __testing_host_absent_stat['results'][1]['stat']['exists']
      - not __testing_host_absent_stat['results'][2]['stat']['exists']
      - not __testing_host_absent_stat['results'][3]['stat']['exists']
      - not __testing_host_absent_stat['results'][4]['stat']['exists']
      - not __testing_host_absent_stat['results'][5]['stat']['exists']
      # the packages are removed
      - not __testing_host_absent_stat['results'][6]['stat']['exists']
      # shared account properties are deliberately kept (documented behavior):
      # the account itself and its subordinate ID assignments
      - ansible_facts['getent_passwd']['containerapp'] is not ansible.builtin.none
      - >-
        (__testing_host_absent_subuid['content'] | ansible.builtin.b64decode)
        is ansible.builtin.search('^containerapp:', multiline=true)
    fail_msg: >-
      state "absent" left role-managed host configuration behind, or removed
      shared account state (account, subordinate IDs) it has to keep.
    success_msg: >-
      state "absent" reverted the host configuration and kept the shared
      account state.
