# Prepare all molecule instances for testing the foundata.podman collection.

# The molecule instances are containers themselves, so the Podman managed by
# the roles runs its containers on an overlayfs backing store. Native
# overlay-on-overlayfs is refused by some builds (Enterprise Linux) and flaky
# for rootless, so pin the fuse-overlayfs mount program for the nested Podman.
# The role deliberately does not touch storage.conf unless asked (this file
# carries no role marker, so the role's uninstall leaves it alone, too). Real
# target systems (VMs, bare metal) do not need any of this.
- name: "Molecule | Prepare | Install fuse-overlayfs (nested Podman storage)"
  ansible.builtin.package:
    name: "fuse-overlayfs"
    state: "present"


- name: "Molecule | Prepare | Ensure /etc/containers exists"
  ansible.builtin.file:
    path: "/etc/containers"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "u=rwx,g=rx,o=rx" # 0755


- name: "Molecule | Prepare | Configure nested Podman storage to use fuse-overlayfs"
  ansible.builtin.copy:
    content: |
      # Molecule testing environment: force fuse-overlayfs for nested Podman.
      # runroot/graphroot are the upstream defaults; the Debian and openSUSE
      # Podman builds refuse a storage.conf without an explicit runroot.
      [storage]
      driver = "overlay"
      runroot = "/run/containers/storage"
      graphroot = "/var/lib/containers/storage"

      [storage.options.overlay]
      mount_program = "/usr/bin/fuse-overlayfs"
    dest: "/etc/containers/storage.conf"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644


# loginctl talks to logind via the system D-Bus. The Debian family ITT images
# do not have it installed/running (container images suppress service starts);
# real target systems have D-Bus running from boot. Must be up BEFORE logind.
- name: "Molecule | Prepare | Install and start D-Bus (Debian family, needed for rootless tests)"
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'debian'
  block:

    - name: "Molecule | Prepare | Install D-Bus"
      ansible.builtin.package:
        name: "dbus"
        state: "present"


    - name: "Molecule | Prepare | Start D-Bus"
      ansible.builtin.systemd_service:
        name: "dbus.service"
        state: "started"


# Our Integration Test Target (ITT) container images ship with systemd-logind
# masked. The rootless functionality of this collection requires logind
# (lingering, per-user systemd instances), so unmask and start it for the tests.
# Real target systems (VMs, bare metal) have logind running anyway.
- name: "Molecule | Prepare | Unmask and start systemd-logind (needed for rootless tests)"
  ansible.builtin.systemd_service:
    name: "systemd-logind.service"
    masked: false
    state: "started"


# The molecule instances are containers created by a rootless Podman whose
# overlay storage (userxattr) cannot carry the security.capability extended
# attributes, so newuidmap/newgidmap lose their file capabilities inside the
# instances and nested rootless Podman fails with "newuidmap: write to uid_map
# failed". The setuid bit survives and is the documented alternative. Real
# target systems (VMs, bare metal) are not affected.
#
# Only relevant for platforms using file capabilities (RPM family); Debian and
# Ubuntu ship the binaries setuid anyway (and install them via the "uidmap"
# package later, so they may not even exist at prepare time - hence the stat).
- name: "Molecule | Prepare | Check for newuidmap/newgidmap (nested rootless tests)"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_prepare_newidmap_stat
  loop:
    - "/usr/sbin/newuidmap"
    - "/usr/sbin/newgidmap"
    - "/usr/bin/newuidmap"
    - "/usr/bin/newgidmap"
  loop_control:
    label: "{{ item }}"


- name: "Molecule | Prepare | Set the setuid bit on newuidmap/newgidmap (nested rootless tests)"
  ansible.builtin.file:
    path: "{{ item['stat']['path'] }}"
    mode: "u+s"
  when:
    - item['stat']['exists']
  loop: "{{ __testing_prepare_newidmap_stat['results'] }}"
  loop_control:
    label: "{{ item['item'] }}"
