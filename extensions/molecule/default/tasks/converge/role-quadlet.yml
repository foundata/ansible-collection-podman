# Execute the collection role "quadlet" against all driver-created instances:
# one rootful application ("webtest") and one rootless application ("usertest",
# running as the account created in role-host.yml).

- name: "Molecule | Converge | Include the foundata.podman.quadlet role (rootful application)"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "webtest"
    quadlet_podman_state: "present"
    quadlet_podman_service_state: "enabled"
    quadlet_podman_directories:
      - path: "/var/lib/webtest"
    quadlet_podman_files:
      - dest: "/var/lib/webtest/app.env"
        content: |
          WEBTEST_GREETING=hello
    quadlet_podman_secrets:
      - name: "webtest_secret"
        value: "molecule-test-value"
    quadlet_podman_unit_defaults:
      container:
        Service:
          Restart: "on-failure"
    quadlet_podman_units:
      - name: "webtest-data"
        type: "volume"
        sections:
          Volume:
            VolumeName: "webtest-data"
      - name: "webtest"
        type: "container"
        sections:
          Unit:
            Description: "Molecule webtest container"
            After:
              - "webtest-data"
          Container:
            ContainerName: "webtest"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "top"
            Volume:
              - "webtest-data.volume:/data"
            EnvironmentFile:
              - "/var/lib/webtest/app.env"
            # Value with whitespace on purpose: systemd word-splits unquoted
            # Environment= assignments, so this guards the renderer's quoting
            # (regression: an unquoted "-Xms1g -Xmx1g" style value lost
            # everything after the first word at runtime).
            Environment:
              - "WEBTEST_SPACES=first second"
            Secret:
              - "webtest_secret,type=env,target=WEBTEST_SECRET"
          Install:
            WantedBy:
              - "multi-user.target"
      # Run-once init pattern: RemainAfterExit parks the service in
      # "active (exited)" after success, so the started state stays
      # idempotent (changed=0 on the second converge)
      - name: "webtest-init"
        type: "container"
        sections:
          Unit:
            Description: "Molecule webtest run-once init container"
          Container:
            ContainerName: "webtest-init"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "true"
          Service:
            RemainAfterExit: true
          Install:
            WantedBy:
              - "multi-user.target"
      # Run-once job pattern: only the timer below may start it. Also
      # exercises the null-drop rendering (unsets the Restart default
      # inherited from quadlet_podman_unit_defaults; no Install at all)
      - name: "webtest-job"
        type: "container"
        service_state: "unmanaged"
        sections:
          Unit:
            Description: "Molecule webtest run-once job container"
          Container:
            ContainerName: "webtest-job"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "true"
          Service:
            Restart: ~
          Install: ~
    quadlet_podman_systemd_units:
      - name: "webtest-job.timer"
        sections:
          Unit:
            Description: "Molecule webtest job timer"
          Timer:
            # expanded to "webtest-job.service" (generated service name)
            Unit: "webtest-job"
            # must never fire during a test run
            OnCalendar: "2099-01-01 03:00:00"
          Install:
            WantedBy:
              - "timers.target"
      # Socket-activated helper: nothing ever connects during the test, the
      # socket merely has to listen (systemd refuses to start a socket whose
      # service unit does not exist, hence the generated service reference)
      - name: "webtest-sock.socket"
        sections:
          Unit:
            Description: "Molecule webtest activation socket"
          Socket:
            # expanded to "webtest-job.service" (generated service name)
            Service: "webtest-job"
            ListenStream: "/run/webtest-probe.sock"
          Install:
            WantedBy:
              - "sockets.target"


# The molecule instances are virtual machines, so the rootless START is
# testable on every platform (in nested container based testing environments,
# the Podman builds of Enterprise Linux 10 and openSUSE Leap 16 could not
# start rootless containers).
- name: "Molecule | Converge | Include the foundata.podman.quadlet role (rootless application)"
  ansible.builtin.include_role:
    name: "foundata.podman.quadlet"
  vars:
    quadlet_podman_app: "usertest"
    quadlet_podman_state: "present"
    quadlet_podman_service_state: "enabled"
    quadlet_podman_user: "containerapp"
    # A managed file so the rootless application gets a manifest: the verify
    # stage checks the manifest is root-owned outside the account's writable
    # tree (the recorded paths get removed as root on later runs).
    quadlet_podman_files:
      - dest: "/var/lib/podman/containerapp/usertest.env"
        content: |
          USERTEST_GREETING=hello
    quadlet_podman_units:
      - name: "usertest"
        type: "container"
        sections:
          Unit:
            Description: "Molecule usertest container (rootless)"
          Container:
            ContainerName: "usertest"
            Image: "quay.io/libpod/testimage:20241011"
            Exec: "top"
          Install:
            WantedBy:
              - "default.target"
    # Plain systemd user units: an unmanaged oneshot helper service plus the
    # timer that triggers it (rootless scope mechanics)
    quadlet_podman_systemd_units:
      - name: "usertest-job.service"
        service_state: "unmanaged"
        sections:
          Unit:
            Description: "Molecule usertest job (oneshot)"
          Service:
            Type: "oneshot"
            ExecStart: "/usr/bin/true"
      - name: "usertest-job.timer"
        sections:
          Unit:
            Description: "Molecule usertest job timer"
          Timer:
            Unit: "usertest-job.service"
            # must never fire during a test run
            OnCalendar: "2099-01-01 03:00:00"
          Install:
            WantedBy:
              - "timers.target"
