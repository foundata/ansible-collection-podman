# Execute the collection role "host" against all driver-created instances.

# The rootless test account is created here (the role does not create
# accounts; foundata.linux.user would do this in real deployments).
- name: "Molecule | Converge | Create the rootless test account"
  ansible.builtin.user:
    name: "containerapp"
    state: "present"
    system: true
    home: "/var/lib/podman/containerapp"
    create_home: true
    shell: "/bin/bash"
    password: "!"


- name: "Molecule | Converge | Include the foundata.podman.host role" # noqa: no-tabs (deliberate escaping stress fixture)
  ansible.builtin.include_role:
    name: "foundata.podman.host"
  vars:
    host_podman_state: "present"
    host_podman_service_state: "enabled"
    # A string on purpose (as delivered by "-e var=true" command line
    # extra-vars): the role has to coerce boolean arguments, not
    # truthiness-evaluate them.
    host_podman_auto_update: "true"
    host_podman_containers:
      containers:
        log_driver: "journald"
        # Escaping stress for the TOML renderer (regression: only quotes and
        # backslashes were escaped, so e.g. a newline produced an unparseable
        # file). An annotation is inert container metadata, safe to carry the
        # awkward characters in a live configuration.
        annotation:
          - "molecule.toml.stress=quote\" backslash\\ tab\t newline\n end"
    # A registry entry with a nested mirror list: covers the array-of-inline-
    # tables rendering (regression: nested mirror dictionaries were rendered
    # as quoted Python reprs, producing invalid TOML). The fake prefix keeps
    # real image pulls unaffected.
    host_podman_registries:
      registry:
        - prefix: "registry.example.com"
          location: "registry.example.com"
          mirror:
            - location: "mirror.example.com/reg"
              insecure: false
    host_podman_auto_update_timer_settings:
      # Distinct from the vendor podman-auto-update.timer schedule (daily) so the
      # verify can prove the drop-in replaces it rather than accumulating.
      # A list renders one assignment per item after the single shared reset,
      # so this also guards that repeatable triggers are not stringified.
      OnCalendar:
        - "*-*-* 04:00:00"
        - "Sat,Sun 05:00"
      # A second trigger of a different kind: all trigger directives share one
      # list in systemd, so this guards against a reset that wipes the calendar
      # trigger rendered before it.
      OnActiveSec: "7d"
      # boolean event trigger, guarding the third value kind of the contract
      OnClockChange: true
      RandomizedDelaySec: "30m"
    host_podman_selinux_label_paths:
      - "/var/lib/podman"
    # Values matching the built-in defaults and the distribution stock policy:
    # this exercises the whole-file write path (incl. saving the pre-role
    # originals) without changing the effective behavior mid-scenario. The
    # clear/restore transition is covered in the verify tasks.
    host_podman_storage:
      storage:
        driver: "overlay"
    host_podman_policy:
      default:
        - type: "insecureAcceptAnything"
    host_podman_rootless_users:
      - name: "containerapp"
        # Explicit range: functionally not needed on the VM instances, but it
        # exercises the explicit-range code path and makes the overlap
        # rejection tests in the verify stage deterministic (they reference
        # ranges relative to this one).
        subuid: "20000:20000"
        subgid: "20000:20000"
        # A string on purpose (as delivered by "-e var=true" command line
        # extra-vars): nested boolean keys have to be coerced, a truthiness
        # evaluation would work here but flip on "false".
        linger: "true"
