# Uninstall: Manage basic resource removal, such as packages or service users.

---

- name: "Setup | Uninstall | Stop and disable the managed systemd units"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: "stopped"
    enabled: false
  # tolerate units that do not exist (e.g. Podman was never installed here)
  failed_when: false
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  loop:
    - "{{ __host_podman_auto_update_timer_unit_name }}"
    - "{{ __host_podman_api_socket_unit_name }}"
  loop_control:
    label: "{{ item }}"


- name: "Setup | Uninstall | Revert the rootless enablement of the listed accounts"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/config/rootless_user.yml"
  vars:
    __host_podman_ru_force_absent: true
  loop: "{{ host_podman_rootless_users }}"
  loop_control:
    loop_var: "__host_podman_ru_raw"
    label: "{{ __host_podman_ru_raw['name'] }}"


# semanage rules cannot carry a marker; the manifest written by the config
# tasks records the rules this role created, and an empty declared list
# removes them all. With host_podman_selinux_manage set to false the role
# keeps its hands off and existing rules stay (documented contract).
- name: "Setup | Uninstall | Remove the role-created SELinux equivalence rules"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/config/selinux.yml"
  vars:
    __host_podman_selinux_declared_paths: []
  when:
    - host_podman_selinux_manage
    - ansible_facts['selinux']['status'] | ansible.builtin.default('') == 'enabled'


- name: "Setup | Uninstall | Remove the managed configuration drop-ins"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop:
    - "{{ __host_podman_containers_dropin_file_path }}"
    - "{{ __host_podman_registries_dropin_file_path }}"
    - "{{ __host_podman_auto_update_timer_dropin_dir_path }}"
  loop_control:
    label: "{{ item }}"
  notify:
    - "host_podman: systemd daemon-reload"


# storage.conf and policy.json have no drop-in mechanism, so the config tasks
# replace the whole file and save the pre-role original next to it (see
# vars/main.yml). Restore that original here; without one, the role-written
# storage.conf (identified via its marker) is removed, while policy.json is
# kept as removing the image trust policy would break any remaining
# containers tooling. Distribution files the role never touched stay as they
# are.
- name: "Setup | Uninstall | Check whether storage.conf is role-managed"
  ansible.builtin.command:
    argv:
      - "{{ __host_podman_grep_exec_path }}"
      - "-q"
      - "-s" # no error messages about nonexistent files
      - "{{ __host_podman_file_marker }}"
      - "{{ __host_podman_storage_file_path }}"
  register: __host_podman_storage_managed_result
  changed_when: false
  failed_when:
    - __host_podman_storage_managed_result['rc'] not in [0, 1, 2]


# Result indexes: 0 = saved storage.conf original, 1 = saved policy.json
# original.
- name: "Setup | Uninstall | Check for saved pre-role originals"
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __host_podman_uninstall_backups_stat
  loop:
    - "{{ __host_podman_storage_backup_file_path }}"
    - "{{ __host_podman_policy_backup_file_path }}"
  loop_control:
    label: "{{ item }}"


- name: "Setup | Uninstall | Restore the pre-role storage.conf"
  ansible.builtin.copy:
    src: "{{ __host_podman_storage_backup_file_path }}"
    dest: "{{ __host_podman_storage_file_path }}"
    remote_src: true
    mode: "preserve"
  when:
    - __host_podman_storage_managed_result['rc'] == 0
    - __host_podman_uninstall_backups_stat['results'][0]['stat']['exists']


- name: "Setup | Uninstall | Remove the role-written storage.conf (no original saved)"
  ansible.builtin.file:
    path: "{{ __host_podman_storage_file_path }}"
    state: "absent"
  when:
    - __host_podman_storage_managed_result['rc'] == 0
    - not __host_podman_uninstall_backups_stat['results'][0]['stat']['exists']


# A zero-length saved original is the sentinel for "no pre-role policy.json
# existed" (see the config tasks); restoring then means removing the file.
- name: "Setup | Uninstall | Restore the pre-role policy.json"
  ansible.builtin.copy:
    src: "{{ __host_podman_policy_backup_file_path }}"
    dest: "{{ __host_podman_policy_file_path }}"
    remote_src: true
    mode: "preserve"
  when:
    - __host_podman_uninstall_backups_stat['results'][1]['stat']['exists']
    - (__host_podman_uninstall_backups_stat['results'][1]['stat']['size'] | ansible.builtin.int) > 0


- name: "Setup | Uninstall | Remove policy.json (no pre-role file existed)"
  ansible.builtin.file:
    path: "{{ __host_podman_policy_file_path }}"
    state: "absent"
  when:
    - __host_podman_uninstall_backups_stat['results'][1]['stat']['exists']
    - (__host_podman_uninstall_backups_stat['results'][1]['stat']['size'] | ansible.builtin.int) == 0


- name: "Setup | Uninstall | Remove the saved pre-role originals"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop:
    - "{{ __host_podman_storage_backup_file_path }}"
    - "{{ __host_podman_policy_backup_file_path }}"
  loop_control:
    label: "{{ item }}"


- name: "Setup | Uninstall | Remove packages"
  ansible.builtin.package:
    name: "{{ __host_podman_packages_uninstall }}"
    state: "absent"
  when:
    - __host_podman_packages_uninstall is ansible.builtin.defined
    - (__host_podman_packages_uninstall | ansible.builtin.length) > 0
