# Initialization: Manage internal role setup and the Ansible environment.

---

- name: "Init | Gather role-specific facts"
  ansible.builtin.setup:
    gather_subset: "{{ __host_podman_used_facts.keys() | ansible.builtin.list }}"
  when:
    - not ((__host_podman_used_facts.values() | ansible.builtin.flatten)
           is ansible.builtin.subset(ansible_facts.keys()))


- name: "Init | Include role meta data"
  ansible.builtin.include_vars:
    file: "../meta/main.yml"
    name: "__host_podman_meta"


- name: "Init | Check Ansible version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Ansible {{ __host_podman_meta['galaxy_info']['min_ansible_version'] }}
      or higher. You are currently running Ansible {{ ansible_version['full'] }} .
  when:
    - ansible_version['full'] is ansible.builtin.version(__host_podman_meta['galaxy_info']['min_ansible_version'], '<')


- name: "Init | Notify when platform support check is not possible"
  ansible.builtin.debug:
    msg: >
      The list of supported platforms cannot be checked as it is either empty
      or distribution facts are missing.
    verbosity: 1
  when:
    - ansible_facts['os_family'] is not ansible.builtin.defined or
      ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['distribution_version'] is not ansible.builtin.defined or
      ansible_facts['distribution_major_version'] is not ansible.builtin.defined or
      ((__host_podman_supported_platforms | ansible.builtin.length) == 0)


- name: "Init | Warn when platform is unsupported"
  ansible.builtin.fail:
    msg: >
      Neither {{ ansible_facts['distribution'] }} (distribution) nor {{ ansible_facts['os_family'] }} (os_family)
      with versions '{{ ansible_facts['distribution_major_version'] }}', '{{ ansible_facts['distribution_version'] }}',
      or 'all' is in the list of supported platforms from vars/main.yml: {{ __host_podman_supported_platforms }}
  vars:
    __host_podman_platform_names_regex: >-
      ^({{ ansible_facts['distribution'] }}|{{ ansible_facts['os_family'] }})$
    __host_podman_platform_versions_regex: >-
      ^({{ ansible_facts['distribution_major_version'] }}|{{ ansible_facts['distribution_version'] }}|all)$
    __host_podman_matched_versions: >-
      {{
        __host_podman_supported_platforms
        | ansible.builtin.selectattr('name', 'ansible.builtin.match', __host_podman_platform_names_regex, ignorecase=true)
        | ansible.builtin.map(attribute='versions')
        | ansible.builtin.flatten
        | ansible.builtin.select('ansible.builtin.match', __host_podman_platform_versions_regex, ignorecase=true)
        | ansible.builtin.list
      }}
  when:
    - (__host_podman_supported_platforms | ansible.builtin.length) > 0
    - (__host_podman_matched_versions | ansible.builtin.length) == 0
  ignore_errors: true # noqa: ignore-errors


- name: "Init | Set platform-specific filename list (most to least specific; raw with possible duplicates)"
  ansible.builtin.set_fact:
    __host_podman_platform_filenames_raw:
      - "{{ __host_podman_dist }}_{{ __host_podman_dist_ver }}.yml"
      - "{{ __host_podman_dist }}_{{ __host_podman_dist_major }}.yml"
      - "{{ __host_podman_dist }}.yml"
      - "{{ __host_podman_os_family }}.yml"
  vars:
    __host_podman_dist: >-
      {{
        ansible_facts['distribution']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __host_podman_dist_ver: >-
      {{
        ansible_facts['distribution_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __host_podman_dist_major: >-
      {{
        ansible_facts['distribution_major_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __host_podman_os_family: >-
      {{
        ansible_facts['os_family']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}


- name: "Init | Set unique platform-specific filename list (most to least specific)"
  ansible.builtin.set_fact:
    __host_podman_platform_filenames_most_specific_first: >-
      {{
        (__host_podman_platform_filenames_raw
        | ansible.builtin.unique
        | ansible.builtin.default([]))
      }}


- name: "Init | Set unique platform-specific filename list (least to most specific)"
  ansible.builtin.set_fact:
    __host_podman_platform_filenames_most_specific_last: >-
      {{
        __host_podman_platform_filenames_most_specific_first
        | ansible.builtin.reverse
      }}


- name: "Init | Include platform-specific variables (if any), overwrite values with more specific ones"
  ansible.builtin.include_vars:
    file: "{{ __host_podman_vars_file }}"
  vars:
    __host_podman_vars_file: "{{ role_path }}/vars/{{ __host_podman_varsfile_item }}"
  when:
    - __host_podman_vars_file is ansible.builtin.file
  loop: "{{ __host_podman_platform_filenames_most_specific_last }}"
  loop_control:
    loop_var: "__host_podman_varsfile_item"


# The timer templates accept the following values per directive. The six
# repeatable trigger directives take a non-empty string, a number (except
# OnCalendar, which takes calendar expression strings) or a list of such
# values; an empty list is the supported way to drop the role's built-in
# default for that directive (e.g. to run a purely monotonic timer without a
# calendar schedule). The boolean event trigger directives OnClockChange and
# OnTimezoneChange take true or false, and a true value counts as a trigger,
# so an event-only timer is a valid configuration. Every other directive takes
# a single scalar. Everything else - mappings, null, booleans or empty strings
# for repeatable triggers, non-booleans for event triggers, unusable list
# members, lists for non-repeatable directives - would be stringified into an
# invalid systemd value or produce an enabled timer without any trigger, so it
# is rejected here instead of silently mis-rendered.
- name: "Init | Assert the timer settings use supported value types"
  ansible.builtin.assert:
    that:
      - (__host_podman_timer_value_offenders_0 | ansible.builtin.length) == 0
    fail_msg: >-
      Unsupported timer setting value(s):
      {{ (__host_podman_timer_value_offenders_0) | ansible.builtin.join(', ') }}.
      Repeatable trigger directives
      ({{ __host_podman_timer_trigger_directives | ansible.builtin.join(', ') }})
      take a non-empty string, a number (except OnCalendar) or a list of such
      values (an empty list drops the built-in default); the event trigger
      directives
      ({{ __host_podman_timer_event_trigger_directives | ansible.builtin.join(', ') }})
      take true or false; all other directives take a single scalar.
    success_msg: "All timer settings use supported value types."
  vars:
    __host_podman_timer_trigger_directives:
      - "OnCalendar"
      - "OnActiveSec"
      - "OnBootSec"
      - "OnStartupSec"
      - "OnUnitActiveSec"
      - "OnUnitInactiveSec"
    __host_podman_timer_event_trigger_directives:
      - "OnClockChange"
      - "OnTimezoneChange"
    __host_podman_timer_value_offenders_0: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for k, v in (__host_podman_auto_update_timer_settings_effective | ansible.builtin.default({})).items() -%}
      {%-   set is_seq = (v is ansible.builtin.iterable)
                          and (v is not ansible.builtin.string)
                          and (v is not ansible.builtin.mapping) -%}
      {%-   if k in __host_podman_timer_event_trigger_directives -%}
      {%-     if v is not ansible.builtin.boolean -%}
      {%-       set _ = ns.items.append(k ~ " (takes true or false)") -%}
      {%-     endif -%}
      {%-   elif k not in __host_podman_timer_trigger_directives -%}
      {%-     if is_seq or (v is ansible.builtin.mapping) or (v is ansible.builtin.none) -%}
      {%-       set _ = ns.items.append(k ~ " (takes a single scalar value)") -%}
      {%-     endif -%}
      {%-   elif (v is ansible.builtin.boolean) or (v is ansible.builtin.mapping) or (v is ansible.builtin.none) -%}
      {%-     set _ = ns.items.append(k ~ " (takes a non-empty string or a list of them)") -%}
      {%-   elif (v is ansible.builtin.string) and ((v | ansible.builtin.trim | ansible.builtin.length) == 0) -%}
      {%-     set _ = ns.items.append(k ~ " (empty string; use an empty list to drop the built-in default)") -%}
      {%-   elif (v is ansible.builtin.number) and (k == 'OnCalendar') -%}
      {%-     set _ = ns.items.append(k ~ " (takes a calendar expression string)") -%}
      {%-   elif is_seq -%}
      {%-     for e in v -%}
      {%-       set e_seq = (e is ansible.builtin.iterable) and (e is not ansible.builtin.string) -%}
      {%-       if (e is ansible.builtin.boolean) or e_seq or (e is ansible.builtin.none)
                    or ((e is ansible.builtin.string) and ((e | ansible.builtin.trim | ansible.builtin.length) == 0))
                    or ((e is ansible.builtin.number) and (k == 'OnCalendar')) -%}
      {%-         set _ = ns.items.append(k ~ " (list entry " ~ loop.index ~ " is not a usable trigger value)") -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.items }}


# Mirrors the conditions under which the automatic image update timer is actually managed in the
# config tasks, so settings the role will not render are not rejected.
- name: "Init | Assert the automatic image update timer keeps at least one trigger"
  ansible.builtin.assert:
    that:
      - __host_podman_timer_update_has_trigger | ansible.builtin.bool
    fail_msg: >-
      The merged timer settings for the automatic image update timer configure no trigger at all
      (e.g. every repeatable trigger was dropped via an empty list and no event
      trigger is true). The timer would be enabled but never fire; configure at
      least one trigger.
    success_msg: "The automatic image update timer keeps at least one trigger."
  vars:
    __host_podman_timer_trigger_directives:
      - "OnCalendar"
      - "OnActiveSec"
      - "OnBootSec"
      - "OnStartupSec"
      - "OnUnitActiveSec"
      - "OnUnitInactiveSec"
    __host_podman_timer_event_trigger_directives:
      - "OnClockChange"
      - "OnTimezoneChange"
    __host_podman_timer_update_has_trigger: >-
      {%- set ns = namespace(found=false) -%}
      {%- for k, v in (__host_podman_auto_update_timer_settings_effective | ansible.builtin.default({})).items() -%}
      {%-   if k in __host_podman_timer_trigger_directives -%}
      {%-     set is_seq = (v is ansible.builtin.iterable)
                            and (v is not ansible.builtin.string)
                            and (v is not ansible.builtin.mapping) -%}
      {%-     if is_seq -%}
      {%-       if (v | ansible.builtin.length) > 0 -%}{%- set ns.found = true -%}{%- endif -%}
      {%-     elif (v is ansible.builtin.string) -%}
      {%-       if (v | ansible.builtin.trim | ansible.builtin.length) > 0 -%}{%- set ns.found = true -%}{%- endif -%}
      {%-     elif (v is ansible.builtin.number) and (v is not ansible.builtin.boolean) -%}
      {%-       set ns.found = true -%}
      {%-     endif -%}
      {%-   elif (k in __host_podman_timer_event_trigger_directives)
                 and (v is ansible.builtin.boolean) and v -%}
      {%-     set ns.found = true -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.found }}
  when:
    - host_podman_auto_update | ansible.builtin.bool
    - host_podman_service_state != 'unmanaged'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'


# host_podman_rootless_users writes to the shared /etc/subuid and /etc/subgid
# files, so broken or colliding input must be rejected before anything gets
# written. Everything below is static; overlap against the assignments already
# present on the target host is checked at execution time in
# config/rootless_user.yml (their content is only known there).
- name: "Init | Assert account names in host_podman_rootless_users are unique"
  ansible.builtin.assert:
    that:
      - (__host_podman_ru_names | ansible.builtin.length) == (__host_podman_ru_names | ansible.builtin.unique | ansible.builtin.length)
    fail_msg: >-
      Each 'name' in host_podman_rootless_users must be unique; one or more
      duplicate account names were found. Duplicate entries would silently
      overwrite each other's subordinate ID ranges and per-user configuration.
    success_msg: "All account names in host_podman_rootless_users are unique."
  vars:
    __host_podman_ru_names: >-
      {{
        host_podman_rootless_users
        | ansible.builtin.map(attribute='name')
        | ansible.builtin.list
      }}
  when:
    - (host_podman_rootless_users | ansible.builtin.length) > 0


- name: "Init | Assert explicit subordinate ID ranges are well-formed"
  ansible.builtin.assert:
    that:
      - (__host_podman_subid_format_offenders | ansible.builtin.length) == 0
    fail_msg: >-
      Invalid subordinate ID range value(s) in host_podman_rootless_users:
      {{ __host_podman_subid_format_offenders | ansible.builtin.join(', ') }}.
      'subuid' and 'subgid' take '<start>:<count>' with two positive integers
      (e.g. '100000:65536'). A malformed line would break rootless Podman for
      the account, and a start of 0 would map the host's root ID into the
      user namespace.
    success_msg: "All explicit subordinate ID ranges are well-formed."
  vars:
    __host_podman_subid_format_offenders: >-
      {%- set __ns = namespace(items=[]) -%}
      {%- for __entry in host_podman_rootless_users -%}
      {%-   for __key in ['subuid', 'subgid'] -%}
      {%-     if __entry[__key] is ansible.builtin.defined -%}
      {%-       set __value = __entry[__key] | ansible.builtin.string -%}
      {%-       if __value is not ansible.builtin.match('^[0-9]+:[0-9]+$') -%}
      {%-         set _ = __ns.items.append(__entry['name'] ~ " " ~ __key ~ " '" ~ __value ~ "' (not <start>:<count>)") -%}
      {%-       elif ((__value.split(':')[0] | ansible.builtin.int) < 1) or ((__value.split(':')[1] | ansible.builtin.int) < 1) -%}
      {%-         set _ = __ns.items.append(__entry['name'] ~ " " ~ __key ~ " '" ~ __value ~ "' (start and count must be >= 1)") -%}
      {%-       endif -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ __ns.items }}
  when:
    - (host_podman_rootless_users | ansible.builtin.length) > 0


- name: "Init | Assert explicit subordinate ID ranges do not overlap between entries"
  ansible.builtin.assert:
    that:
      - (__host_podman_subid_overlap_offenders | ansible.builtin.length) == 0
    fail_msg: >-
      Overlapping explicit subordinate ID range(s) in host_podman_rootless_users:
      {{ __host_podman_subid_overlap_offenders | ansible.builtin.join(', ') }}.
      Overlapping ranges give different accounts the same host IDs and weaken
      the isolation between rootless users; assign disjoint ranges.
    success_msg: "The explicit subordinate ID ranges are disjoint."
  vars:
    # Only well-formed values are compared; malformed ones were already
    # rejected by the assert above.
    __host_podman_subid_overlap_offenders: >-
      {%- set __ns = namespace(items=[]) -%}
      {%- for __key in ['subuid', 'subgid'] -%}
      {%-   set __ranges = [] -%}
      {%-   for __entry in host_podman_rootless_users -%}
      {%-     if (__entry[__key] is ansible.builtin.defined)
                 and ((__entry[__key] | ansible.builtin.string) is ansible.builtin.match('^[0-9]+:[0-9]+$')) -%}
      {%-       set __start = ((__entry[__key] | ansible.builtin.string).split(':')[0] | ansible.builtin.int) -%}
      {%-       set __count = ((__entry[__key] | ansible.builtin.string).split(':')[1] | ansible.builtin.int) -%}
      {%-       set _ = __ranges.append({'name': __entry['name'], 'start': __start, 'end': __start + __count}) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%-   for __i in range(__ranges | ansible.builtin.length) -%}
      {%-     for __j in range(__i + 1, __ranges | ansible.builtin.length) -%}
      {%-       if (__ranges[__i]['start'] < __ranges[__j]['end']) and (__ranges[__j]['start'] < __ranges[__i]['end']) -%}
      {%-         set _ = __ns.items.append(__key ~ " of '" ~ __ranges[__i]['name'] ~ "' and '" ~ __ranges[__j]['name'] ~ "'") -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ __ns.items }}
  when:
    - (host_podman_rootless_users | ansible.builtin.length) > 1
