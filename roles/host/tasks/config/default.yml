# Configuration: Manage settings, like adapting or creating config files.

---

# "Distribution is supported" does not guarantee a new-enough Podman (pinned
# or third-party repositories), so check the actually installed version. The
# binary can be legitimately absent in check mode (the install phase gets
# skipped there on a fresh host), so its presence gates the probe; in a real
# run the install phase has either provided the binary or already failed.
- name: "Config | Default | Check whether the Podman binary is present"
  ansible.builtin.stat:
    path: "{{ __host_podman_podman_exec_path }}"
  register: __host_podman_exec_stat


- name: "Config | Default | Determine the installed Podman version"
  ansible.builtin.command:
    argv:
      - "{{ __host_podman_podman_exec_path }}"
      - "--version"
  register: __host_podman_version_result
  changed_when: false
  # The probe is read-only; run it under "--check" too, otherwise it is
  # skipped and the next task fails on the missing stdout.
  check_mode: false
  when:
    - __host_podman_exec_stat['stat']['exists']


- name: "Config | Default | Store the installed Podman version as fact"
  ansible.builtin.set_fact:
    __host_podman_version: >-
      {{
        __host_podman_version_result['stdout']
        | ansible.builtin.regex_search('[0-9]+\.[0-9]+(\.[0-9]+)?')
      }}
  when:
    - __host_podman_exec_stat['stat']['exists']


- name: "Config | Default | Check Podman version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Podman {{ __host_podman_min_podman_version }} or higher
      (several features this collection relies on were removed or replaced after
      Podman 4.x, e.g. CNI networking and slirp4netns). Podman
      {{ __host_podman_version }} was found at {{ __host_podman_podman_exec_path }}.
  when:
    - __host_podman_exec_stat['stat']['exists']
    - __host_podman_version is ansible.builtin.version(__host_podman_min_podman_version, '<')


### Engine configuration files (strictly opt-in, see vars/main.yml)

- name: "Config | Default | Ensure containers.conf drop-in directory exists"
  ansible.builtin.file:
    path: "{{ __host_podman_containers_dropin_dir_path }}"
    state: "directory"
    owner: "{{ __host_podman_config_dir_owner }}"
    group: "{{ __host_podman_config_dir_group }}"
    mode: "{{ __host_podman_config_dir_mode }}"
  when:
    - (__host_podman_containers_effective | ansible.builtin.length) > 0


- name: "Config | Default | Create containers.conf drop-in"
  ansible.builtin.template:
    src: "containers.conf.j2"
    dest: "{{ __host_podman_containers_dropin_file_path }}"
    owner: "{{ __host_podman_config_file_owner }}"
    group: "{{ __host_podman_config_file_group }}"
    mode: "{{ __host_podman_config_file_mode }}"
  vars:
    # Pass (and/or adjust) variables needed for the template
    tpl_containers_settings: "{{ __host_podman_containers_effective }}"
    tpl_file_marker: "{{ __host_podman_file_marker }}"
  when:
    - (__host_podman_containers_effective | ansible.builtin.length) > 0


- name: "Config | Default | Remove containers.conf drop-in (no settings supplied)"
  ansible.builtin.file:
    path: "{{ __host_podman_containers_dropin_file_path }}"
    state: "absent"
  when:
    - (__host_podman_containers_effective | ansible.builtin.length) == 0


- name: "Config | Default | Ensure registries.conf drop-in directory exists"
  ansible.builtin.file:
    path: "{{ __host_podman_registries_dropin_dir_path }}"
    state: "directory"
    owner: "{{ __host_podman_config_dir_owner }}"
    group: "{{ __host_podman_config_dir_group }}"
    mode: "{{ __host_podman_config_dir_mode }}"
  when:
    - (__host_podman_registries_effective | ansible.builtin.length) > 0


- name: "Config | Default | Create registries.conf drop-in"
  ansible.builtin.template:
    src: "registries.conf.j2"
    dest: "{{ __host_podman_registries_dropin_file_path }}"
    owner: "{{ __host_podman_config_file_owner }}"
    group: "{{ __host_podman_config_file_group }}"
    mode: "{{ __host_podman_config_file_mode }}"
  vars:
    # Pass (and/or adjust) variables needed for the template
    tpl_registries_settings: "{{ __host_podman_registries_effective }}"
    tpl_file_marker: "{{ __host_podman_file_marker }}"
  when:
    - (__host_podman_registries_effective | ansible.builtin.length) > 0


- name: "Config | Default | Remove registries.conf drop-in (no settings supplied)"
  ansible.builtin.file:
    path: "{{ __host_podman_registries_dropin_file_path }}"
    state: "absent"
  when:
    - (__host_podman_registries_effective | ansible.builtin.length) == 0


# No drop-in mechanism exists for storage.conf and policy.json, so supplying
# settings replaces the whole distribution file. The pre-role original is
# saved once before the first overwrite; clearing the variable again (or
# uninstalling the role) restores it, instead of leaving the last role-written
# file in effect (which matters especially for a stale image trust policy).

- name: "Config | Default | Check whether storage.conf is role-managed"
  ansible.builtin.command:
    argv:
      - "{{ __host_podman_grep_exec_path }}"
      - "-q"
      - "-s" # no error messages about nonexistent files
      - "{{ __host_podman_file_marker }}"
      - "{{ __host_podman_storage_file_path }}"
  register: __host_podman_storage_managed_result
  changed_when: false
  failed_when:
    - __host_podman_storage_managed_result['rc'] not in [0, 1, 2]


# Result indexes: 0 = storage.conf, 1 = its saved original,
# 2 = policy.json, 3 = its saved original.
- name: "Config | Default | Check for storage.conf, policy.json and their saved originals"
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __host_podman_transition_stat
  loop:
    - "{{ __host_podman_storage_file_path }}"
    - "{{ __host_podman_storage_backup_file_path }}"
    - "{{ __host_podman_policy_file_path }}"
    - "{{ __host_podman_policy_backup_file_path }}"
  loop_control:
    label: "{{ item }}"


# Save the distribution original exactly once: only a file that is not yet
# role-managed (no marker) gets saved, so later runs never overwrite the
# original with role-rendered content.
- name: "Config | Default | Save the pre-role storage.conf before the first overwrite"
  ansible.builtin.copy:
    src: "{{ __host_podman_storage_file_path }}"
    dest: "{{ __host_podman_storage_backup_file_path }}"
    remote_src: true
    mode: "preserve"
    owner: "{{ __host_podman_config_file_owner }}"
    group: "{{ __host_podman_config_file_group }}"
  when:
    - (host_podman_storage | ansible.builtin.length) > 0
    - __host_podman_transition_stat['results'][0]['stat']['exists']
    - __host_podman_storage_managed_result['rc'] != 0
    - not __host_podman_transition_stat['results'][1]['stat']['exists']


- name: "Config | Default | Create storage.conf"
  ansible.builtin.template:
    src: "storage.conf.j2"
    dest: "{{ __host_podman_storage_file_path }}"
    owner: "{{ __host_podman_config_file_owner }}"
    group: "{{ __host_podman_config_file_group }}"
    mode: "{{ __host_podman_config_file_mode }}"
  vars:
    # Pass (and/or adjust) variables needed for the template
    tpl_storage_settings: "{{ __host_podman_storage_effective }}"
    tpl_file_marker: "{{ __host_podman_file_marker }}"
  when:
    - (host_podman_storage | ansible.builtin.length) > 0


- name: "Config | Default | Restore the pre-role storage.conf (settings cleared)"
  ansible.builtin.copy:
    src: "{{ __host_podman_storage_backup_file_path }}"
    dest: "{{ __host_podman_storage_file_path }}"
    remote_src: true
    mode: "preserve"
  when:
    - (host_podman_storage | ansible.builtin.length) == 0
    - __host_podman_storage_managed_result['rc'] == 0
    - __host_podman_transition_stat['results'][1]['stat']['exists']


# Without a saved original the removal restores the pre-role behavior:
# Podman's built-in defaults match the role's base values (see vars/main.yml).
- name: "Config | Default | Remove the role-written storage.conf (settings cleared, no original saved)"
  ansible.builtin.file:
    path: "{{ __host_podman_storage_file_path }}"
    state: "absent"
  when:
    - (host_podman_storage | ansible.builtin.length) == 0
    - __host_podman_storage_managed_result['rc'] == 0
    - not __host_podman_transition_stat['results'][1]['stat']['exists']


- name: "Config | Default | Remove the saved storage.conf original (settings cleared)"
  ansible.builtin.file:
    path: "{{ __host_podman_storage_backup_file_path }}"
    state: "absent"
  when:
    - (host_podman_storage | ansible.builtin.length) == 0


# policy.json cannot carry a marker comment (strict JSON), so the saved
# original doubles as the role-management indicator: it exists exactly while
# the role owns the file. When there is no pre-role policy.json at all, a
# zero-length sentinel records that fact (a real policy is never empty);
# without it, a later run would mistake the role-written file for the
# original.
- name: "Config | Default | Save the pre-role policy.json before the first overwrite"
  ansible.builtin.copy:
    src: "{{ __host_podman_policy_file_path }}"
    dest: "{{ __host_podman_policy_backup_file_path }}"
    remote_src: true
    mode: "preserve"
    owner: "{{ __host_podman_config_file_owner }}"
    group: "{{ __host_podman_config_file_group }}"
  when:
    - (host_podman_policy | ansible.builtin.length) > 0
    - __host_podman_transition_stat['results'][2]['stat']['exists']
    - not __host_podman_transition_stat['results'][3]['stat']['exists']


- name: "Config | Default | Record the absence of a pre-role policy.json (sentinel)"
  ansible.builtin.copy:
    content: ""
    dest: "{{ __host_podman_policy_backup_file_path }}"
    owner: "{{ __host_podman_config_file_owner }}"
    group: "{{ __host_podman_config_file_group }}"
    mode: "{{ __host_podman_config_file_mode }}"
  when:
    - (host_podman_policy | ansible.builtin.length) > 0
    - not __host_podman_transition_stat['results'][2]['stat']['exists']
    - not __host_podman_transition_stat['results'][3]['stat']['exists']


- name: "Config | Default | Create policy.json (image trust policy)"
  ansible.builtin.copy:
    content: "{{ host_podman_policy | ansible.builtin.to_nice_json }}\n"
    dest: "{{ __host_podman_policy_file_path }}"
    owner: "{{ __host_podman_config_file_owner }}"
    group: "{{ __host_podman_config_file_group }}"
    mode: "{{ __host_podman_config_file_mode }}"
  when:
    - (host_podman_policy | ansible.builtin.length) > 0


# Restores the pre-role state exactly: the saved original, or (zero-length
# sentinel, see above) the absence of a policy.json. Without any saved
# original the file is left alone: it is either a distribution file this role
# never touched, or role state from before the save mechanism existed, where
# guessing would be worse than keeping the effective policy visible.
- name: "Config | Default | Restore the pre-role policy.json (policy cleared)"
  ansible.builtin.copy:
    src: "{{ __host_podman_policy_backup_file_path }}"
    dest: "{{ __host_podman_policy_file_path }}"
    remote_src: true
    mode: "preserve"
  when:
    - (host_podman_policy | ansible.builtin.length) == 0
    - __host_podman_transition_stat['results'][3]['stat']['exists']
    - (__host_podman_transition_stat['results'][3]['stat']['size'] | ansible.builtin.int) > 0


- name: "Config | Default | Remove policy.json (policy cleared, no pre-role file existed)"
  ansible.builtin.file:
    path: "{{ __host_podman_policy_file_path }}"
    state: "absent"
  when:
    - (host_podman_policy | ansible.builtin.length) == 0
    - __host_podman_transition_stat['results'][3]['stat']['exists']
    - (__host_podman_transition_stat['results'][3]['stat']['size'] | ansible.builtin.int) == 0


- name: "Config | Default | Remove the saved policy.json original (restored)"
  ansible.builtin.file:
    path: "{{ __host_podman_policy_backup_file_path }}"
    state: "absent"
  when:
    - (host_podman_policy | ansible.builtin.length) == 0


### SELinux file contexts for additional container storage paths

# Reconciled against a manifest of role-created rules (see
# tasks/config/selinux.yml): rules for paths removed from
# host_podman_selinux_label_paths are deleted again. With
# host_podman_selinux_manage set to false the role keeps its hands off
# entirely; existing rules and the manifest stay as they are.
- name: "Config | Default | Manage SELinux file contexts for additional storage paths"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/config/selinux.yml"
  vars:
    __host_podman_selinux_declared_paths: "{{ host_podman_selinux_label_paths }}"
  when:
    - host_podman_selinux_manage | ansible.builtin.bool
    - ansible_facts['selinux']['status'] | ansible.builtin.default('') == 'enabled'


### Automatic container image updates (system podman-auto-update.timer)

- name: "Config | Default | Manage systemd timer drop-in for automatic image updates"
  when:
    - host_podman_auto_update | ansible.builtin.bool
    - host_podman_service_state != 'unmanaged'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  block:

    - name: "Config | Default | Ensure systemd timer override directory exists"
      ansible.builtin.file:
        path: "{{ __host_podman_auto_update_timer_dropin_dir_path }}"
        state: "directory"
        owner: "{{ __host_podman_auto_update_timer_dropin_dir_owner }}"
        group: "{{ __host_podman_auto_update_timer_dropin_dir_group }}"
        mode: "{{ __host_podman_auto_update_timer_dropin_dir_mode }}"
      notify:
        - "host_podman: systemd daemon-reload"


    - name: "Config | Default | Create systemd timer drop-in config file"
      ansible.builtin.template:
        src: "systemd_timer.conf.j2"
        dest: "{{ __host_podman_auto_update_timer_dropin_file_path }}"
        owner: "{{ __host_podman_auto_update_timer_dropin_file_owner }}"
        group: "{{ __host_podman_auto_update_timer_dropin_file_group }}"
        mode: "{{ __host_podman_auto_update_timer_dropin_file_mode }}"
      vars:
        # Pass (and/or adjust) variables needed for the template
        tpl_timer_settings: "{{ __host_podman_auto_update_timer_settings_effective }}"
      notify:
        - "host_podman: systemd daemon-reload"


# Also removed when service_state is "unmanaged": the role then fully backs off,
# so its schedule override is dropped and the vendor timer schedule takes over
# (otherwise a stale drop-in from an earlier managed run would linger).
- name: "Config | Default | Remove systemd timer drop-in (image updates disabled or service unmanaged)"
  ansible.builtin.file:
    path: "{{ __host_podman_auto_update_timer_dropin_dir_path }}"
    state: "absent"
  when:
    - (not host_podman_auto_update) or (host_podman_service_state == 'unmanaged')
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  notify:
    - "host_podman: systemd daemon-reload"


- name: "Config | Default | Warn about unsupported service manager for timer configuration"
  ansible.builtin.debug:
    msg: >-
      Automatic image update timer management is only supported with systemd as
      service manager. The current service manager '{{ ansible_facts['service_mgr'] }}'
      is not supported; no update timer gets managed.
  when:
    - host_podman_auto_update | ansible.builtin.bool
    - host_podman_service_state != 'unmanaged'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) != 'systemd'


### Rootless enablement for listed user accounts

- name: "Config | Default | Enable rootless Podman usage per listed account"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/config/rootless_user.yml"
  loop: "{{ host_podman_rootless_users }}"
  loop_control:
    loop_var: "__host_podman_ru_raw"
    label: "{{ __host_podman_ru_raw['name'] }}"
