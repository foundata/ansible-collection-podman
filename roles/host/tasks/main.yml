# Main entry point for the role.

---

- name: "Main | Include role initialization tasks"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/init.yml"
    apply:
      tags:
        - "always"
        - "host_podman_always"
  tags:
    - "always"
    - "host_podman_always"


# Separate includes for platform-specific files and default.yml on purpose. When
# looping over "platform files + ['default.yml']" for multiple platforms in one
# play, Ansible batches them across all hosts. Insertion order depends on when
# results arrive (non-deterministic behavior) and default.yml may run before the
# platform-specific files. Separate tasks enforce the required barrier.

- name: "Main | Include setup tasks (install): best platform matches (if any)"
  ansible.builtin.include_tasks:
    file: "{{ __host_podman_task_file }}"
    apply:
      tags:
        - "host_podman_setup"
  vars:
    __host_podman_task_file: "{{ role_path }}/tasks/setup/install/{{ __host_podman_loop_item }}"
  when:
    - host_podman_state == 'present'
    - __host_podman_task_file is ansible.builtin.file
  loop: "{{ __host_podman_platform_filenames_most_specific_first }}"
  loop_control:
    loop_var: "__host_podman_loop_item"
  tags:
    - "host_podman_setup"


- name: "Main | Include setup tasks (install): default"
  ansible.builtin.include_tasks:
    file: "{{ __host_podman_task_file }}"
    apply:
      tags:
        - "host_podman_setup"
  vars:
    __host_podman_task_file: "{{ role_path }}/tasks/setup/install/default.yml"
  when:
    - host_podman_state == 'present'
    - __host_podman_task_file is ansible.builtin.file
  tags:
    - "host_podman_setup"


- name: "Main | Include configuration tasks: best platform matches (if any)"
  ansible.builtin.include_tasks:
    file: "{{ __host_podman_task_file }}"
    apply:
      tags:
        - "host_podman_config"
  vars:
    __host_podman_task_file: "{{ role_path }}/tasks/config/{{ __host_podman_loop_item }}"
  when:
    - host_podman_state == 'present'
    - __host_podman_task_file is ansible.builtin.file
  loop: "{{ __host_podman_platform_filenames_most_specific_first }}"
  loop_control:
    loop_var: "__host_podman_loop_item"
  tags:
    - "host_podman_config"


- name: "Main | Include configuration tasks: default"
  ansible.builtin.include_tasks:
    file: "{{ __host_podman_task_file }}"
    apply:
      tags:
        - "host_podman_config"
  vars:
    __host_podman_task_file: "{{ role_path }}/tasks/config/default.yml"
  when:
    - host_podman_state == 'present'
    - __host_podman_task_file is ansible.builtin.file
  tags:
    - "host_podman_config"


- name: "Main | Include service or daemon management tasks: best platform matches (if any)"
  ansible.builtin.include_tasks:
    file: "{{ __host_podman_task_file }}"
    apply:
      tags:
        - "host_podman_service"
  vars:
    __host_podman_task_file: "{{ role_path }}/tasks/service/{{ __host_podman_loop_item }}"
  when:
    - host_podman_state == 'present'
    - __host_podman_task_file is ansible.builtin.file
  loop: "{{ __host_podman_platform_filenames_most_specific_first }}"
  loop_control:
    loop_var: "__host_podman_loop_item"
  tags:
    - "host_podman_service"


- name: "Main | Include service or daemon management tasks: default"
  ansible.builtin.include_tasks:
    file: "{{ __host_podman_task_file }}"
    apply:
      tags:
        - "host_podman_service"
  vars:
    __host_podman_task_file: "{{ role_path }}/tasks/service/default.yml"
  when:
    - host_podman_state == 'present'
    - __host_podman_task_file is ansible.builtin.file
  tags:
    - "host_podman_service"


- name: "Main | Include setup tasks (uninstall): best platform matches (if any)"
  ansible.builtin.include_tasks:
    file: "{{ __host_podman_task_file }}"
    apply:
      tags:
        - "host_podman_setup"
  vars:
    __host_podman_task_file: "{{ role_path }}/tasks/setup/uninstall/{{ __host_podman_loop_item }}"
  when:
    - host_podman_state == 'absent'
    - __host_podman_task_file is ansible.builtin.file
  loop: "{{ __host_podman_platform_filenames_most_specific_first }}"
  loop_control:
    loop_var: "__host_podman_loop_item"
  tags:
    - "host_podman_setup"

- name: "Main | Include setup tasks (uninstall): default"
  ansible.builtin.include_tasks:
    file: "{{ __host_podman_task_file }}"
    apply:
      tags:
        - "host_podman_setup"
  vars:
    __host_podman_task_file: "{{ role_path }}/tasks/setup/uninstall/default.yml"
  when:
    - host_podman_state == 'absent'
    - __host_podman_task_file is ansible.builtin.file
  tags:
    - "host_podman_setup"
