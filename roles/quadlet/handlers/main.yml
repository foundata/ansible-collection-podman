# Handlers: Tasks that are triggered and run only when notified.

---

# Both handlers run in the scope of the application (system instance for
# rootful, the target account's user instance for rootless), so they carry the
# same become/environment plumbing as the tasks (see vars/main.yml).

- name: "Handlers | systemd daemon-reload"
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: "{{ __quadlet_podman_systemd_scope }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  listen:
    - "quadlet_podman: systemd daemon-reload"


# Containers only pick up changed unit or environment files when their service
# gets restarted. Restarts happen in start order (pods first); services are
# started (not just restarted) if they were not running. Only units whose
# effective per-unit service_state is enabled/running are restarted; e.g. an
# "unmanaged" run-once container picks up changes at its next timer-triggered
# or boot start instead.
- name: "Handlers | Restart application services"
  ansible.builtin.systemd_service:
    name: "{{ __quadlet_podman_service_item }}"
    state: "restarted"
    scope: "{{ __quadlet_podman_systemd_scope }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  when:
    - quadlet_podman_state == 'present'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  loop: "{{ __quadlet_podman_services_start }}"
  loop_control:
    loop_var: "__quadlet_podman_service_item"
    label: "{{ __quadlet_podman_service_item }}"
  listen:
    - "quadlet_podman: restart application services"


# Changed plain unit files only take effect after a restart of their unit
# (e.g. a new OnCalendar of a running timer); same per-unit service_state
# filtering as above.
- name: "Handlers | Restart application systemd units"
  ansible.builtin.systemd_service:
    name: "{{ __quadlet_podman_systemd_unit_name_item }}"
    state: "restarted"
    scope: "{{ __quadlet_podman_systemd_scope }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  when:
    - quadlet_podman_state == 'present'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  loop: "{{ __quadlet_podman_systemd_units_restart }}"
  loop_control:
    loop_var: "__quadlet_podman_systemd_unit_name_item"
    label: "{{ __quadlet_podman_systemd_unit_name_item }}"
  listen:
    - "quadlet_podman: restart application systemd units"
