# Configuration: Manage settings, like adapting or creating config files.

---

# Order matters:
#   1. host directories  -> bind-mount sources must exist before units start
#   2. managed files     -> environment/config files referenced by the units
#   3. secrets           -> referenced by the units at container creation
#   4. registry logins   -> image pulls must be able to authenticate
#   5. Quadlet units     -> written last, then a single daemon-reload (handler)
#   6. cleanup           -> units removed from quadlet_podman_units get reaped,
#                           and manifest-recorded secrets, files and registry
#                           logins no longer declared get removed / logged out
#   7. manifest          -> records the application's current resources for
#                           the next run's cleanup and for state "absent"


- name: "Config | Default | Read the application manifest (previously created resources)"
  ansible.builtin.slurp:
    src: "{{ __quadlet_podman_manifest_file_path }}"
  register: __quadlet_podman_manifest_slurp
  failed_when:
    # tolerate a missing manifest (first run; treated as empty below)
    - __quadlet_podman_manifest_slurp['msg'] is ansible.builtin.defined
    - "'file not found' not in (__quadlet_podman_manifest_slurp['msg'] | ansible.builtin.lower)"


- name: "Config | Default | Determine the previously created resources of the application"
  ansible.builtin.set_fact:
    __quadlet_podman_manifest_old: >-
      {{
        (__quadlet_podman_manifest_slurp['content'] | ansible.builtin.default('')
         | ansible.builtin.b64decode | ansible.builtin.from_yaml)
        | ansible.builtin.default({}, true)
      }}


- name: "Config | Default | Ensure the user configuration directory exists (rootless)"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_user_home }}/{{ item }}"
    state: "directory"
    owner: "{{ __quadlet_podman_file_owner }}"
    group: "{{ __quadlet_podman_file_group }}"
    mode: "{{ __quadlet_podman_unit_dir_mode }}"
  when:
    - __quadlet_podman_rootless | ansible.builtin.bool
  loop:
    - ".config"
    - ".config/containers"
    - ".config/systemd"
    - ".config/systemd/user"
  loop_control:
    label: "{{ __quadlet_podman_user_home }}/{{ item }}"


- name: "Config | Default | Ensure the Quadlet unit directory exists"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_unit_dir_path }}"
    state: "directory"
    owner: "{{ __quadlet_podman_file_owner }}"
    group: "{{ __quadlet_podman_file_group }}"
    mode: "{{ __quadlet_podman_unit_dir_mode }}"


- name: "Config | Default | Manage host directories of the application"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_dir_item['path'] }}"
    state: "{{ 'directory' if __quadlet_podman_dir_present else 'absent' }}"
    owner: "{{ __quadlet_podman_dir_item['owner'] | ansible.builtin.default(__quadlet_podman_file_owner) if __quadlet_podman_dir_present else omit }}"
    group: "{{ __quadlet_podman_dir_item['group'] | ansible.builtin.default(__quadlet_podman_file_group) if __quadlet_podman_dir_present else omit }}"
    mode: "{{ __quadlet_podman_dir_item['mode'] | ansible.builtin.default(__quadlet_podman_dir_default_mode) if __quadlet_podman_dir_present else omit }}"
  vars:
    __quadlet_podman_dir_present: "{{ (__quadlet_podman_dir_item['state'] | ansible.builtin.default('present')) == 'present' }}"
  loop: "{{ quadlet_podman_directories }}"
  loop_control:
    loop_var: "__quadlet_podman_dir_item"
    label: "{{ __quadlet_podman_dir_item['path'] }}"


- name: "Config | Default | Manage files of the application"
  ansible.builtin.copy:
    content: "{{ __quadlet_podman_file_item['content'] | ansible.builtin.default('') }}"
    dest: "{{ __quadlet_podman_file_item['dest'] }}"
    owner: "{{ __quadlet_podman_file_item['owner'] | ansible.builtin.default(__quadlet_podman_file_owner) }}"
    group: "{{ __quadlet_podman_file_item['group'] | ansible.builtin.default(__quadlet_podman_file_group) }}"
    mode: "{{ __quadlet_podman_file_item['mode'] | ansible.builtin.default(__quadlet_podman_managed_file_default_mode) }}"
  when:
    - (__quadlet_podman_file_item['state'] | ansible.builtin.default('present')) == 'present'
  loop: "{{ quadlet_podman_files }}"
  loop_control:
    loop_var: "__quadlet_podman_file_item"
    label: "{{ __quadlet_podman_file_item['dest'] }}"
  notify:
    - "quadlet_podman: restart application services"


# The restart notify makes the removal effective for running services: a
# started container keeps its bind-mounted file open (and its environment)
# until recreated, so without a restart it would keep using stale data.
- name: "Config | Default | Remove files of the application (item state is absent)"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_file_item['dest'] }}"
    state: "absent"
  when:
    - (__quadlet_podman_file_item['state'] | ansible.builtin.default('present')) == 'absent'
  loop: "{{ quadlet_podman_files }}"
  loop_control:
    loop_var: "__quadlet_podman_file_item"
    label: "{{ __quadlet_podman_file_item['dest'] }}"
  notify:
    - "quadlet_podman: restart application services"


# The manifests of the other applications in this scope are needed twice:
# for the exclusive-ownership check right below and for the registry logout
# further down (shared authfile).
- name: "Config | Default | Find the manifests of the other applications in this scope"
  ansible.builtin.find:
    paths: "{{ __quadlet_podman_manifest_dir_path }}"
    patterns:
      - "*.ansible-manifest"
    file_type: "file"
  register: __quadlet_podman_manifest_find


- name: "Config | Default | Read the manifests of the other applications in this scope"
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: __quadlet_podman_other_manifests_slurp
  loop: >-
    {{
      __quadlet_podman_manifest_find['files']
      | ansible.builtin.map(attribute='path')
      | ansible.builtin.reject('ansible.builtin.eq', __quadlet_podman_manifest_file_path)
      | ansible.builtin.list
    }}
  loop_control:
    label: "{{ item }}"


# Resources are exclusively owned: declaration is authoritative for existence
# and content, so two applications of one scope claiming the same secret name
# or managed file would rewrite and delete each other's resources. Reject the
# conflict before anything is changed (a shared credential can be declared
# per application under different secret names with the same value).
- name: "Config | Default | Check the declared secrets and files are not claimed by another application"
  ansible.builtin.assert:
    that:
      - (__quadlet_podman_secret_conflicts | ansible.builtin.length) == 0
      - (__quadlet_podman_file_conflicts | ansible.builtin.length) == 0
    fail_msg: >-
      Another application's manifest in this scope already records these
      resources: secrets
      [{{ __quadlet_podman_secret_conflicts | ansible.builtin.join(', ') }}],
      files [{{ __quadlet_podman_file_conflicts | ansible.builtin.join(', ') }}].
      Each secret name and managed file belongs to exactly one application.
    quiet: true
  vars:
    __quadlet_podman_other_claims: >-
      {%- set __ns = namespace(secrets=[], files=[]) -%}
      {%- for __result in (__quadlet_podman_other_manifests_slurp['results'] | ansible.builtin.default([])) -%}
      {%-   set __manifest = ((__result['content'] | ansible.builtin.default('') | ansible.builtin.b64decode
                               | ansible.builtin.from_yaml) | ansible.builtin.default({}, true)) -%}
      {%-   set __ns.secrets = __ns.secrets + (__manifest['secrets'] | ansible.builtin.default([])) -%}
      {%-   set __ns.files = __ns.files + (__manifest['files'] | ansible.builtin.default([])) -%}
      {%- endfor -%}
      {{ {'secrets': __ns.secrets, 'files': __ns.files} }}
    __quadlet_podman_secret_conflicts: >-
      {{ __quadlet_podman_secret_names_declared | ansible.builtin.intersect(__quadlet_podman_other_claims['secrets']) }}
    __quadlet_podman_file_conflicts: >-
      {{ __quadlet_podman_file_dests_declared | ansible.builtin.intersect(__quadlet_podman_other_claims['files']) }}


# Declared secrets are authoritative for existence AND content: the current
# value is read back (never logged) and a secret is only recreated when its
# value differs, keeping runs idempotent without exposing data. Rotation is
# therefore implicit: change the declared value and converge. Podman copies
# secret data into containers at creation time, so a changed secret also
# restarts the application services (Quadlet services recreate their
# containers on start, which re-materializes the secret).
- name: "Config | Default | Inspect the current values of the application's Podman secrets"
  ansible.builtin.command:
    argv:
      - "{{ __quadlet_podman_podman_exec_path }}"
      - "secret"
      - "inspect"
      - "--showsecret"
      - "--format"
      - "{{ '{{.SecretData}}' }}"
      - "{{ __quadlet_podman_secret_item['name'] }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  register: __quadlet_podman_secret_current
  changed_when:
    - false
  # a missing secret is the normal fresh case
  failed_when:
    - false
  # read-only probe; run it under "--check" too so the comparison works there
  check_mode: false
  no_log: true # secret values must not be leaked into logs or diffs
  when:
    - (__quadlet_podman_secret_item['state'] | ansible.builtin.default('present')) == 'present'
  loop: "{{ quadlet_podman_secrets }}"
  loop_control:
    loop_var: "__quadlet_podman_secret_item"


- name: "Config | Default | Determine the Podman secrets needing an update"
  ansible.builtin.set_fact:
    # names only: the value comparison happens inside this task, nothing but
    # the names leaves it
    __quadlet_podman_secret_changed_names: >-
      {%- set __ns = namespace(names=[]) -%}
      {%- for __r in (__quadlet_podman_secret_current['results'] | ansible.builtin.default([])) -%}
      {%-   if not (__r['skipped'] | ansible.builtin.default(false)) -%}
      {%-     set __item = __r['__quadlet_podman_secret_item'] -%}
      {%-     set __desired = (__item['value'] | ansible.builtin.default('')) | ansible.builtin.regex_replace('\n+$', '') -%}
      {%-     if ((__r['rc'] | ansible.builtin.default(1)) != 0) or ((__r['stdout'] | ansible.builtin.default('')) != __desired) -%}
      {%-       set _ = __ns.names.append(__item['name']) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ __ns.names }}
  no_log: true # the comparison input contains secret values


- name: "Config | Default | Manage Podman secrets of the application"
  containers.podman.podman_secret:
    name: "{{ __quadlet_podman_secret_item['name'] }}"
    # strip trailing newlines: a common source of subtle authentication
    # failures when values come from files or lookups
    data: "{{ (__quadlet_podman_secret_item['value'] | ansible.builtin.default('')) | ansible.builtin.regex_replace('\\n+$', '') }}"
    state: "{{ __quadlet_podman_secret_item['state'] | ansible.builtin.default('present') }}"
    force: true
    skip_existing: false
    executable: "{{ __quadlet_podman_podman_exec_path }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  when:
    - >-
      ((__quadlet_podman_secret_item['state'] | ansible.builtin.default('present')) == 'absent')
      or (__quadlet_podman_secret_item['name'] in __quadlet_podman_secret_changed_names)
  loop: "{{ quadlet_podman_secrets }}"
  loop_control:
    loop_var: "__quadlet_podman_secret_item"
  no_log: true # secret values must not be leaked into logs or diffs
  notify:
    - "quadlet_podman: restart application services"


# A persistent authfile is used instead of podman's runtime-directory default,
# so pulls by the generated services and podman-auto-update keep working after
# a reboot (see __quadlet_podman_authfile_path).
- name: "Config | Default | Log in to the container registries of the application"
  containers.podman.podman_login:
    registry: "{{ __quadlet_podman_registry_item['registry'] }}"
    username: "{{ __quadlet_podman_registry_item['username'] }}"
    password: "{{ __quadlet_podman_registry_item['password'] }}"
    authfile: "{{ __quadlet_podman_authfile_path }}"
    executable: "{{ __quadlet_podman_podman_exec_path }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  loop: "{{ quadlet_podman_registry_auth }}"
  loop_control:
    loop_var: "__quadlet_podman_registry_item"
  no_log: true # registry credentials must not be leaked into logs or diffs


- name: "Config | Default | Create the Quadlet unit files of the application"
  ansible.builtin.template:
    src: "quadlet_unit.j2"
    dest: "{{ __quadlet_podman_unit_dir_path }}/{{ __quadlet_podman_unit_item['filename'] }}"
    owner: "{{ __quadlet_podman_file_owner }}"
    group: "{{ __quadlet_podman_file_group }}"
    mode: "{{ __quadlet_podman_unit_file_mode }}"
  vars:
    # Pass (and/or adjust) variables needed for the template
    tpl_unit: "{{ __quadlet_podman_unit_item }}"
    tpl_service_map: "{{ __quadlet_podman_service_map }}"
    tpl_file_marker: "{{ __quadlet_podman_file_marker }}"
  loop: "{{ __quadlet_podman_units_effective }}"
  loop_control:
    loop_var: "__quadlet_podman_unit_item"
    label: "{{ __quadlet_podman_unit_item['filename'] }}"
  notify:
    - "quadlet_podman: systemd daemon-reload"
    - "quadlet_podman: restart application services"


# Plain units are restarted on change via their own handler (not the
# application services one): e.g. a changed OnCalendar only takes effect
# after the timer is restarted, while unrelated application services need no
# restart for it.
- name: "Config | Default | Create the plain systemd unit files of the application"
  ansible.builtin.template:
    src: "systemd_unit.j2"
    dest: "{{ __quadlet_podman_systemd_unit_dir_path }}/{{ __quadlet_podman_systemd_unit_item['name'] }}"
    owner: "{{ __quadlet_podman_file_owner }}"
    group: "{{ __quadlet_podman_file_group }}"
    mode: "{{ __quadlet_podman_unit_file_mode }}"
  vars:
    # Pass (and/or adjust) variables needed for the template
    tpl_unit: "{{ __quadlet_podman_systemd_unit_item }}"
    tpl_service_map: "{{ __quadlet_podman_service_map }}"
    tpl_file_marker: "{{ __quadlet_podman_file_marker }}"
  loop: "{{ __quadlet_podman_systemd_units_effective }}"
  loop_control:
    loop_var: "__quadlet_podman_systemd_unit_item"
    label: "{{ __quadlet_podman_systemd_unit_item['name'] }}"
  notify:
    - "quadlet_podman: systemd daemon-reload"
    - "quadlet_podman: restart application systemd units"


### Cleanup: reap this application's units that are no longer listed

- name: "Config | Default | Find Quadlet unit files in the unit directory"
  ansible.builtin.find:
    paths:
      - "{{ __quadlet_podman_unit_dir_path }}"
    patterns: "{{ __quadlet_podman_unit_extensions | ansible.builtin.map('ansible.builtin.regex_replace', '^', '*.') | ansible.builtin.list }}"
    file_type: "file"
  register: __quadlet_podman_find_result


- name: "Config | Default | Determine stale unit files of the application"
  ansible.builtin.command:
    argv: >-
      {{
        [__quadlet_podman_grep_exec_path, '-l', '-s', '-x', '-F', '--', __quadlet_podman_file_marker]
        + __quadlet_podman_stale_candidates
      }}
  register: __quadlet_podman_stale_result
  changed_when: false
  # read-only probe; run it under "--check" too so check mode reports the
  # stale-unit removals instead of silently skipping them
  check_mode: false
  failed_when:
    - __quadlet_podman_stale_result['rc'] not in [0, 1, 2]
  vars:
    __quadlet_podman_stale_candidates: >-
      {{
        __quadlet_podman_find_result['files']
        | ansible.builtin.map(attribute='path')
        | ansible.builtin.reject('ansible.builtin.in',
            __quadlet_podman_units_effective
            | ansible.builtin.map(attribute='filename')
            | ansible.builtin.map('ansible.builtin.regex_replace', '^', __quadlet_podman_unit_dir_path ~ '/')
            | ansible.builtin.list
          )
        | ansible.builtin.list
      }}
  when:
    - (__quadlet_podman_stale_candidates | ansible.builtin.length) > 0


# The generated service name normally derives from the unit file name, but
# a ServiceName= setting inside the file overrides it; the files still exist
# here and are the authoritative source (same mechanism as in the uninstall
# flow).
- name: "Config | Default | Read the stale unit files (service name resolution)"
  ansible.builtin.slurp:
    src: "{{ __quadlet_podman_stale_path }}"
  register: __quadlet_podman_stale_slurp
  loop: "{{ __quadlet_podman_stale_result['stdout_lines'] | ansible.builtin.default([]) }}"
  loop_control:
    loop_var: "__quadlet_podman_stale_path"
    label: "{{ __quadlet_podman_stale_path }}"


- name: "Config | Default | Map the stale unit files to their generated service names"
  ansible.builtin.set_fact:
    __quadlet_podman_stale_service_map: >-
      {%- set __ns = namespace(map={}) -%}
      {%- for __r in (__quadlet_podman_stale_slurp['results'] | ansible.builtin.default([])) -%}
      {%-   set __path = __r['__quadlet_podman_stale_path'] -%}
      {%-   set __stem = __path | ansible.builtin.basename | ansible.builtin.splitext | ansible.builtin.first -%}
      {%-   set __ext = __path | ansible.builtin.basename | ansible.builtin.splitext | ansible.builtin.last | ansible.builtin.regex_replace('^\.', '') -%}
      {#-   no capture-group argument on purpose: '\1' as a Jinja string
            literal is an octal escape (control character), which
            regex_search rejects as "Unknown argument" -#}
      {%-   set __line = (__r['content'] | ansible.builtin.default('') | ansible.builtin.b64decode)
                         | ansible.builtin.regex_search('(?m)^\s*ServiceName\s*=\s*\S+\s*$') -%}
      {%-   set __override = (__line.split('=', 1) | ansible.builtin.last | ansible.builtin.trim) if __line else '' -%}
      {%-   set __service = (__override ~ '.service')
                            if ((__override | ansible.builtin.length) > 0)
                            else (__stem ~ (__quadlet_podman_service_suffix_map[__ext] | ansible.builtin.default('')) ~ '.service') -%}
      {%-   set _ = __ns.map.update({__path: __service}) -%}
      {%- endfor -%}
      {{ __ns.map }}


- name: "Config | Default | Stop the services of stale unit files"
  ansible.builtin.systemd_service:
    name: "{{ __quadlet_podman_stale_service }}"
    state: "stopped"
    scope: "{{ __quadlet_podman_systemd_scope }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  vars:
    __quadlet_podman_stale_service: "{{ __quadlet_podman_stale_service_map[__quadlet_podman_stale_path] }}"
  # tolerate services that are not loaded (unit was never started or the
  # generator rejected it)
  failed_when: false
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  loop: "{{ __quadlet_podman_stale_result['stdout_lines'] | ansible.builtin.default([]) }}"
  loop_control:
    loop_var: "__quadlet_podman_stale_path"
    label: "{{ __quadlet_podman_stale_path }}"


# Clear a possible "failed" state so the unit does not stay pinned in systemd
# after its file is removed and the daemon reloaded.
- name: "Config | Default | Clear the failed state of stale services"
  ansible.builtin.command:
    argv: >-
      {{
        [__quadlet_podman_systemctl_exec_path]
        + (['--user'] if (__quadlet_podman_rootless | ansible.builtin.bool) else [])
        + ['reset-failed', __quadlet_podman_stale_service]
      }}
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  vars:
    __quadlet_podman_stale_service: "{{ __quadlet_podman_stale_service_map[__quadlet_podman_stale_path] }}"
  changed_when: false
  # tolerate services systemd does not know (unit was never started)
  failed_when: false
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  loop: "{{ __quadlet_podman_stale_result['stdout_lines'] | ansible.builtin.default([]) }}"
  loop_control:
    loop_var: "__quadlet_podman_stale_path"
    label: "{{ __quadlet_podman_stale_path }}"


- name: "Config | Default | Remove stale unit files of the application"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_stale_path }}"
    state: "absent"
  loop: "{{ __quadlet_podman_stale_result['stdout_lines'] | ansible.builtin.default([]) }}"
  loop_control:
    loop_var: "__quadlet_podman_stale_path"
    label: "{{ __quadlet_podman_stale_path }}"
  notify:
    - "quadlet_podman: systemd daemon-reload"


### Cleanup: reap this application's plain systemd units no longer listed
### (marker-identified like the Quadlet files; other files in the shared
### systemd unit directory are never touched)

- name: "Config | Default | Find plain systemd unit files in the systemd unit directory"
  ansible.builtin.find:
    paths:
      - "{{ __quadlet_podman_systemd_unit_dir_path }}"
    patterns: "{{ __quadlet_podman_systemd_unit_suffixes | ansible.builtin.map('ansible.builtin.regex_replace', '^', '*.') | ansible.builtin.list }}"
    file_type: "file"
  register: __quadlet_podman_systemd_find_result


- name: "Config | Default | Determine stale plain systemd unit files of the application"
  ansible.builtin.command:
    argv: >-
      {{
        [__quadlet_podman_grep_exec_path, '-l', '-s', '-x', '-F', '--', __quadlet_podman_file_marker]
        + __quadlet_podman_systemd_stale_candidates
      }}
  register: __quadlet_podman_systemd_stale_result
  changed_when: false
  # read-only probe; run it under "--check" too so check mode reports the
  # stale-unit removals instead of silently skipping them
  check_mode: false
  failed_when:
    - __quadlet_podman_systemd_stale_result['rc'] not in [0, 1, 2]
  vars:
    __quadlet_podman_systemd_stale_candidates: >-
      {{
        __quadlet_podman_systemd_find_result['files']
        | ansible.builtin.map(attribute='path')
        | ansible.builtin.reject('ansible.builtin.in',
            __quadlet_podman_systemd_units_effective
            | ansible.builtin.map(attribute='name')
            | ansible.builtin.map('ansible.builtin.regex_replace', '^', __quadlet_podman_systemd_unit_dir_path ~ '/')
            | ansible.builtin.list
          )
        | ansible.builtin.list
      }}
  when:
    - (__quadlet_podman_systemd_stale_candidates | ansible.builtin.length) > 0


- name: "Config | Default | Stop the stale plain systemd units"
  ansible.builtin.systemd_service:
    name: "{{ __quadlet_podman_stale_path | ansible.builtin.basename }}"
    state: "stopped"
    scope: "{{ __quadlet_podman_systemd_scope }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  # tolerate units that are not loaded (unit was never started)
  failed_when: false
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  loop: "{{ __quadlet_podman_systemd_stale_result['stdout_lines'] | ansible.builtin.default([]) }}"
  loop_control:
    loop_var: "__quadlet_podman_stale_path"
    label: "{{ __quadlet_podman_stale_path }}"


# Disabling removes the enablement symlinks (e.g. in timers.target.wants/)
# that would otherwise dangle after the unit file removal below. The command
# module is used intentionally: ansible.builtin.systemd_service fails on
# units without an Install section, this cleanup must tolerate them.
- name: "Config | Default | Disable the stale plain systemd units"
  ansible.builtin.command:
    argv: >-
      {{
        [__quadlet_podman_systemctl_exec_path]
        + (['--user'] if (__quadlet_podman_rootless | ansible.builtin.bool) else [])
        + ['disable', __quadlet_podman_stale_path | ansible.builtin.basename]
      }}
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  changed_when: false
  # tolerate units systemd does not know or that carry no Install section
  failed_when: false
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  loop: "{{ __quadlet_podman_systemd_stale_result['stdout_lines'] | ansible.builtin.default([]) }}"
  loop_control:
    loop_var: "__quadlet_podman_stale_path"
    label: "{{ __quadlet_podman_stale_path }}"


# Clear a possible "failed" state so the unit does not stay pinned in systemd
# after its file is removed and the daemon reloaded.
- name: "Config | Default | Clear the failed state of the stale plain systemd units"
  ansible.builtin.command:
    argv: >-
      {{
        [__quadlet_podman_systemctl_exec_path]
        + (['--user'] if (__quadlet_podman_rootless | ansible.builtin.bool) else [])
        + ['reset-failed', __quadlet_podman_stale_path | ansible.builtin.basename]
      }}
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  changed_when: false
  # tolerate units systemd does not know (unit was never started)
  failed_when: false
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  loop: "{{ __quadlet_podman_systemd_stale_result['stdout_lines'] | ansible.builtin.default([]) }}"
  loop_control:
    loop_var: "__quadlet_podman_stale_path"
    label: "{{ __quadlet_podman_stale_path }}"


- name: "Config | Default | Remove the stale plain systemd unit files of the application"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_stale_path }}"
    state: "absent"
  loop: "{{ __quadlet_podman_systemd_stale_result['stdout_lines'] | ansible.builtin.default([]) }}"
  loop_control:
    loop_var: "__quadlet_podman_stale_path"
    label: "{{ __quadlet_podman_stale_path }}"
  notify:
    - "quadlet_podman: systemd daemon-reload"


### Cleanup: reap manifest-recorded resources that are no longer declared
### (renamed or de-listed secrets, managed files and registry logins)

# Only secret names are handled here, no secret values are involved.
- name: "Config | Default | Remove Podman secrets no longer declared"
  containers.podman.podman_secret:
    name: "{{ __quadlet_podman_stale_secret }}"
    state: "absent"
    executable: "{{ __quadlet_podman_podman_exec_path }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  loop: >-
    {{
      (__quadlet_podman_manifest_old['secrets'] | ansible.builtin.default([]))
      | ansible.builtin.reject('ansible.builtin.in', __quadlet_podman_secret_names_declared)
      | ansible.builtin.list
    }}
  loop_control:
    loop_var: "__quadlet_podman_stale_secret"


- name: "Config | Default | Remove managed files no longer declared"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_stale_file }}"
    state: "absent"
  loop: >-
    {{
      (__quadlet_podman_manifest_old['files'] | ansible.builtin.default([]))
      | ansible.builtin.reject('ansible.builtin.in', __quadlet_podman_file_dests_declared)
      | ansible.builtin.list
    }}
  loop_control:
    loop_var: "__quadlet_podman_stale_file"
  notify:
    - "quadlet_podman: restart application services"


# All applications of a scope share one authfile, so a logout for this
# application would also cut off every other application still using the
# same registry (until its next run re-creates the login). Removes the
# registry's credentials from the shared authfile; registries that the
# manifest of another application (read further up) still declares are
# skipped: logging them out here would break that application's image pulls
# until its next run.
- name: "Config | Default | Log out of container registries no longer declared"
  containers.podman.podman_logout:
    registry: "{{ __quadlet_podman_stale_registry }}"
    authfile: "{{ __quadlet_podman_authfile_path }}"
    executable: "{{ __quadlet_podman_podman_exec_path }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  register: __quadlet_podman_logout_result
  failed_when:
    # tolerate already-removed credentials or a hand-deleted authfile
    - __quadlet_podman_logout_result is ansible.builtin.failed
    - >-
      (__quadlet_podman_logout_result['msg'] | ansible.builtin.default('') | ansible.builtin.lower)
      is not ansible.builtin.search('not logged in|no such file')
  vars:
    __quadlet_podman_registries_other_apps: >-
      {%- set __registries = [] -%}
      {%- for __result in (__quadlet_podman_other_manifests_slurp['results'] | ansible.builtin.default([])) -%}
      {%-   set __manifest = ((__result['content'] | ansible.builtin.default('') | ansible.builtin.b64decode
                               | ansible.builtin.from_yaml) | ansible.builtin.default({}, true)) -%}
      {%-   for __registry in (__manifest['registries'] | ansible.builtin.default([])) -%}
      {%-     set _ = __registries.append(__registry) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ __registries }}
  loop: >-
    {{
      (__quadlet_podman_manifest_old['registries'] | ansible.builtin.default([]))
      | ansible.builtin.reject('ansible.builtin.in', __quadlet_podman_registries_declared)
      | ansible.builtin.reject('ansible.builtin.in', __quadlet_podman_registries_other_apps)
      | ansible.builtin.list
    }}
  loop_control:
    loop_var: "__quadlet_podman_stale_registry"


### Manifest: record the application's current resources

# Written last so it only records what the run above actually ensured.
# Owned by root on purpose (also in the user scope): the recorded file paths
# get removed with root privileges later, so the service account must not be
# able to modify them (see vars/main.yml).
- name: "Config | Default | Ensure the manifest directory of this scope exists"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_manifest_dir_path }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "u=rwx,g=,o=" # 0700
  when: >-
    ((__quadlet_podman_secret_names_declared | ansible.builtin.length) > 0)
    or ((__quadlet_podman_file_dests_declared | ansible.builtin.length) > 0)
    or ((__quadlet_podman_registries_declared | ansible.builtin.length) > 0)


- name: "Config | Default | Record the application's resources in the manifest"
  ansible.builtin.copy:
    content: |
      {{ __quadlet_podman_file_marker }}
      {{ __quadlet_podman_manifest_data | ansible.builtin.to_nice_yaml(indent=2) }}
    dest: "{{ __quadlet_podman_manifest_file_path }}"
    owner: "root"
    group: "root"
    mode: "u=rw,g=,o=" # 0600
  vars:
    __quadlet_podman_manifest_data:
      files: "{{ __quadlet_podman_file_dests_declared | ansible.builtin.sort }}"
      registries: "{{ __quadlet_podman_registries_declared | ansible.builtin.sort }}"
      secrets: "{{ __quadlet_podman_secret_names_declared | ansible.builtin.sort }}"
  when: >-
    ((__quadlet_podman_secret_names_declared | ansible.builtin.length) > 0)
    or ((__quadlet_podman_file_dests_declared | ansible.builtin.length) > 0)
    or ((__quadlet_podman_registries_declared | ansible.builtin.length) > 0)


- name: "Config | Default | Remove the application manifest (no recorded resources)"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_manifest_file_path }}"
    state: "absent"
  when:
    - (quadlet_podman_units | ansible.builtin.length) == 0
    - (quadlet_podman_systemd_units | ansible.builtin.length) == 0
    - (__quadlet_podman_secret_names_declared | ansible.builtin.length) == 0
    - (__quadlet_podman_file_dests_declared | ansible.builtin.length) == 0
    - (__quadlet_podman_registries_declared | ansible.builtin.length) == 0
