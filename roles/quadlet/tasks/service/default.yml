# Services and daemons: Manage their state, configure, or create them.

---

# The services managed here are the systemd units the Quadlet generator
# creates from the application's unit files, plus the plain systemd units of
# the application (quadlet_podman_systemd_units). The workload types
# (container, pod, kube) are always managed, as the documented global
# semantics demand ("running" starts and "disabled" stops them even without
# an Install section); the dependency-only types (volume, network, image,
# build, artifact) start on demand as dependencies and are only managed when
# they carry an Install section or an explicit per-unit service_state. The
# effective per-unit service_state (falling back to
# quadlet_podman_service_state) then decides what happens. Start order: pods
# first (member containers find their pod service on start), stop order
# reversed, plain units last (e.g. timers start after the application).
#
# Note: units created by a systemd generator cannot be enabled or disabled via
# systemctl; whether a service starts at boot is governed by the Install
# section of its Quadlet unit (see the quadlet_podman_service_state docs).
# Plain unit files support real enablement, handled below.

- name: "Service | Default | Apply pending systemd changes before managing the services"
  ansible.builtin.meta: "flush_handlers"


- name: "Service | Default | Start the services of the application"
  ansible.builtin.systemd_service:
    name: "{{ __quadlet_podman_service_item }}"
    state: "started"
    scope: "{{ __quadlet_podman_systemd_scope }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  loop: "{{ __quadlet_podman_services_start }}"
  loop_control:
    loop_var: "__quadlet_podman_service_item"
    label: "{{ __quadlet_podman_service_item }}"


- name: "Service | Default | Stop the services of the application (service state is disabled)"
  ansible.builtin.systemd_service:
    name: "{{ __quadlet_podman_service_item }}"
    state: "stopped"
    scope: "{{ __quadlet_podman_systemd_scope }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  loop: "{{ __quadlet_podman_services_stop | ansible.builtin.reverse }}"
  loop_control:
    loop_var: "__quadlet_podman_service_item"
    label: "{{ __quadlet_podman_service_item }}"


# Unlike Quadlet-generated services, plain unit files support systemctl
# enable/disable, with explicit semantics: "enabled" enables the unit (an
# Install section is required, checked at init); "running" and "disabled"
# actively disable it, so an enablement symlink left behind by an earlier
# [Install]-carrying version of the file cannot survive a state that demands
# no boot start. The tolerant systemctl command is used for disabling on
# purpose: the CURRENT file may carry no [Install] anymore, where the
# systemd_service module would fail instead of removing the old symlink.
- name: "Service | Default | Disable the plain systemd units of the application (state running or disabled)"
  ansible.builtin.command:
    argv: >-
      {{
        [__quadlet_podman_systemctl_exec_path]
        + (['--user'] if (__quadlet_podman_rootless | ansible.builtin.bool) else [])
        + ['disable', __quadlet_podman_systemd_unit_item['name']]
      }}
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  register: __quadlet_podman_systemd_disable_result
  changed_when:
    - "'Removed' in (__quadlet_podman_systemd_disable_result['stderr'] | ansible.builtin.default(''))"
  # tolerate units without installation configuration
  failed_when: false
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
    - __quadlet_podman_systemd_unit_item['service_state'] in ['running', 'disabled']
  loop: "{{ __quadlet_podman_systemd_units_manage }}"
  loop_control:
    loop_var: "__quadlet_podman_systemd_unit_item"
    label: "{{ __quadlet_podman_systemd_unit_item['name'] }}"


- name: "Service | Default | Manage the plain systemd units of the application"
  ansible.builtin.systemd_service:
    name: "{{ __quadlet_podman_systemd_unit_item['name'] }}"
    state: "{{ 'started' if __quadlet_podman_systemd_unit_state in ['enabled', 'running'] else 'stopped' }}"
    enabled: "{{ true if (__quadlet_podman_systemd_unit_state == 'enabled') else omit }}"
    scope: "{{ __quadlet_podman_systemd_scope }}"
  become: true
  become_user: "{{ __quadlet_podman_become_user }}"
  environment: "{{ __quadlet_podman_task_environment }}"
  vars:
    __quadlet_podman_systemd_unit_state: "{{ __quadlet_podman_systemd_unit_item['service_state'] }}"
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  loop: "{{ __quadlet_podman_systemd_units_manage }}"
  loop_control:
    loop_var: "__quadlet_podman_systemd_unit_item"
    label: "{{ __quadlet_podman_systemd_unit_item['name'] }}"


- name: "Service | Default | Warn about unsupported service manager"
  ansible.builtin.debug:
    msg: >-
      Quadlet units are a systemd mechanism. The current service manager
      '{{ ansible_facts['service_mgr'] }}' is not supported; the unit files were
      written but no services get managed.
  when:
    - quadlet_podman_service_state != 'unmanaged'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) != 'systemd'
