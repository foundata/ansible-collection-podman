# Initialization: Manage internal role setup and the Ansible environment.

---

- name: "Init | Gather role-specific facts"
  ansible.builtin.setup:
    gather_subset: "{{ __quadlet_podman_used_facts.keys() | ansible.builtin.list }}"
  when:
    - not ((__quadlet_podman_used_facts.values() | ansible.builtin.flatten)
           is ansible.builtin.subset(ansible_facts.keys()))


- name: "Init | Include role meta data"
  ansible.builtin.include_vars:
    file: "../meta/main.yml"
    name: "__quadlet_podman_meta"


- name: "Init | Check Ansible version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Ansible {{ __quadlet_podman_meta['galaxy_info']['min_ansible_version'] }}
      or higher. You are currently running Ansible {{ ansible_version['full'] }} .
  when:
    - ansible_version['full'] is ansible.builtin.version(__quadlet_podman_meta['galaxy_info']['min_ansible_version'], '<')


- name: "Init | Notify when platform support check is not possible"
  ansible.builtin.debug:
    msg: >
      The list of supported platforms cannot be checked as it is either empty
      or distribution facts are missing.
    verbosity: 1
  when:
    - ansible_facts['os_family'] is not ansible.builtin.defined or
      ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['distribution_version'] is not ansible.builtin.defined or
      ansible_facts['distribution_major_version'] is not ansible.builtin.defined or
      ((__quadlet_podman_supported_platforms | ansible.builtin.length) == 0)


- name: "Init | Warn when platform is unsupported"
  ansible.builtin.fail:
    msg: >
      Neither {{ ansible_facts['distribution'] }} (distribution) nor {{ ansible_facts['os_family'] }} (os_family)
      with versions '{{ ansible_facts['distribution_major_version'] }}', '{{ ansible_facts['distribution_version'] }}',
      or 'all' is in the list of supported platforms from vars/main.yml: {{ __quadlet_podman_supported_platforms }}
  vars:
    __quadlet_podman_platform_names_regex: >-
      ^({{ ansible_facts['distribution'] }}|{{ ansible_facts['os_family'] }})$
    __quadlet_podman_platform_versions_regex: >-
      ^({{ ansible_facts['distribution_major_version'] }}|{{ ansible_facts['distribution_version'] }}|all)$
    __quadlet_podman_matched_versions: >-
      {{
        __quadlet_podman_supported_platforms
        | ansible.builtin.selectattr('name', 'ansible.builtin.match', __quadlet_podman_platform_names_regex, ignorecase=true)
        | ansible.builtin.map(attribute='versions')
        | ansible.builtin.flatten
        | ansible.builtin.select('ansible.builtin.match', __quadlet_podman_platform_versions_regex, ignorecase=true)
        | ansible.builtin.list
      }}
  when:
    - (__quadlet_podman_supported_platforms | ansible.builtin.length) > 0
    - (__quadlet_podman_matched_versions | ansible.builtin.length) == 0
  ignore_errors: true # noqa: ignore-errors


- name: "Init | Set platform-specific filename list (most to least specific; raw with possible duplicates)"
  ansible.builtin.set_fact:
    __quadlet_podman_platform_filenames_raw:
      - "{{ __quadlet_podman_dist }}_{{ __quadlet_podman_dist_ver }}.yml"
      - "{{ __quadlet_podman_dist }}_{{ __quadlet_podman_dist_major }}.yml"
      - "{{ __quadlet_podman_dist }}.yml"
      - "{{ __quadlet_podman_os_family }}.yml"
  vars:
    __quadlet_podman_dist: >-
      {{
        ansible_facts['distribution']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __quadlet_podman_dist_ver: >-
      {{
        ansible_facts['distribution_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __quadlet_podman_dist_major: >-
      {{
        ansible_facts['distribution_major_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __quadlet_podman_os_family: >-
      {{
        ansible_facts['os_family']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}


- name: "Init | Set unique platform-specific filename list (most to least specific)"
  ansible.builtin.set_fact:
    __quadlet_podman_platform_filenames_most_specific_first: >-
      {{
        (__quadlet_podman_platform_filenames_raw
        | ansible.builtin.unique
        | ansible.builtin.default([]))
      }}


- name: "Init | Set unique platform-specific filename list (least to most specific)"
  ansible.builtin.set_fact:
    __quadlet_podman_platform_filenames_most_specific_last: >-
      {{
        __quadlet_podman_platform_filenames_most_specific_first
        | ansible.builtin.reverse
      }}


- name: "Init | Include platform-specific variables (if any), overwrite values with more specific ones"
  ansible.builtin.include_vars:
    file: "{{ __quadlet_podman_vars_file }}"
  vars:
    __quadlet_podman_vars_file: "{{ role_path }}/vars/{{ __quadlet_podman_varsfile_item }}"
  when:
    - __quadlet_podman_vars_file is ansible.builtin.file
  loop: "{{ __quadlet_podman_platform_filenames_most_specific_last }}"
  loop_control:
    loop_var: "__quadlet_podman_varsfile_item"


### quadlet specific

- name: "Init | Check basic application input for validity"
  ansible.builtin.assert:
    that:
      # application identifier: lowercase letters, digits, "_" and "-"
      - quadlet_podman_app is ansible.builtin.match('^[a-z0-9_-]+$')
      # unit names: unique and safe for filenames / systemd unit names
      - >-
        (quadlet_podman_units | ansible.builtin.map(attribute='name') | ansible.builtin.length)
        ==
        (quadlet_podman_units | ansible.builtin.map(attribute='name') | ansible.builtin.unique | ansible.builtin.length)
      - >-
        quadlet_podman_units
        | ansible.builtin.map(attribute='name')
        | ansible.builtin.reject('ansible.builtin.match', '^[A-Za-z0-9_.-]+$')
        | ansible.builtin.length == 0
      # slirp4netns was removed in Podman 6; pasta is the rootless default
      - quadlet_podman_units | ansible.builtin.string is not ansible.builtin.search('slirp4netns')
    fail_msg: >-
      Invalid input: quadlet_podman_app must match '^[a-z0-9_-]+$'; unit names in
      quadlet_podman_units must be unique, match '^[A-Za-z0-9_.-]+$' and must not
      reference the removed 'slirp4netns' network mode (use 'pasta' instead).
    quiet: true


# Duplicate resource declarations are almost always a copy-paste error and,
# combined with per-item state values, make the outcome order-dependent (one
# entry creating what another one deletes). Unit names are checked above;
# this covers the remaining item lists. File and directory paths share one
# namespace: the same path declared in both lists is contradictory, too.
- name: "Init | Check the application resource lists for duplicates"
  ansible.builtin.assert:
    that:
      - >-
        (((quadlet_podman_files | ansible.builtin.map(attribute='dest') | ansible.builtin.list)
          + (quadlet_podman_directories | ansible.builtin.map(attribute='path') | ansible.builtin.list))
         | ansible.builtin.length)
        ==
        (((quadlet_podman_files | ansible.builtin.map(attribute='dest') | ansible.builtin.list)
          + (quadlet_podman_directories | ansible.builtin.map(attribute='path') | ansible.builtin.list))
         | ansible.builtin.unique | ansible.builtin.length)
      - >-
        (quadlet_podman_secrets | ansible.builtin.map(attribute='name') | ansible.builtin.length)
        ==
        (quadlet_podman_secrets | ansible.builtin.map(attribute='name') | ansible.builtin.unique | ansible.builtin.length)
      - >-
        (quadlet_podman_registry_auth | ansible.builtin.map(attribute='registry') | ansible.builtin.length)
        ==
        (quadlet_podman_registry_auth | ansible.builtin.map(attribute='registry') | ansible.builtin.unique | ansible.builtin.length)
    fail_msg: >-
      Invalid input: destinations in quadlet_podman_files and paths in
      quadlet_podman_directories (shared namespace, checked across both lists), names in
      quadlet_podman_secrets and registries in quadlet_podman_registry_auth must
      be unique. Duplicate declarations make the outcome order-dependent.
    quiet: true


# The merge result gets pruned: a null section or setting drops that entry
# entirely, so units can unset something inherited from
# quadlet_podman_unit_defaults (e.g. Install on a timer-triggered unit).
- name: "Init | Build the effective unit list (type defaults merged with each unit's sections)"
  ansible.builtin.set_fact:
    __quadlet_podman_units_effective: >-
      {%- set __ns = namespace(units=[]) -%}
      {%- for __u in quadlet_podman_units -%}
      {%-   set __type = __u['type'] -%}
      {%-   set __merged = (quadlet_podman_unit_defaults[__type] | ansible.builtin.default({}))
              | ansible.builtin.combine(__u['sections'], recursive=true) -%}
      {%-   set __sns = namespace(sections={}) -%}
      {%-   for __section_name, __section_settings in __merged.items() -%}
      {%-     if __section_settings is not ansible.builtin.none -%}
      {%-       set __ins = namespace(settings={}) -%}
      {%-       for __key, __value in __section_settings.items() -%}
      {%-         if __value is not ansible.builtin.none -%}
      {%-           set __ins.settings = __ins.settings | ansible.builtin.combine({__key: __value}) -%}
      {%-         endif -%}
      {%-       endfor -%}
      {%-       if (__ins.settings | ansible.builtin.length) > 0 -%}
      {%-         set __sns.sections = __sns.sections | ansible.builtin.combine({__section_name: __ins.settings}) -%}
      {%-       endif -%}
      {%-     endif -%}
      {%-   endfor -%}
      {#-   "managed" (the application-wide service state applies): always
            for the service-relevant workload types - the documented global
            semantics promise that "running" starts and "disabled" stops
            them even without an Install section. The dependency-only types
            (volume, network, image, build, artifact) start on demand as
            dependencies and are only managed when a unit opts in via
            Install or an explicit per-unit service_state. -#}
      {#-   With declared registry credentials the per-application
            authentication file is injected: REGISTRY_AUTH_FILE covers the
            startup pulls of every generated service, and AutoUpdate=registry
            containers additionally get the io.containers.autoupdate.authfile
            label (podman-auto-update runs independently of the service and
            inspects the running container). Conflicting user-supplied values
            are rejected after this build. -#}
      {%-   if (quadlet_podman_registry_auth | ansible.builtin.length) > 0 -%}
      {%-     set __svc = __sns.sections.get('Service', {}) -%}
      {%-     set __env = __svc.get('Environment', []) -%}
      {%-     set __env = ([__env] if (__env is ansible.builtin.string) else (__env | ansible.builtin.list)) -%}
      {%-     set __svc = __svc | ansible.builtin.combine({'Environment': __env + ['REGISTRY_AUTH_FILE=' ~ __quadlet_podman_authfile_path]}) -%}
      {%-     set __sns.sections = __sns.sections | ansible.builtin.combine({'Service': __svc}) -%}
      {%-     if __type == 'container'
                and ((__sns.sections.get('Container', {}).get('AutoUpdate', '') | ansible.builtin.string) == 'registry') -%}
      {%-       set __cont = __sns.sections['Container'] -%}
      {%-       set __lbl = __cont.get('Label', []) -%}
      {%-       set __lbl = ([__lbl] if (__lbl is ansible.builtin.string) else (__lbl | ansible.builtin.list)) -%}
      {%-       set __cont = __cont | ansible.builtin.combine({'Label': __lbl + ['io.containers.autoupdate.authfile=' ~ __quadlet_podman_authfile_path]}) -%}
      {%-       set __sns.sections = __sns.sections | ansible.builtin.combine({'Container': __cont}) -%}
      {%-     endif -%}
      {%-   endif -%}
      {#-   Quadlet's ServiceName= (in the type section) overrides the
            generated service name; the role's service management, dependency
            expansion and cleanup have to follow it. -#}
      {%-   set __service_override = __sns.sections.get(__type | ansible.builtin.capitalize, {}).get('ServiceName') -%}
      {%-   set _ = __ns.units.append({
              'name': __u['name'],
              'type': __type,
              'filename': __u['name'] ~ '.' ~ __type,
              'service': ((__service_override ~ '.service')
                          if __service_override
                          else (__u['name'] ~ __quadlet_podman_service_suffix_map[__type] ~ '.service')),
              'sections': __sns.sections,
              'has_install': ('Install' in __sns.sections),
              'service_state': __u['service_state'] | ansible.builtin.default(quadlet_podman_service_state),
              'managed': (__type in ['container', 'pod', 'kube'])
                         or ('Install' in __sns.sections)
                         or (__u['service_state'] is ansible.builtin.defined),
            }) -%}
      {%- endfor -%}
      {{ __ns.units }}


# ServiceName= overrides make service-name collisions possible that the
# unit-name uniqueness check above cannot see (two units resolving to the
# same service, an override colliding with a derived name, or a value that
# already carries a .service suffix and would generate name.service.service).
- name: "Init | Check the effective service names for validity and uniqueness"
  ansible.builtin.assert:
    that:
      - >-
        (__quadlet_podman_units_effective | ansible.builtin.map(attribute='service') | ansible.builtin.length)
        ==
        (__quadlet_podman_units_effective | ansible.builtin.map(attribute='service') | ansible.builtin.unique | ansible.builtin.length)
      - >-
        __quadlet_podman_units_effective
        | ansible.builtin.map(attribute='service')
        | ansible.builtin.reject('ansible.builtin.match', '^[A-Za-z0-9_.-]+\.service$')
        | ansible.builtin.length == 0
      - >-
        __quadlet_podman_units_effective
        | ansible.builtin.map(attribute='service')
        | ansible.builtin.select('ansible.builtin.search', '\.service\.service$')
        | ansible.builtin.length == 0
    fail_msg: >-
      Invalid input: the effective systemd service names of quadlet_podman_units
      ({{ __quadlet_podman_units_effective | ansible.builtin.map(attribute='service') | ansible.builtin.join(', ') }})
      must be unique, contain only characters from 'A-Za-z0-9_.-' and a
      ServiceName setting must not itself end in '.service' (the suffix is
      appended automatically).
    quiet: true


# With declared credentials the role owns these two settings; a
# user-supplied value would silently win or lose depending on ordering.
- name: "Init | Check no unit overrides the application authentication file"
  ansible.builtin.assert:
    that:
      - (__quadlet_podman_authfile_conflicts | ansible.builtin.length) == 0
    fail_msg: >-
      The unit(s)
      [{{ __quadlet_podman_authfile_conflicts | ansible.builtin.join(', ') }}]
      set REGISTRY_AUTH_FILE or the io.containers.autoupdate.authfile label
      themselves while quadlet_podman_registry_auth is declared; the role
      injects the application's own authentication file there. Remove the
      conflicting setting (or the registry declaration).
    quiet: true
  vars:
    __quadlet_podman_authfile_conflicts: >-
      {%- set __ns = namespace(names=[]) -%}
      {%- for __u in __quadlet_podman_units_effective -%}
      {%-   set __envs = __u['sections'].get('Service', {}).get('Environment', []) -%}
      {%-   set __envs = ([__envs] if (__envs is ansible.builtin.string) else (__envs | ansible.builtin.list)) -%}
      {%-   set __lbls = __u['sections'].get(__u['type'] | ansible.builtin.capitalize, {}).get('Label', []) -%}
      {%-   set __lbls = ([__lbls] if (__lbls is ansible.builtin.string) else (__lbls | ansible.builtin.list)) -%}
      {%-   if ((__envs | ansible.builtin.select('ansible.builtin.match', 'REGISTRY_AUTH_FILE=') | ansible.builtin.length) > 1)
            or ((__lbls | ansible.builtin.select('ansible.builtin.match', 'io\.containers\.autoupdate\.authfile=') | ansible.builtin.length) > 1) -%}
      {%-     set _ = __ns.names.append(__u['name']) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ __ns.names }}
  when:
    - (quadlet_podman_registry_auth | ansible.builtin.length) > 0


- name: "Init | Build the unit name to generated service name map"
  ansible.builtin.set_fact:
    __quadlet_podman_service_map: >-
      {{
        dict(
          __quadlet_podman_units_effective | ansible.builtin.map(attribute='name')
          | ansible.builtin.zip(__quadlet_podman_units_effective | ansible.builtin.map(attribute='service'))
        )
      }}


- name: "Init | Check the plain systemd unit input for validity"
  ansible.builtin.assert:
    that:
      # unique file names with a supported unit type suffix
      - >-
        (quadlet_podman_systemd_units | ansible.builtin.map(attribute='name') | ansible.builtin.length)
        ==
        (quadlet_podman_systemd_units | ansible.builtin.map(attribute='name') | ansible.builtin.unique | ansible.builtin.length)
      - >-
        quadlet_podman_systemd_units
        | ansible.builtin.map(attribute='name')
        | ansible.builtin.reject('ansible.builtin.match',
            '^[A-Za-z0-9_.-]+\.(' ~ (__quadlet_podman_systemd_unit_suffixes | ansible.builtin.join('|')) ~ ')$')
        | ansible.builtin.length == 0
      # no collision with the application's Quadlet files or their generated
      # services (a plain "foo.service" would shadow the generated service of
      # a "foo" container unit)
      - >-
        quadlet_podman_systemd_units
        | ansible.builtin.map(attribute='name')
        | ansible.builtin.select('ansible.builtin.in',
            (__quadlet_podman_units_effective | ansible.builtin.map(attribute='service') | ansible.builtin.list)
            + (__quadlet_podman_units_effective | ansible.builtin.map(attribute='filename') | ansible.builtin.list))
        | ansible.builtin.length == 0
    fail_msg: >-
      Invalid input: names in quadlet_podman_systemd_units must be unique file
      names matching '^[A-Za-z0-9_.-]+$' with one of these suffixes:
      {{ __quadlet_podman_systemd_unit_suffixes | ansible.builtin.join(', ') }};
      they must not collide with a Quadlet unit file or generated service name
      of quadlet_podman_units.
    quiet: true


- name: "Init | Build the effective plain systemd unit list"
  ansible.builtin.set_fact:
    __quadlet_podman_systemd_units_effective: >-
      {%- set __ns = namespace(units=[]) -%}
      {%- for __u in quadlet_podman_systemd_units -%}
      {%-   set __suffix = __u['name'] | ansible.builtin.splitext | ansible.builtin.last
              | ansible.builtin.regex_replace('^\.', '') -%}
      {%-   set __sns = namespace(sections={}) -%}
      {%-   for __section_name, __section_settings in __u['sections'].items() -%}
      {%-     if __section_settings is not ansible.builtin.none -%}
      {%-       set __ins = namespace(settings={}) -%}
      {%-       for __key, __value in __section_settings.items() -%}
      {%-         if __value is not ansible.builtin.none -%}
      {%-           set __ins.settings = __ins.settings | ansible.builtin.combine({__key: __value}) -%}
      {%-         endif -%}
      {%-       endfor -%}
      {%-       if (__ins.settings | ansible.builtin.length) > 0 -%}
      {%-         set __sns.sections = __sns.sections | ansible.builtin.combine({__section_name: __ins.settings}) -%}
      {%-       endif -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%-   set _ = __ns.units.append({
              'name': __u['name'],
              'suffix': __suffix,
              'main_section': __quadlet_podman_systemd_unit_section_map[__suffix],
              'sections': __sns.sections,
              'has_install': ('Install' in __sns.sections),
              'service_state': __u['service_state'] | ansible.builtin.default(quadlet_podman_service_state),
            }) -%}
      {%- endfor -%}
      {{ __ns.units }}


# "enabled" promises a boot start, which a plain unit can only deliver with
# an Install section; "running" and "disabled" actively disable instead.
- name: "Init | Check enabled plain systemd units carry an Install section"
  ansible.builtin.assert:
    that:
      - >-
        __quadlet_podman_systemd_units_effective
        | ansible.builtin.selectattr('service_state', 'ansible.builtin.equalto', 'enabled')
        | ansible.builtin.rejectattr('has_install')
        | ansible.builtin.length == 0
    fail_msg: >-
      Invalid input: these plain systemd units have service state "enabled"
      but no Install section (so they cannot start at boot):
      {{
        __quadlet_podman_systemd_units_effective
        | ansible.builtin.selectattr('service_state', 'ansible.builtin.equalto', 'enabled')
        | ansible.builtin.rejectattr('has_install')
        | ansible.builtin.map(attribute='name') | ansible.builtin.join(', ')
      }}.
      Add an Install section (e.g. WantedBy) or use "running"/"disabled".
    quiet: true


# Podman's generator requires the Quadlet FILE name including the .pod
# suffix in Pod= (a bare pod name is rejected when the unit is generated).
# Pods of other applications in the same scope are legitimate targets: the
# generator resolves them and creates the service relationship itself, so
# only the syntax is validated here. The role's own start ordering (pods
# before their members) still applies to pods of this application.
- name: "Init | Check that pod memberships use the .pod file name"
  ansible.builtin.assert:
    that:
      # the complete Quadlet FILE NAME syntax: safe characters only, no path
      # separators (a path like '../shared.pod' is not a unit file name)
      - >-
        __quadlet_podman_unit_item['sections']['Container']['Pod']
        is ansible.builtin.match('^[A-Za-z0-9_.-]+\.pod$')
    fail_msg: >-
      The unit '{{ __quadlet_podman_unit_item['name'] }}' references
      Pod '{{ __quadlet_podman_unit_item['sections']['Container']['Pod'] }}':
      Podman requires the plain Quadlet file name including the '.pod'
      suffix (e.g. 'shared.pod'; characters from 'A-Za-z0-9_.-', no path
      separators). Pods of other applications in the same scope may be
      referenced; converge their application first.
    quiet: true
  when:
    - __quadlet_podman_unit_item['type'] == 'container'
    - __quadlet_podman_unit_item['sections']['Container']['Pod'] is ansible.builtin.defined
  loop: "{{ __quadlet_podman_units_effective }}"
  loop_control:
    loop_var: "__quadlet_podman_unit_item"
    label: "{{ __quadlet_podman_unit_item['name'] }}"


- name: "Init | Query the rootless target account"
  ansible.builtin.getent:
    database: "passwd"
    key: "{{ quadlet_podman_user }}"
    fail_key: false
  when:
    - __quadlet_podman_rootless | ansible.builtin.bool


- name: "Init | Store rootless account facts"
  ansible.builtin.set_fact:
    __quadlet_podman_user_exists: >-
      {{
        (not (__quadlet_podman_rootless | ansible.builtin.bool))
        or (ansible_facts['getent_passwd'][quadlet_podman_user] is not ansible.builtin.none)
      }}
    __quadlet_podman_user_uid: >-
      {{
        ansible_facts['getent_passwd'][quadlet_podman_user][1]
        if ((__quadlet_podman_rootless | ansible.builtin.bool)
            and ansible_facts['getent_passwd'][quadlet_podman_user] is not ansible.builtin.none)
        else ''
      }}
    __quadlet_podman_user_gid: >-
      {{
        ansible_facts['getent_passwd'][quadlet_podman_user][2]
        if ((__quadlet_podman_rootless | ansible.builtin.bool)
            and ansible_facts['getent_passwd'][quadlet_podman_user] is not ansible.builtin.none)
        else ''
      }}
    __quadlet_podman_user_home: >-
      {{
        ansible_facts['getent_passwd'][quadlet_podman_user][4]
        if ((__quadlet_podman_rootless | ansible.builtin.bool)
            and ansible_facts['getent_passwd'][quadlet_podman_user] is not ansible.builtin.none)
        else ''
      }}


- name: "Init | Check the rootless prerequisites (account, lingering, user runtime directory)"
  when:
    - quadlet_podman_state == 'present'
    - __quadlet_podman_rootless | ansible.builtin.bool
  block:

    - name: "Init | Check the rootless target account exists"
      ansible.builtin.assert:
        that:
          - __quadlet_podman_user_exists | ansible.builtin.bool
        fail_msg: >-
          The account '{{ quadlet_podman_user }}' (quadlet_podman_user) does not
          exist. This role does not create accounts; create it beforehand (e.g.
          with the foundata.linux.user role) and enable it for rootless Podman
          usage via host_podman_rootless_users of the foundata.podman.host role.
        quiet: true


    - name: "Init | Check lingering status of the rootless target account"
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/{{ quadlet_podman_user }}"
      register: __quadlet_podman_linger_stat


    - name: "Init | Check the user runtime directory of the rootless target account"
      ansible.builtin.stat:
        path: "/run/user/{{ __quadlet_podman_user_uid }}"
      register: __quadlet_podman_runtime_dir_stat


    - name: "Init | Check the rootless prerequisites are met"
      ansible.builtin.assert:
        that:
          - __quadlet_podman_linger_stat['stat']['exists']
          - __quadlet_podman_runtime_dir_stat['stat']['exists']
        fail_msg: >-
          The account '{{ quadlet_podman_user }}' is not ready for rootless Podman
          usage: systemd lingering must be enabled and the user runtime directory
          /run/user/{{ __quadlet_podman_user_uid }} must exist (a lingering user's
          systemd instance provides it). Enable the account via
          host_podman_rootless_users of the foundata.podman.host role first.
        quiet: true


- name: "Init | Check the installed Podman version fits the application"
  when:
    - quadlet_podman_state == 'present'
  block:

    - name: "Init | Check the Podman executable is available"
      ansible.builtin.stat:
        path: "{{ __quadlet_podman_podman_exec_path }}"
      register: __quadlet_podman_exec_stat


    - name: "Init | Check Podman is installed"
      ansible.builtin.assert:
        that:
          - __quadlet_podman_exec_stat['stat']['exists']
        fail_msg: >-
          Podman is not installed ({{ __quadlet_podman_podman_exec_path }} is
          missing). Set up the container environment with the
          foundata.podman.host role before deploying applications.
        quiet: true


    - name: "Init | Determine the installed Podman version"
      ansible.builtin.command:
        argv:
          - "{{ __quadlet_podman_podman_exec_path }}"
          - "--version"
      register: __quadlet_podman_version_result
      changed_when: false
      # The probe is read-only; run it under "--check" too, otherwise it is
      # skipped and the next task fails on the missing stdout.
      check_mode: false


    - name: "Init | Store the installed Podman version as fact"
      ansible.builtin.set_fact:
        __quadlet_podman_version: >-
          {{
            __quadlet_podman_version_result['stdout']
            | ansible.builtin.regex_search('[0-9]+\.[0-9]+(\.[0-9]+)?')
          }}


    - name: "Init | Check Podman version requirements and fail if unmet"
      ansible.builtin.assert:
        that:
          - __quadlet_podman_version is ansible.builtin.version(__quadlet_podman_min_podman_version, '>=')
          - >-
            (quadlet_podman_min_podman_version is not ansible.builtin.defined)
            or (__quadlet_podman_version is ansible.builtin.version(quadlet_podman_min_podman_version, '>='))
          - >-
            ((__quadlet_podman_units_effective | ansible.builtin.selectattr('type', 'ansible.builtin.eq', 'artifact') | ansible.builtin.length) == 0)
            or (__quadlet_podman_version is ansible.builtin.version(__quadlet_podman_artifact_min_podman_version, '>='))
        fail_msg: >-
          Podman {{ __quadlet_podman_version }} is too old for this application:
          the role requires at least {{ __quadlet_podman_min_podman_version }},
          quadlet_podman_min_podman_version requires
          {{ quadlet_podman_min_podman_version | ansible.builtin.default('(unset)') }}
          and "artifact" units require at least
          {{ __quadlet_podman_artifact_min_podman_version }}.
        quiet: true


### Collisions with units the role does not own
#
# Quadlet output lands in the systemd generator directory, which loses
# against /etc/systemd/system (resp. ~/.config/systemd/user) and wins against
# /usr/lib/systemd/system. A native unit file with the name of a generated
# service therefore either shadows the container silently (the role would
# then start, stop and restart a completely unrelated service) or gets
# shadowed by it. Both are rejected here, BEFORE any unit file is written.
#
# Two probes are needed: systemctl reports what is effective right now
# (including transient, linked and masked units, which no directory listing
# shows), while the search-path scan also finds files that lose against the
# generator output and would be shadowed without a trace.

- name: "Init | Check for foreign systemd units colliding with the generated service names"
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
    - (__quadlet_podman_units_effective | ansible.builtin.length) > 0
  block:

    - name: "Init | Query the effective systemd unit of every generated service name"
      ansible.builtin.command:
        argv: >-
          {{
            [__quadlet_podman_systemctl_exec_path]
            + (['--user'] if (__quadlet_podman_rootless | ansible.builtin.bool) else [])
            + ['show', '--property=LoadState', '--property=FragmentPath', '--property=SourcePath',
               '--', __quadlet_podman_collision_service_item]
          }}
      become: true
      become_user: "{{ __quadlet_podman_become_user }}"
      environment: "{{ __quadlet_podman_task_environment }}"
      changed_when: false
      # read-only; under "--check" the following assert would dereference a
      # missing result otherwise
      check_mode: false
      loop: "{{ __quadlet_podman_units_effective | ansible.builtin.map(attribute='service') | ansible.builtin.list }}"
      loop_control:
        loop_var: "__quadlet_podman_collision_service_item"
      register: __quadlet_podman_collision_show_result


    - name: "Init | Determine the systemd unit search path of the scope"
      ansible.builtin.command:
        argv: >-
          {{
            [__quadlet_podman_systemd_analyze_exec_path]
            + (['--user'] if (__quadlet_podman_rootless | ansible.builtin.bool) else [])
            + ['unit-paths']
          }}
      become: true
      become_user: "{{ __quadlet_podman_become_user }}"
      environment: "{{ __quadlet_podman_task_environment }}"
      changed_when: false
      check_mode: false
      # older systemd releases without "unit-paths": the systemctl probe above
      # still covers everything that is effective
      failed_when: false
      register: __quadlet_podman_collision_paths_result


    - name: "Init | Search the unit search path for files named like a generated service"
      ansible.builtin.find:
        paths: "{{ __quadlet_podman_collision_search_paths }}"
        patterns: "{{ __quadlet_podman_units_effective | ansible.builtin.map(attribute='service') | ansible.builtin.list }}"
        file_type: "any"
      vars:
        # generator output is the role's own result, never a collision
        __quadlet_podman_collision_search_paths: >-
          {{
            (__quadlet_podman_collision_paths_result['stdout_lines'] | ansible.builtin.default([]))
            | ansible.builtin.map('ansible.builtin.trim')
            | ansible.builtin.reject('ansible.builtin.equalto', '')
            | ansible.builtin.reject('ansible.builtin.search', '/systemd/generator')
            | ansible.builtin.list
          }}
      when:
        - (__quadlet_podman_collision_paths_result['rc'] | ansible.builtin.default(1)) == 0
      register: __quadlet_podman_collision_find_result


    - name: "Init | Check no foreign unit collides with a generated service name"
      ansible.builtin.assert:
        that:
          - (__quadlet_podman_collision_violations | ansible.builtin.length) == 0
        fail_msg: >-
          Refusing to manage this application:
          {{ __quadlet_podman_collision_violations | ansible.builtin.join('; ') }}.
          Choose another unit name or set ServiceName in the affected unit.
        quiet: true
      vars:
        # unit files of THIS application: their generator output is expected
        __quadlet_podman_collision_own_sources: >-
          {{
            ((__quadlet_podman_units_effective | ansible.builtin.map(attribute='filename') | ansible.builtin.list)
             + ((__quadlet_podman_manifest_old | ansible.builtin.default({}, true))['units']
                | ansible.builtin.default([])))
            | ansible.builtin.unique
            | ansible.builtin.map('ansible.builtin.regex_replace', '^', __quadlet_podman_unit_dir_path ~ '/')
            | ansible.builtin.list
          }}
        __quadlet_podman_collision_violations: >-
          {%- set __ns = namespace(rows=[]) -%}
          {%- for __r in (__quadlet_podman_collision_show_result['results'] | ansible.builtin.default([])) -%}
          {%-   set __props = {} -%}
          {%-   for __line in (__r['stdout_lines'] | ansible.builtin.default([])) -%}
          {%-     set __props = __props | ansible.builtin.combine(
                    {(__line.split('=', 1)[0]): (__line.split('=', 1)[1:] | ansible.builtin.first | ansible.builtin.default(''))}) -%}
          {%-   endfor -%}
          {%-   set __service = __r['__quadlet_podman_collision_service_item'] -%}
          {%-   set __load = __props.get('LoadState', 'not-found') -%}
          {%-   set __fragment = __props.get('FragmentPath', '') -%}
          {%-   set __source = __props.get('SourcePath', '') -%}
          {%-   if __load != 'not-found' -%}
          {%-     if not (__fragment is ansible.builtin.search('/systemd/generator')) -%}
          {%-       set __origin = ('a masked unit' if (__fragment == '/dev/null')
                      else (__fragment if (__fragment | ansible.builtin.length) > 0
                            else ('a ' ~ __load ~ ' unit'))) -%}
          {%-       set _ = __ns.rows.append(
                      'the generated service name ' ~ __service ~ ' conflicts with ' ~ __origin) -%}
          {%-     elif (__source | ansible.builtin.length) > 0
                    and (__source not in __quadlet_podman_collision_own_sources) -%}
          {%-       set _ = __ns.rows.append(
                      'the generated service name ' ~ __service
                      ~ ' is already generated from the foreign Quadlet ' ~ __source) -%}
          {%-     endif -%}
          {%-   endif -%}
          {%- endfor -%}
          {#- files that would be shadowed BY the generator output -#}
          {%- for __f in (__quadlet_podman_collision_find_result['files'] | ansible.builtin.default([])) -%}
          {%-   set _ = __ns.rows.append(
                  'the generated service name ' ~ (__f['path'] | ansible.builtin.basename)
                  ~ ' would shadow the existing unit ' ~ __f['path']) -%}
          {%- endfor -%}
          {{ __ns.rows | ansible.builtin.unique }}
