# Uninstall: Manage basic resource removal, such as packages or service users.

---

# Removes the application: its services get stopped, the Quadlet unit files
# and plain systemd units (identified by the application marker, so this works
# even when the unit lists changed since deployment), secrets and managed
# files get removed and its registry logins are logged out again. Secrets, files
# and logins are taken from the union of the application manifest (see
# vars/main.yml) and the currently declared lists, so resources renamed since
# deployment are removed as well. Host directories
# (quadlet_podman_directories) and named volumes are deliberately KEPT to
# protect persistent application data.

- name: "Setup | Uninstall | Notify about a missing rootless account"
  ansible.builtin.debug:
    msg: >-
      The account '{{ quadlet_podman_user }}' (quadlet_podman_user) does not
      exist (anymore); the account-dependent removals (service stops, secret
      and registry-login removal) are skipped. The root-side cleanup still
      runs: manifest, manifest-recorded files and the application's unit
      files in the recorded (possibly preserved) directories. Podman secrets
      and container storage inside a preserved home cannot be removed
      selectively without the account; remove the home directory itself if
      nothing in it is needed anymore.
  when:
    - __quadlet_podman_rootless | ansible.builtin.bool
    - not (__quadlet_podman_user_exists | ansible.builtin.bool)


- name: "Setup | Uninstall | Read the application manifest (previously created resources)"
  ansible.builtin.slurp:
    src: "{{ __quadlet_podman_manifest_file_path }}"
  register: __quadlet_podman_manifest_slurp
  failed_when:
    # tolerate a missing manifest (pre-manifest deployment or removed by
    # hand; the currently declared lists still get cleaned up below)
    - __quadlet_podman_manifest_slurp['msg'] is ansible.builtin.defined
    - "'file not found' not in (__quadlet_podman_manifest_slurp['msg'] | ansible.builtin.lower)"


- name: "Setup | Uninstall | Determine the previously created resources of the application"
  ansible.builtin.set_fact:
    __quadlet_podman_manifest_old: >-
      {{
        (__quadlet_podman_manifest_slurp['content'] | ansible.builtin.default('')
         | ansible.builtin.b64decode | ansible.builtin.from_yaml)
        | ansible.builtin.default({}, true)
      }}


# The manifests of the other applications are read BEFORE anything is
# removed: legacy duplicate ownership records (from role versions without the
# exclusivity check) must protect a resource another application still
# claims, and the registry logout below needs them as well. Root-side, so no
# account is required.
- name: "Setup | Uninstall | Find the manifests of the other applications in this scope"
  ansible.builtin.find:
    paths: "{{ __quadlet_podman_manifest_dir_path }}"
    patterns:
      - "*.ansible-manifest"
    file_type: "file"
  register: __quadlet_podman_manifest_find


- name: "Setup | Uninstall | Read the manifests of the other applications in this scope"
  ansible.builtin.slurp:
    src: "{{ __quadlet_podman_other_manifest_item }}"
  register: __quadlet_podman_other_manifests_slurp
  loop: >-
    {{
      __quadlet_podman_manifest_find['files']
      | ansible.builtin.map(attribute='path')
      | ansible.builtin.reject('ansible.builtin.eq', __quadlet_podman_manifest_file_path)
      | ansible.builtin.list
    }}
  loop_control:
    loop_var: "__quadlet_podman_other_manifest_item"
    label: "{{ __quadlet_podman_other_manifest_item }}"


- name: "Setup | Uninstall | Determine the resources claimed by the other applications"
  ansible.builtin.set_fact:
    __quadlet_podman_other_claims_now: >-
      {%- set __ns = namespace(secrets=[], files=[]) -%}
      {%- for __result in (__quadlet_podman_other_manifests_slurp['results'] | ansible.builtin.default([])) -%}
      {%-   set __manifest = ((__result['content'] | ansible.builtin.default('') | ansible.builtin.b64decode
                               | ansible.builtin.from_yaml) | ansible.builtin.default({}, true)) -%}
      {%-   set __ns.secrets = __ns.secrets + (__manifest['secrets'] | ansible.builtin.default([])) -%}
      {%-   set __ns.files = __ns.files + (__manifest['files'] | ansible.builtin.default([])) -%}
      {%- endfor -%}
      {{ {'secrets': __ns.secrets, 'files': __ns.files} }}


# Account-dependent removals: everything below needs the service account (its
# systemd user instance, its Podman storage or its home directory) and is
# skipped when the account is gone. The root-side cleanup after this block
# runs either way.
- name: "Setup | Uninstall | Remove the application (account-dependent parts)"
  when:
    - __quadlet_podman_user_exists | ansible.builtin.bool
  block:

    ### Plain systemd units first: timers get stopped before the services
    ### they would trigger. Marker-identified like the Quadlet files, so this
    ### works even when quadlet_podman_systemd_units changed since deployment.

    - name: "Setup | Uninstall | Find plain systemd unit files in the systemd unit directory"
      ansible.builtin.find:
        paths:
          - "{{ __quadlet_podman_systemd_unit_dir_path }}"
        patterns: "{{ __quadlet_podman_systemd_unit_suffixes | ansible.builtin.map('ansible.builtin.regex_replace', '^', '*.') | ansible.builtin.list }}"
        file_type: "file"
      register: __quadlet_podman_systemd_find_result


    - name: "Setup | Uninstall | Determine the plain systemd unit files of the application"
      ansible.builtin.command:
        argv: >-
          {{
            [__quadlet_podman_grep_exec_path, '-l', '-s', '-x', '-F', '--', __quadlet_podman_file_marker]
            + (__quadlet_podman_systemd_find_result['files'] | ansible.builtin.map(attribute='path') | ansible.builtin.list)
          }}
      register: __quadlet_podman_systemd_owned_result
      changed_when: false
      # read-only probe; run it under "--check" too so check mode reports the
      # removals instead of silently skipping them
      check_mode: false
      failed_when:
        - __quadlet_podman_systemd_owned_result['rc'] not in [0, 1, 2]
      when:
        - (__quadlet_podman_systemd_find_result['files'] | ansible.builtin.length) > 0


    - name: "Setup | Uninstall | Stop the plain systemd units of the application"
      ansible.builtin.systemd_service:
        name: "{{ __quadlet_podman_owned_path_item | ansible.builtin.basename }}"
        state: "stopped"
        scope: "{{ __quadlet_podman_systemd_scope }}"
      become: true
      become_user: "{{ __quadlet_podman_become_user }}"
      environment: "{{ __quadlet_podman_task_environment }}"
      # tolerate units that are not loaded (unit was never started)
      failed_when: false
      when:
        - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
      loop: "{{ __quadlet_podman_systemd_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__quadlet_podman_owned_path_item"
        label: "{{ __quadlet_podman_owned_path_item }}"


    # Disabling removes the enablement symlinks (e.g. in timers.target.wants/)
    # that would otherwise dangle after the unit file removal below. The
    # command module is used intentionally: ansible.builtin.systemd_service
    # fails on units without an Install section, this cleanup must tolerate
    # them.
    - name: "Setup | Uninstall | Disable the plain systemd units of the application"
      ansible.builtin.command:
        argv: >-
          {{
            [__quadlet_podman_systemctl_exec_path]
            + (['--user'] if (__quadlet_podman_rootless | ansible.builtin.bool) else [])
            + ['disable', __quadlet_podman_owned_path_item | ansible.builtin.basename]
          }}
      become: true
      become_user: "{{ __quadlet_podman_become_user }}"
      environment: "{{ __quadlet_podman_task_environment }}"
      changed_when: false
      # tolerate units systemd does not know or without an Install section
      failed_when: false
      when:
        - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
      loop: "{{ __quadlet_podman_systemd_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__quadlet_podman_owned_path_item"
        label: "{{ __quadlet_podman_owned_path_item }}"


    # Clear a possible "failed" state so the unit does not stay pinned in
    # systemd after its file is removed and the daemon reloaded.
    - name: "Setup | Uninstall | Clear the failed state of the plain systemd units"
      ansible.builtin.command:
        argv: >-
          {{
            [__quadlet_podman_systemctl_exec_path]
            + (['--user'] if (__quadlet_podman_rootless | ansible.builtin.bool) else [])
            + ['reset-failed', __quadlet_podman_owned_path_item | ansible.builtin.basename]
          }}
      become: true
      become_user: "{{ __quadlet_podman_become_user }}"
      environment: "{{ __quadlet_podman_task_environment }}"
      changed_when: false
      # tolerate units systemd does not know (unit was never started)
      failed_when: false
      when:
        - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
      loop: "{{ __quadlet_podman_systemd_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__quadlet_podman_owned_path_item"
        label: "{{ __quadlet_podman_owned_path_item }}"


    - name: "Setup | Uninstall | Remove the plain systemd unit files of the application"
      ansible.builtin.file:
        path: "{{ __quadlet_podman_owned_path_item }}"
        state: "absent"
      loop: "{{ __quadlet_podman_systemd_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__quadlet_podman_owned_path_item"
        label: "{{ __quadlet_podman_owned_path_item }}"
      notify:
        - "quadlet_podman: systemd daemon-reload"


    ### Quadlet units

    - name: "Setup | Uninstall | Find Quadlet unit files in the unit directory"
      ansible.builtin.find:
        paths:
          - "{{ __quadlet_podman_unit_dir_path }}"
        patterns: "{{ __quadlet_podman_unit_extensions | ansible.builtin.map('ansible.builtin.regex_replace', '^', '*.') | ansible.builtin.list }}"
        file_type: "file"
      register: __quadlet_podman_find_result


    - name: "Setup | Uninstall | Determine the unit files of the application"
      ansible.builtin.command:
        argv: >-
          {{
            [__quadlet_podman_grep_exec_path, '-l', '-s', '-x', '-F', '--', __quadlet_podman_file_marker]
            + (__quadlet_podman_find_result['files'] | ansible.builtin.map(attribute='path') | ansible.builtin.list)
          }}
      register: __quadlet_podman_owned_result
      changed_when: false
      # read-only probe; run it under "--check" too so check mode reports the
      # removals instead of silently skipping them
      check_mode: false
      failed_when:
        - __quadlet_podman_owned_result['rc'] not in [0, 1, 2]
      when:
        - (__quadlet_podman_find_result['files'] | ansible.builtin.length) > 0


    # The generated service name normally derives from the unit file name,
    # but a ServiceName= setting inside the file overrides it. The files
    # still exist at this point, so they are the authoritative source.
    - name: "Setup | Uninstall | Read the unit files of the application (service name resolution)"
      ansible.builtin.slurp:
        src: "{{ __quadlet_podman_owned_path_item }}"
      register: __quadlet_podman_owned_slurp
      loop: "{{ __quadlet_podman_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__quadlet_podman_owned_path_item"
        label: "{{ __quadlet_podman_owned_path_item }}"


    - name: "Setup | Uninstall | Map the unit files to their generated service names"
      ansible.builtin.set_fact:
        __quadlet_podman_owned_service_map: >-
          {%- set __ns = namespace(map={}) -%}
          {%- for __r in (__quadlet_podman_owned_slurp['results'] | ansible.builtin.default([])) -%}
          {%-   set __path = __r['__quadlet_podman_owned_path_item'] -%}
          {%-   set __stem = __path | ansible.builtin.basename | ansible.builtin.splitext | ansible.builtin.first -%}
          {%-   set __ext = __path | ansible.builtin.basename | ansible.builtin.splitext | ansible.builtin.last | ansible.builtin.regex_replace('^\.', '') -%}
          {#-   no capture-group argument on purpose: '\1' as a Jinja string
                literal is an octal escape (control character), which
                regex_search rejects as "Unknown argument" -#}
          {%-   set __line = (__r['content'] | ansible.builtin.default('') | ansible.builtin.b64decode)
                             | ansible.builtin.regex_search('(?m)^\s*ServiceName\s*=\s*\S+\s*$') -%}
          {%-   set __override = (__line.split('=', 1) | ansible.builtin.last | ansible.builtin.trim) if __line else '' -%}
          {%-   set __service = (__override ~ '.service')
                                if ((__override | ansible.builtin.length) > 0)
                                else (__stem ~ (__quadlet_podman_service_suffix_map[__ext] | ansible.builtin.default('')) ~ '.service') -%}
          {%-   set _ = __ns.map.update({__path: __service}) -%}
          {%- endfor -%}
          {{ __ns.map }}


    # Stop order: member containers and other units first, pods last (stopping
    # a pod also stops its members, but this keeps the shutdown graceful).
    - name: "Setup | Uninstall | Stop the services of the application"
      ansible.builtin.systemd_service:
        name: "{{ __quadlet_podman_owned_service }}"
        state: "stopped"
        scope: "{{ __quadlet_podman_systemd_scope }}"
      become: true
      become_user: "{{ __quadlet_podman_become_user }}"
      environment: "{{ __quadlet_podman_task_environment }}"
      vars:
        __quadlet_podman_owned_service: "{{ __quadlet_podman_owned_service_map[__quadlet_podman_owned_path_item] }}"
      # tolerate services that are not loaded (unit was never started or the
      # generator rejected it)
      failed_when: false
      when:
        - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
      loop: >-
        {{
          (__quadlet_podman_owned_result['stdout_lines'] | ansible.builtin.default([])
           | ansible.builtin.reject('ansible.builtin.search', '\.pod$') | ansible.builtin.list)
          + (__quadlet_podman_owned_result['stdout_lines'] | ansible.builtin.default([])
             | ansible.builtin.select('ansible.builtin.search', '\.pod$') | ansible.builtin.list)
        }}
      loop_control:
        loop_var: "__quadlet_podman_owned_path_item"
        label: "{{ __quadlet_podman_owned_path_item }}"


    # Clear a possible "failed" state so the unit does not stay pinned in
    # systemd after its file is removed and the daemon reloaded.
    - name: "Setup | Uninstall | Clear the failed state of the services"
      ansible.builtin.command:
        argv: >-
          {{
            [__quadlet_podman_systemctl_exec_path]
            + (['--user'] if (__quadlet_podman_rootless | ansible.builtin.bool) else [])
            + ['reset-failed', __quadlet_podman_owned_service]
          }}
      become: true
      become_user: "{{ __quadlet_podman_become_user }}"
      environment: "{{ __quadlet_podman_task_environment }}"
      vars:
        __quadlet_podman_owned_service: "{{ __quadlet_podman_owned_service_map[__quadlet_podman_owned_path_item] }}"
      changed_when: false
      # tolerate services systemd does not know (unit was never started)
      failed_when: false
      when:
        - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
      loop: "{{ __quadlet_podman_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__quadlet_podman_owned_path_item"
        label: "{{ __quadlet_podman_owned_path_item }}"


    - name: "Setup | Uninstall | Remove the unit files of the application"
      ansible.builtin.file:
        path: "{{ __quadlet_podman_owned_path_item }}"
        state: "absent"
      loop: "{{ __quadlet_podman_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__quadlet_podman_owned_path_item"
        label: "{{ __quadlet_podman_owned_path_item }}"
      notify:
        - "quadlet_podman: systemd daemon-reload"


    - name: "Setup | Uninstall | Apply pending systemd changes"
      ansible.builtin.meta: "flush_handlers"


    - name: "Setup | Uninstall | Check the Podman executable is available"
      ansible.builtin.stat:
        path: "{{ __quadlet_podman_podman_exec_path }}"
      register: __quadlet_podman_exec_stat


    # Only secret names are handled here, no secret values are involved. A
    # name another application's current manifest still claims (a legacy
    # duplicate ownership record) is left for that application.
    - name: "Setup | Uninstall | Remove the Podman secrets of the application"
      containers.podman.podman_secret:
        name: "{{ __quadlet_podman_secret_name_item }}"
        state: "absent"
        executable: "{{ __quadlet_podman_podman_exec_path }}"
      become: true
      become_user: "{{ __quadlet_podman_become_user }}"
      environment: "{{ __quadlet_podman_task_environment }}"
      when:
        - __quadlet_podman_exec_stat['stat']['exists']
      loop: >-
        {{
          ((__quadlet_podman_manifest_old['secrets'] | ansible.builtin.default([]))
           + __quadlet_podman_secret_names_declared)
          | ansible.builtin.unique
          | ansible.builtin.reject('ansible.builtin.in', __quadlet_podman_other_claims_now['secrets'])
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__quadlet_podman_secret_name_item"


    # The application's own authentication file is removed as a whole;
    # credential isolation makes cross-application guards unnecessary.
    # Legacy logins in a scope-shared auth.json are deliberately not touched
    # (see vars/main.yml).
    - name: "Setup | Uninstall | Remove the authentication file of the application"
      ansible.builtin.file:
        path: "{{ __quadlet_podman_authfile_path }}"
        state: "absent"


# Root-side unit file cleanup for a vanished rootless account: the unit
# directories derive from the account's home, so they come from the manifest
# here. Plain file operations need no user context; only marker-owned files
# are touched. The (dead) user services cannot be stopped without the
# account; a lingering user manager ends at the latest with the next reboot.
- name: "Setup | Uninstall | Remove the unit files of the application (account already removed)"
  when:
    - __quadlet_podman_rootless | ansible.builtin.bool
    - not (__quadlet_podman_user_exists | ansible.builtin.bool)
    - (__quadlet_podman_manifest_old['unit_dirs'] | ansible.builtin.default([]) | ansible.builtin.length) > 0
  block:

    - name: "Setup | Uninstall | Find unit files in the recorded unit directories"
      ansible.builtin.find:
        paths: "{{ __quadlet_podman_manifest_old['unit_dirs'] }}"
        patterns: >-
          {{
            (__quadlet_podman_unit_extensions + __quadlet_podman_systemd_unit_suffixes)
            | ansible.builtin.unique
            | ansible.builtin.map('ansible.builtin.regex_replace', '^', '*.')
            | ansible.builtin.list
          }}
        file_type: "file"
      register: __quadlet_podman_orphan_find_result


    - name: "Setup | Uninstall | Determine the orphaned unit files of the application"
      ansible.builtin.command:
        argv: >-
          {{
            [__quadlet_podman_grep_exec_path, '-l', '-s', '-x', '-F', '--', __quadlet_podman_file_marker]
            + (__quadlet_podman_orphan_find_result['files'] | ansible.builtin.map(attribute='path') | ansible.builtin.list)
          }}
      register: __quadlet_podman_orphan_owned_result
      changed_when: false
      # read-only probe; run it under "--check" too so check mode reports the
      # removals instead of silently skipping them
      check_mode: false
      failed_when:
        - __quadlet_podman_orphan_owned_result['rc'] not in [0, 1, 2]
      when:
        - (__quadlet_podman_orphan_find_result['files'] | ansible.builtin.length) > 0


    - name: "Setup | Uninstall | Remove the recorded authentication file (account already removed)"
      ansible.builtin.file:
        path: "{{ __quadlet_podman_manifest_old['authfile'] }}"
        state: "absent"
      when:
        - __quadlet_podman_manifest_old['authfile'] is ansible.builtin.defined


    - name: "Setup | Uninstall | Remove the orphaned unit files of the application"
      ansible.builtin.file:
        path: "{{ __quadlet_podman_orphan_path_item }}"
        state: "absent"
      loop: "{{ __quadlet_podman_orphan_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__quadlet_podman_orphan_path_item"
        label: "{{ __quadlet_podman_orphan_path_item }}"


- name: "Setup | Uninstall | Remove the managed files of the application"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_file_dest_item }}"
    state: "absent"
  loop: >-
    {{
      ((__quadlet_podman_manifest_old['files'] | ansible.builtin.default([]))
       + (quadlet_podman_files | ansible.builtin.map(attribute='dest') | ansible.builtin.list))
      | ansible.builtin.unique
      | ansible.builtin.reject('ansible.builtin.in', __quadlet_podman_other_claims_now['files'])
      | ansible.builtin.list
    }}
  loop_control:
    loop_var: "__quadlet_podman_file_dest_item"


- name: "Setup | Uninstall | Remove the application manifest"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_manifest_file_path }}"
    state: "absent"


- name: "Setup | Uninstall | Remove packages"
  ansible.builtin.package:
    name: "{{ __quadlet_podman_packages_uninstall }}"
    state: "absent"
  when:
    - __quadlet_podman_packages_uninstall is ansible.builtin.defined
    - (__quadlet_podman_packages_uninstall | ansible.builtin.length) > 0
