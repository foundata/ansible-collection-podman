# Uninstall: Manage basic resource removal, such as packages or service users.

---

# Removes the application: its services get stopped, the Quadlet unit files
# (identified by the application marker, so this works even when
# quadlet_podman_units changed since deployment), secrets and managed files
# get removed and its registry logins are logged out again. Secrets, files
# and logins are taken from the union of the application manifest (see
# vars/main.yml) and the currently declared lists, so resources renamed since
# deployment are removed as well. Host directories
# (quadlet_podman_directories) and named volumes are deliberately KEPT to
# protect persistent application data.

- name: "Setup | Uninstall | Notify about a missing rootless account"
  ansible.builtin.debug:
    msg: >-
      The account '{{ quadlet_podman_user }}' (quadlet_podman_user) does not
      exist (anymore); the account-dependent removals (services, unit files,
      secrets, registry logins) are skipped, the root-side cleanup (manifest,
      manifest-recorded files) still runs.
  when:
    - __quadlet_podman_rootless | ansible.builtin.bool
    - not (__quadlet_podman_user_exists | ansible.builtin.bool)


- name: "Setup | Uninstall | Read the application manifest (previously created resources)"
  ansible.builtin.slurp:
    src: "{{ __quadlet_podman_manifest_file_path }}"
  register: __quadlet_podman_manifest_slurp
  failed_when:
    # tolerate a missing manifest (pre-manifest deployment or removed by
    # hand; the currently declared lists still get cleaned up below)
    - __quadlet_podman_manifest_slurp['msg'] is ansible.builtin.defined
    - "'file not found' not in (__quadlet_podman_manifest_slurp['msg'] | ansible.builtin.lower)"


- name: "Setup | Uninstall | Determine the previously created resources of the application"
  ansible.builtin.set_fact:
    __quadlet_podman_manifest_old: >-
      {{
        (__quadlet_podman_manifest_slurp['content'] | ansible.builtin.default('')
         | ansible.builtin.b64decode | ansible.builtin.from_yaml)
        | ansible.builtin.default({}, true)
      }}


# Account-dependent removals: everything below needs the service account (its
# systemd user instance, its Podman storage or its home directory) and is
# skipped when the account is gone. The root-side cleanup after this block
# runs either way.
- name: "Setup | Uninstall | Remove the application (account-dependent parts)"
  when:
    - __quadlet_podman_user_exists | ansible.builtin.bool
  block:

    - name: "Setup | Uninstall | Find Quadlet unit files in the unit directory"
      ansible.builtin.find:
        paths:
          - "{{ __quadlet_podman_unit_dir_path }}"
        patterns: "{{ __quadlet_podman_unit_extensions | ansible.builtin.map('ansible.builtin.regex_replace', '^', '*.') | ansible.builtin.list }}"
        file_type: "file"
      register: __quadlet_podman_find_result


    - name: "Setup | Uninstall | Determine the unit files of the application"
      ansible.builtin.command:
        argv: >-
          {{
            [__quadlet_podman_grep_exec_path, '-l', '-s', '-x', '-F', '--', __quadlet_podman_file_marker]
            + (__quadlet_podman_find_result['files'] | ansible.builtin.map(attribute='path') | ansible.builtin.list)
          }}
      register: __quadlet_podman_owned_result
      changed_when: false
      # read-only probe; run it under "--check" too so check mode reports the
      # removals instead of silently skipping them
      check_mode: false
      failed_when:
        - __quadlet_podman_owned_result['rc'] not in [0, 1, 2]
      when:
        - (__quadlet_podman_find_result['files'] | ansible.builtin.length) > 0


    # Stop order: member containers and other units first, pods last (stopping
    # a pod also stops its members, but this keeps the shutdown graceful).
    - name: "Setup | Uninstall | Stop the services of the application"
      ansible.builtin.systemd_service:
        name: "{{ __quadlet_podman_owned_service }}"
        state: "stopped"
        scope: "{{ __quadlet_podman_systemd_scope }}"
      become: true
      become_user: "{{ __quadlet_podman_become_user }}"
      environment: "{{ __quadlet_podman_task_environment }}"
      vars:
        __quadlet_podman_owned_stem: "{{ __quadlet_podman_owned_path | ansible.builtin.basename | ansible.builtin.splitext | ansible.builtin.first }}"
        __quadlet_podman_owned_ext: >-
          {{
            __quadlet_podman_owned_path
            | ansible.builtin.basename
            | ansible.builtin.splitext
            | ansible.builtin.last
            | ansible.builtin.regex_replace('^\.', '')
          }}
        __quadlet_podman_owned_service: "{{ __quadlet_podman_owned_stem }}{{ __quadlet_podman_service_suffix_map[__quadlet_podman_owned_ext] }}.service"
      # tolerate services that are not loaded (unit was never started or the
      # generator rejected it)
      failed_when: false
      when:
        - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
      loop: >-
        {{
          (__quadlet_podman_owned_result['stdout_lines'] | ansible.builtin.default([])
           | ansible.builtin.reject('ansible.builtin.search', '\.pod$') | ansible.builtin.list)
          + (__quadlet_podman_owned_result['stdout_lines'] | ansible.builtin.default([])
             | ansible.builtin.select('ansible.builtin.search', '\.pod$') | ansible.builtin.list)
        }}
      loop_control:
        loop_var: "__quadlet_podman_owned_path"
        label: "{{ __quadlet_podman_owned_path }}"


    # Clear a possible "failed" state so the unit does not stay pinned in
    # systemd after its file is removed and the daemon reloaded.
    - name: "Setup | Uninstall | Clear the failed state of the services"
      ansible.builtin.command:
        argv: >-
          {{
            [__quadlet_podman_systemctl_exec_path]
            + (['--user'] if (__quadlet_podman_rootless | ansible.builtin.bool) else [])
            + ['reset-failed', __quadlet_podman_owned_service]
          }}
      become: true
      become_user: "{{ __quadlet_podman_become_user }}"
      environment: "{{ __quadlet_podman_task_environment }}"
      vars:
        __quadlet_podman_owned_stem: "{{ __quadlet_podman_owned_path | ansible.builtin.basename | ansible.builtin.splitext | ansible.builtin.first }}"
        __quadlet_podman_owned_ext: >-
          {{
            __quadlet_podman_owned_path
            | ansible.builtin.basename
            | ansible.builtin.splitext
            | ansible.builtin.last
            | ansible.builtin.regex_replace('^\.', '')
          }}
        __quadlet_podman_owned_service: "{{ __quadlet_podman_owned_stem }}{{ __quadlet_podman_service_suffix_map[__quadlet_podman_owned_ext] }}.service"
      changed_when: false
      # tolerate services systemd does not know (unit was never started)
      failed_when: false
      when:
        - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
      loop: "{{ __quadlet_podman_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__quadlet_podman_owned_path"
        label: "{{ __quadlet_podman_owned_path }}"


    - name: "Setup | Uninstall | Remove the unit files of the application"
      ansible.builtin.file:
        path: "{{ __quadlet_podman_owned_path }}"
        state: "absent"
      loop: "{{ __quadlet_podman_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
      loop_control:
        loop_var: "__quadlet_podman_owned_path"
        label: "{{ __quadlet_podman_owned_path }}"
      notify:
        - "quadlet_podman: systemd daemon-reload"


    - name: "Setup | Uninstall | Apply pending systemd changes"
      ansible.builtin.meta: "flush_handlers"


    - name: "Setup | Uninstall | Check the Podman executable is available"
      ansible.builtin.stat:
        path: "{{ __quadlet_podman_podman_exec_path }}"
      register: __quadlet_podman_exec_stat


    # Only secret names are handled here, no secret values are involved.
    - name: "Setup | Uninstall | Remove the Podman secrets of the application"
      containers.podman.podman_secret:
        name: "{{ __quadlet_podman_secret_name }}"
        state: "absent"
        executable: "{{ __quadlet_podman_podman_exec_path }}"
      become: true
      become_user: "{{ __quadlet_podman_become_user }}"
      environment: "{{ __quadlet_podman_task_environment }}"
      when:
        - __quadlet_podman_exec_stat['stat']['exists']
      loop: >-
        {{
          ((__quadlet_podman_manifest_old['secrets'] | ansible.builtin.default([]))
           + __quadlet_podman_secret_names_declared)
          | ansible.builtin.unique
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__quadlet_podman_secret_name"


    # All applications of a scope share one authfile, so a logout for this
    # application would also cut off every other application still using the
    # same registry (until its next run re-creates the login). The manifests
    # of the other applications in this scope therefore decide which
    # registries are actually safe to log out of.
    - name: "Setup | Uninstall | Find the manifests of the other applications in this scope"
      ansible.builtin.find:
        paths: "{{ __quadlet_podman_manifest_dir_path }}"
        patterns:
          - "*.ansible-manifest"
        file_type: "file"
      register: __quadlet_podman_manifest_find


    - name: "Setup | Uninstall | Read the manifests of the other applications in this scope"
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: __quadlet_podman_other_manifests_slurp
      loop: >-
        {{
          __quadlet_podman_manifest_find['files']
          | ansible.builtin.map(attribute='path')
          | ansible.builtin.reject('ansible.builtin.eq', __quadlet_podman_manifest_file_path)
          | ansible.builtin.list
        }}
      loop_control:
        label: "{{ item }}"


    # Removes the registry's credentials from the (per-scope, shared)
    # authfile. Registries that the manifest of another application in this
    # scope still declares are skipped: logging them out here would break that
    # application's image pulls until its next run.
    - name: "Setup | Uninstall | Log out of the container registries of the application"
      containers.podman.podman_logout:
        registry: "{{ __quadlet_podman_registry }}"
        authfile: "{{ __quadlet_podman_authfile_path }}"
        executable: "{{ __quadlet_podman_podman_exec_path }}"
      become: true
      become_user: "{{ __quadlet_podman_become_user }}"
      environment: "{{ __quadlet_podman_task_environment }}"
      register: __quadlet_podman_logout_result
      failed_when:
        # tolerate already-removed credentials or a missing authfile
        - __quadlet_podman_logout_result is ansible.builtin.failed
        - >-
          (__quadlet_podman_logout_result['msg'] | ansible.builtin.default('') | ansible.builtin.lower)
          is not ansible.builtin.search('not logged in|no such file')
      when:
        - __quadlet_podman_exec_stat['stat']['exists']
      vars:
        __quadlet_podman_registries_other_apps: >-
          {%- set __registries = [] -%}
          {%- for __result in (__quadlet_podman_other_manifests_slurp['results'] | ansible.builtin.default([])) -%}
          {%-   set __manifest = ((__result['content'] | ansible.builtin.default('') | ansible.builtin.b64decode
                                   | ansible.builtin.from_yaml) | ansible.builtin.default({}, true)) -%}
          {%-   for __registry in (__manifest['registries'] | ansible.builtin.default([])) -%}
          {%-     set _ = __registries.append(__registry) -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ __registries }}
      loop: >-
        {{
          ((__quadlet_podman_manifest_old['registries'] | ansible.builtin.default([]))
           + __quadlet_podman_registries_declared)
          | ansible.builtin.unique
          | ansible.builtin.reject('ansible.builtin.in', __quadlet_podman_registries_other_apps)
          | ansible.builtin.list
        }}
      loop_control:
        loop_var: "__quadlet_podman_registry"


- name: "Setup | Uninstall | Remove the managed files of the application"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_file_dest }}"
    state: "absent"
  loop: >-
    {{
      ((__quadlet_podman_manifest_old['files'] | ansible.builtin.default([]))
       + (quadlet_podman_files | ansible.builtin.map(attribute='dest') | ansible.builtin.list))
      | ansible.builtin.unique
      | ansible.builtin.list
    }}
  loop_control:
    loop_var: "__quadlet_podman_file_dest"


- name: "Setup | Uninstall | Remove the application manifest"
  ansible.builtin.file:
    path: "{{ __quadlet_podman_manifest_file_path }}"
    state: "absent"


- name: "Setup | Uninstall | Remove packages"
  ansible.builtin.package:
    name: "{{ __quadlet_podman_packages_uninstall }}"
    state: "absent"
  when:
    - __quadlet_podman_packages_uninstall is ansible.builtin.defined
    - (__quadlet_podman_packages_uninstall | ansible.builtin.length) > 0
