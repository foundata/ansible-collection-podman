# Internal role variables and values that must NOT be overridden by the user.
#
# Variables defined here usually override earlier definitions due to the high
# precedence of this file. Each variable should have a concise comment above
# it, describing its purpose and how it fits into the role's functionality.

---

# Facts used by the role (gathered on a best-effort basis if needed), as a
# mapping of "gather_subset" name to the ansible_facts keys it provides.
#
# To identify which subset a fact belongs to during development, you can use
# the following snippet:
#
# - ansible.builtin.setup:
#     gather_subset:
#       - '!min'
#       - '<subset_name, see parameter doc for details>'
__quadlet_podman_used_facts:
  distribution:
    - "distribution"
    - "distribution_major_version"
    - "distribution_version"
    - "os_family"
  # The generated Quadlet services are systemd units; nearly everything this
  # role does is gated on systemd.
  service_mgr:
    - "service_mgr"


# List of platforms this role supports and was designed for.
#
# This list is deliberately smaller than on most other foundata roles: the
# role requires Podman >= 5.x ("no 4.x") which rules out Debian 12,
# Ubuntu 22.04/24.04 and the Enterprise Linux 9 family.
__quadlet_podman_supported_platforms:
  - name: "Debian"
    versions:
      - "13"
  - name: "Fedora"
    versions:
      - "43"
      - "44"
  - name: "openSUSE Leap"
    versions:
      - "16.0"
  - name: "RedHat" # includes AlmaLinux, Rocky and CentOS Stream
    versions:
      - "10"
  - name: "Ubuntu"
    versions:
      - "26.04"


# List of package names to be installed when quadlet_podman_state is
# set to "present". This role manages no packages (Podman is provided by the
# foundata.podman.host role); kept empty for the shared setup boilerplate.
__quadlet_podman_packages_install: []


# List of package names to be uninstalled when quadlet_podman_state is
# set to "absent".
__quadlet_podman_packages_uninstall: "{{ __quadlet_podman_packages_install }}"


# List of package names to be removed unconditionally before installation
# (e.g., to prevent conflicts or resolve incompatibilities).
__quadlet_podman_packages_removal: []


# List of paths of files and directories to be removed unconditionally after
# installation. This is useful for removing default configuration resources
# that would otherwise create confusion or conflict with custom configurations
# managed by this role.
__quadlet_podman_paths_removal: []


# Dictionary of files to be overwritten with a managed comment instead of being
# deleted. Keys are file paths; values are the single-line comment characters to
# use. This is needed on platforms where the package manager reinstalls deleted
# files on package update. Restored files would conflict with the managed
# configuration, while modified files are preserved. For example, RPM with
# %config(noreplace) restores missing files but preserves modified ones.
__quadlet_podman_paths_neutralize: {}


# Minimum Podman version this role supports (checked at runtime in
# tasks/init.yml; quadlet_podman_min_podman_version can raise it per
# application). "artifact" units additionally require Podman >= 5.7.
__quadlet_podman_min_podman_version: "5.0.0"
__quadlet_podman_artifact_min_podman_version: "5.7.0"


# Whether the application gets deployed rootless (user scope) instead of
# rootful (system scope). Derived from quadlet_podman_user; empty = rootful.
#
# Lazy / late-bound evaluation: Jinja renders this variable on access.
__quadlet_podman_rootless: >-
  {{
    (quadlet_podman_user | ansible.builtin.length) > 0
  }}


# Directory the Quadlet unit files are written to. systemd's Quadlet generator
# reads /etc/containers/systemd/ (system scope) and
# ~/.config/containers/systemd/ (user scope). The rootless home directory is
# resolved in tasks/init.yml (__quadlet_podman_user_home).
__quadlet_podman_unit_dir_path: >-
  {{
    (__quadlet_podman_user_home ~ '/.config/containers/systemd')
    if (__quadlet_podman_rootless | ansible.builtin.bool)
    else '/etc/containers/systemd'
  }}


# Directory the plain systemd units (quadlet_podman_systemd_units) are written
# to: the regular systemd search path of the selected scope.
__quadlet_podman_systemd_unit_dir_path: >-
  {{
    (__quadlet_podman_user_home ~ '/.config/systemd/user')
    if (__quadlet_podman_rootless | ansible.builtin.bool)
    else '/etc/systemd/system'
  }}


# Ownership and permissions of the Quadlet unit directory and files. For the
# user scope the owner/group get resolved in tasks/init.yml.
__quadlet_podman_unit_dir_mode: "u=rwx,g=rx,o=" # 0750
__quadlet_podman_unit_file_mode: "u=rw,g=r,o=" # 0640
__quadlet_podman_file_owner: >-
  {{
    quadlet_podman_user
    if (__quadlet_podman_rootless | ansible.builtin.bool)
    else 'root'
  }}
__quadlet_podman_file_group: >-
  {{
    __quadlet_podman_user_gid
    if (__quadlet_podman_rootless | ansible.builtin.bool)
    else 'root'
  }}


# Default ownership and permissions for quadlet_podman_directories and
# quadlet_podman_files entries (item values take precedence).
__quadlet_podman_dir_default_mode: "u=rwx,g=rx,o=" # 0750
__quadlet_podman_managed_file_default_mode: "u=rw,g=r,o=" # 0640


# Marker line written into every Quadlet unit file created by this role. Used
# to re-identify the application's files later (cleanup of units removed from
# quadlet_podman_units, full removal on state "absent"). Files without the
# marker or with another application's marker are never touched.
__quadlet_podman_file_marker: "# Managed by Ansible (foundata.podman.quadlet): app={{ quadlet_podman_app }}"


# Per-application manifest recording the resources created outside the Quadlet
# unit files: Podman secret names, managed file paths and registries logged
# into. Unit files re-identify themselves via the embedded marker, but
# secrets, arbitrary files and authfile entries cannot carry one, so this
# manifest is the ownership record that lets renamed or de-listed resources be
# cleaned up on the next run and lets state "absent" remove the application
# completely even when the current lists differ from the deployed state.
#
# The manifests live in a root-owned directory (one subdirectory per scope),
# deliberately OUTSIDE the rootless user's writable tree: the recorded file
# paths get removed with root privileges later, so a manifest the service
# account could edit would let it delete arbitrary files as root.
__quadlet_podman_manifest_dir_path: >-
  {{
    '/var/lib/ansible-podman-quadlet/'
    ~ (('user-' ~ quadlet_podman_user)
       if (__quadlet_podman_rootless | ansible.builtin.bool)
       else 'system')
  }}
__quadlet_podman_manifest_file_path: "{{ __quadlet_podman_manifest_dir_path }}/{{ quadlet_podman_app }}.ansible-manifest"


# Currently declared resources of the application (entries with state
# "present" only); used by the cleanup reconciliation and the manifest.
__quadlet_podman_secret_names_declared: >-
  {%- set __names = [] -%}
  {%- for __entry in quadlet_podman_secrets -%}
  {%-   if (__entry['state'] | ansible.builtin.default('present')) == 'present' -%}
  {%-     set _ = __names.append(__entry['name']) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ __names }}
__quadlet_podman_file_dests_declared: >-
  {%- set __dests = [] -%}
  {%- for __entry in quadlet_podman_files -%}
  {%-   if (__entry['state'] | ansible.builtin.default('present')) == 'present' -%}
  {%-     set _ = __dests.append(__entry['dest']) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ __dests }}
__quadlet_podman_registries_declared: >-
  {{
    quadlet_podman_registry_auth
    | ansible.builtin.map(attribute='registry')
    | ansible.builtin.list
  }}


# All Quadlet file extensions the systemd generator knows about; used to find
# candidate files during cleanup.
__quadlet_podman_unit_extensions:
  - "container"
  - "pod"
  - "volume"
  - "network"
  - "kube"
  - "image"
  - "build"
  - "artifact"


# Unit types allowed in quadlet_podman_systemd_units (as filename suffixes);
# also used to find candidate files during cleanup. Deliberately without
# "mount", "swap" and other types no application manifest has needed so far.
__quadlet_podman_systemd_unit_suffixes:
  - "timer"
  - "service"
  - "target"
  - "path"
  - "socket"


# Section name that holds the type-specific settings of a plain systemd unit
# (canonical rendering order, analogous to __quadlet_podman_type_section_map;
# "target" units have no type-specific section).
__quadlet_podman_systemd_unit_section_map:
  timer: "Timer"
  service: "Service"
  target: "Unit"
  path: "Path"
  socket: "Socket"


# Suffix of the systemd service unit generated from a Quadlet file, per unit
# type: <name><suffix>.service (see "man podman-systemd.unit").
__quadlet_podman_service_suffix_map:
  container: ""
  kube: ""
  pod: "-pod"
  volume: "-volume"
  network: "-network"
  image: "-image"
  build: "-build"
  artifact: "-artifact"


# Section name every unit type expects for its type-specific settings; also
# defines the canonical section rendering order (Unit, type section, Service,
# Install, everything else as supplied).
__quadlet_podman_type_section_map:
  container: "Container"
  pod: "Pod"
  volume: "Volume"
  network: "Network"
  kube: "Kube"
  image: "Image"
  build: "Build"
  artifact: "Artifact"


# [Unit] settings whose values reference other units; values matching the name
# of another entry in quadlet_podman_units get expanded to that unit's
# generated service name by the template.
__quadlet_podman_dependency_keys:
  - "After"
  - "Requires"
  - "Wants"
  - "BindsTo"
  - "PartOf"
  - "Before"


# Services of the application in start order (pods first, so member containers
# find their pod service on start); derived from the effective unit list built
# in tasks/init.yml. A unit is managed if it carries an Install section
# (volumes/networks/images without one start on demand as dependencies) or an
# explicit per-unit service_state; the per-unit effective service_state then
# decides the list: start (enabled/running, also the restart handler's set) or
# stop (disabled). Units with an effective "unmanaged" are in neither.
#
# Lazy / late-bound evaluation: Jinja renders these variables on access, after
# tasks/init.yml sets __quadlet_podman_units_effective.
__quadlet_podman_units_start_order: >-
  {{
    (__quadlet_podman_units_effective | ansible.builtin.selectattr('type', 'ansible.builtin.eq', 'pod')
     | ansible.builtin.selectattr('managed') | ansible.builtin.list)
    + (__quadlet_podman_units_effective | ansible.builtin.rejectattr('type', 'ansible.builtin.eq', 'pod')
       | ansible.builtin.selectattr('managed') | ansible.builtin.list)
  }}
__quadlet_podman_services_start: >-
  {{
    __quadlet_podman_units_start_order
    | ansible.builtin.selectattr('service_state', 'ansible.builtin.in', ['enabled', 'running'])
    | ansible.builtin.map(attribute='service') | ansible.builtin.list
  }}
__quadlet_podman_services_stop: >-
  {{
    __quadlet_podman_units_start_order
    | ansible.builtin.selectattr('service_state', 'ansible.builtin.eq', 'disabled')
    | ansible.builtin.map(attribute='service') | ansible.builtin.list
  }}


# Plain systemd units (quadlet_podman_systemd_units) the role manages the
# state of, and the subset the restart-on-change handler may restart; derived
# from the effective list built in tasks/init.yml (same per-unit
# service_state logic as above, but every listed plain unit is managed unless
# its effective state is "unmanaged").
#
# Lazy / late-bound evaluation: Jinja renders these variables on access, after
# tasks/init.yml sets __quadlet_podman_systemd_units_effective.
__quadlet_podman_systemd_units_manage: >-
  {{
    __quadlet_podman_systemd_units_effective
    | ansible.builtin.rejectattr('service_state', 'ansible.builtin.eq', 'unmanaged')
    | ansible.builtin.list
  }}
__quadlet_podman_systemd_units_restart: >-
  {{
    __quadlet_podman_systemd_units_effective
    | ansible.builtin.selectattr('service_state', 'ansible.builtin.in', ['enabled', 'running'])
    | ansible.builtin.map(attribute='name') | ansible.builtin.list
  }}


# Authentication file for registry logins. The podman default for the
# respective scope lives below the runtime directory (XDG_RUNTIME_DIR) and
# would be lost on reboot; a persistent path keeps pulls by the generated
# services and by podman-auto-update working.
__quadlet_podman_authfile_path: >-
  {{
    (__quadlet_podman_user_home ~ '/.config/containers/auth.json')
    if (__quadlet_podman_rootless | ansible.builtin.bool)
    else '/etc/containers/auth.json'
  }}


# Scope abstraction for tasks and handlers that talk to Podman or systemd:
# rootful work runs as root against the system instance, rootless work runs as
# the target account against its user instance (XDG_RUNTIME_DIR and the bus
# address must point at the account's runtime directory for systemctl --user
# and podman to reach the right instance). Using these variables keeps one
# task set for both scopes.
#
# Lazy / late-bound evaluation: Jinja renders these variables on access, after
# tasks/init.yml resolves the account facts.
__quadlet_podman_become_user: >-
  {{
    quadlet_podman_user
    if (__quadlet_podman_rootless | ansible.builtin.bool)
    else 'root'
  }}
__quadlet_podman_systemd_scope: >-
  {{
    'user' if (__quadlet_podman_rootless | ansible.builtin.bool) else 'system'
  }}
__quadlet_podman_task_environment: >-
  {{
    {
      'XDG_RUNTIME_DIR': '/run/user/' ~ __quadlet_podman_user_uid,
      'DBUS_SESSION_BUS_ADDRESS': 'unix:path=/run/user/' ~ __quadlet_podman_user_uid ~ '/bus',
    }
    if (__quadlet_podman_rootless | ansible.builtin.bool)
    else {}
  }}


### Executable paths (never hard-coded inline; override per platform if needed)

__quadlet_podman_podman_exec_path: "/usr/bin/podman"
__quadlet_podman_grep_exec_path: "/usr/bin/grep"
__quadlet_podman_systemctl_exec_path: "/usr/bin/systemctl"


### Override defaults of dependencies used by this role (if any).

# nothing right now
