# Default variables and values for this role.
#
# These variables are designed to be easily overridden (as they have a low
# precedence) and typically allow users to customize the role's behavior.
# Each variable should have a clear comment above it, describing its purpose
# and how it fits into the role's functionality.

---

# Determines whether the managed resources should be `present` or `absent`.
#
# `present` ensures that the application's Quadlet units, secrets, directories
# and files are deployed and its services are managed.
#
# `absent` stops the application's services and removes its Quadlet units,
# secrets and managed files. Directories from `quadlet_podman_directories` and
# named volumes are NOT removed to protect persistent application data; remove
# those manually or with dedicated tasks if really needed.
#
# - Type: str
# - Required: No
# - Default: present
# - Choices: present, absent
quadlet_podman_state: "present"


# Defines the status of the service(s).
#
# `enabled`: Service is running and will start automatically at boot.
#
# `disabled`: Service is stopped and will not start automatically at boot.
#
# `running`: Service is running but will not start automatically at boot. This
# can be used to start a service on the first Ansible run without enabling it
# for boot.
#
# `unmanaged`: Ansible does not manage the service at all: both the running
# state and the boot (enablement) state are left exactly as they are. This is
# primarily useful when services are monitored and managed by systems other than
# Ansible.
#
# The singular form (`service`) is used for simplicity. However, the defined
# status applies to all services if multiple are being managed by this role.
# Individual units can deviate via their own `service_state` entry in
# `quadlet_podman_units` or `quadlet_podman_systemd_units` (e.g. a run-once
# container that only its timer may start).
#
# The role manages the systemd services generated from the units in
# `quadlet_podman_units`, in dependency order (e.g. a pod before its member
# containers). Note that systemd units generated from Quadlet files cannot be
# enabled or disabled via `systemctl`; whether a service starts at boot is
# governed by the `Install` section of its Quadlet unit (usually
# `WantedBy: "multi-user.target"` or `WantedBy: "default.target"`). For
# `enabled`, ensure the relevant units carry an `Install` section; for
# `disabled`, omit it (the role still stops running services). Plain units from
# `quadlet_podman_systemd_units` are real unit files, so for them `enabled` and
# `disabled` do use `systemctl enable` / `disable`.
#
# - Type: str
# - Required: No
# - Default: enabled
# - Choices: enabled, disabled, running, unmanaged
quadlet_podman_service_state: "enabled"


# Name of the user account to deploy the application for, selecting rootless or
# rootful operation:
#
# - Empty (the default): rootful. Quadlet units are placed below
#   `/etc/containers/systemd/` and the generated services run as system
#   services.
# - Set to a username: rootless. Quadlet units are placed below
#   `~/.config/containers/systemd/` of that account, secrets and registry logins
#   are created in its scope, and the generated services run in its systemd user
#   instance (`systemctl --user`).
#
# The account must already exist and must be enabled for rootless Podman usage,
# including systemd lingering (see `host_podman_rootless_users` of the
# `foundata.podman.host` role). The role fails early if these prerequisites are
# missing.
#
# - Type: str
# - Required: No
# - Default: ""
quadlet_podman_user: ""


# List of the Quadlet units that make up the application. Each list item
# describes one Quadlet file and is rendered from its `sections` dictionary; the
# full set of available sections and settings is documented in
# `man podman-systemd.unit` or
# https://docs.podman.io/en/latest/markdown/podman-systemd.unit.5.html
#
# Rendering rules:
#
# - Sections are rendered in a canonical order (`Unit`, then the type-specific
#   section such as `Container` or `Pod`, then `Service` and `Install`); any
#   other section is passed through as-is.
# - Scalar values are rendered as single `Key=value` lines.
# - List values are rendered as repeated `Key=value` lines (e.g. for `Volume`,
#   `PublishPort`, `Environment`).
# - Boolean values are rendered as `true`/`false`.
# - A `null` value drops the section or setting entirely, which is mainly useful
#   to unset something a unit would otherwise inherit from
#   `quadlet_podman_unit_defaults` (e.g. `Install: ~` on a unit that must not
#   start at boot).
#
# The name of the systemd service generated by a unit depends on its type:
# `<name>.service` for `container` and `kube`, `<name>-<type>.service` for all
# other types (e.g. a pod `zammad` becomes `zammad-pod.service`). As a
# convenience, values in the `Unit` section's `After`, `Requires`, `Wants`,
# `BindsTo`, `PartOf` and `Before` settings that match the `name` of another
# unit in this list are expanded to that unit's generated service name
# automatically; values containing a dot (e.g. `network-online.target`) are
# passed through verbatim.
#
# Example (a pod with one member container and a named volume):
#
# ```yaml
# quadlet_podman_units:
#   - name: "zammad"
#     type: "pod"
#     sections:
#       Unit:
#         Description: "Zammad Pod"
#       Pod:
#         PodName: "zammad"
#         PublishPort:
#           - "127.0.0.1:8080:8080"
#       Install:
#         WantedBy: "multi-user.target"
#   - name: "zammad-psql-data"
#     type: "volume"
#     sections:
#       Volume:
#         VolumeName: "zammad-psql-data"
#   - name: "zammad-psql"
#     type: "container"
#     sections:
#       Unit:
#         Description: "Zammad PostgreSQL Database"
#         After:
#           - "zammad-psql-data"
#       Container:
#         ContainerName: "zammad-psql"
#         Image: "docker.io/postgres:18"
#         Pod: "zammad.pod"
#         Volume: "zammad-psql-data.volume:/var/lib/postgresql"
#         AutoUpdate: "registry"
#       Service:
#         Restart: "always"
#       Install:
#         WantedBy: "multi-user.target"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
# - Dict attributes:
#   - name: Name of the Quadlet unit (the filename without extension, e.g.
#     `zammad-psql` results in `zammad-psql.container`). Also the basis of the
#     generated systemd service name. Must be unique within
#     `quadlet_podman_units`. Allowed characters: letters, digits, `_`, `.` and
#     `-`.
#     - Type: str
#     - Required: Yes
#   - type:
#     Type of the Quadlet unit, determining the file extension and the expected
#     type-specific section (e.g. `container` expects a `Container` section).
#
#     Note: `artifact` requires Podman 5.7 or later (see
#     `quadlet_podman_min_podman_version`).
#     - Type: str
#     - Required: Yes
#     - Choices: container, pod, volume, network, kube, image, build, artifact
#   - sections:
#     Content of the Quadlet unit as a dictionary of sections. Keys are section
#     names (e.g. `Unit`, `Container`, `Pod`, `Volume`, `Network`, `Service`,
#     `Install`), values are dictionaries of the settings within that section.
#     See the description of `quadlet_podman_units` for the rendering rules and
#     an example.
#     - Type: dict
#     - Required: Yes
#   - service_state:
#     Per-unit override of `quadlet_podman_service_state`, with the same values
#     and semantics. If unset, the unit follows the application-wide value.
#
#     The main use case is `unmanaged` for a run-once container that only its
#     systemd timer (see `quadlet_podman_systemd_units`) or a boot-time
#     `Install` section may start: the role deploys the unit file but neither
#     starts the service on converge (no job run per deployment, no `changed`
#     report) nor stops it (an in-flight run survives converges). Prefer
#     `unmanaged` over `disabled` for such units, `disabled` stops the service
#     on every run and would kill an in-flight timer-triggered run.
#
#     Caution for pod members: the generated pod service pulls its member
#     containers in via `Wants=`, so a member starts at every pod (re)start
#     regardless of `unmanaged` and `Install`. A timer-only pod member
#     additionally needs `StartWithPod: false` in its `Container` section.
#
#     For a run-once container that SHOULD run once per deployment and
#     configuration change (e.g. database migrations), no override is needed:
#     keep the unit managed and set `RemainAfterExit: true` in its `Service`
#     section instead. The service then parks in `active (exited)` after
#     success, so the role's start task is a no-op on later runs while the
#     restart-on-change handler still re-runs it. Do not combine
#     `RemainAfterExit` with a timer: systemd does not re-trigger a unit that is
#     still active.
#     - Type: str
#     - Required: No
#     - Choices: enabled, disabled, running, unmanaged
quadlet_podman_units: []


# List of plain systemd units that belong to the application but are not Quadlet
# types, typically timers that trigger run-once containers or small oneshot
# helper services. The files are written to `/etc/systemd/system/` (rootful) or
# `~/.config/systemd/user/` of the `quadlet_podman_user` account (rootless) and
# are managed exactly like the application's Quadlet files: marked with the
# application identifier, removed again when de-listed and removed by
# `quadlet_podman_state: "absent"`.
#
# Each item's `sections` dictionary follows the same rendering rules as
# `quadlet_podman_units` (`quadlet_podman_unit_defaults` does not apply). As a
# convenience, the `Unit` setting of `Timer` and `Path` sections, the `Service`
# setting of `Socket` sections and the dependency settings of the `Unit` section
# expand unit names from `quadlet_podman_units` to their generated service names
# automatically.
#
# Unlike Quadlet-generated services, these are real unit files, so
# `enabled`/`disabled` (from the item's `service_state` or the application-wide
# `quadlet_podman_service_state`) use `systemctl enable`/`disable` and honor the
# unit's `Install` section. Changed unit files get a daemon-reload and managed
# units are restarted (so e.g. a changed `OnCalendar` takes effect; with
# `Persistent: true` a schedule moved into the past fires once immediately).
#
# Example (a timer starting the generated service of a run-once container named
# `example-job` every night):
#
# ```yaml
# quadlet_podman_systemd_units:
#   - name: "example-job.timer"
#     sections:
#       Unit:
#         Description: "Example nightly job timer"
#       Timer:
#         Unit: "example-job"
#         OnCalendar: "*-*-* 03:00:00"
#         RandomizedDelaySec: "15m"
#         Persistent: true
#       Install:
#         WantedBy: "timers.target"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
# - Dict attributes:
#   - name: File name of the systemd unit including its type suffix (e.g.
#     `example-job.timer`); one of `.timer`, `.service`, `.target`, `.path` or
#     `.socket`. Must be unique and must not collide with a unit file or
#     generated service name of `quadlet_podman_units`. Allowed characters:
#     letters, digits, `_`, `.` and `-`.
#
#     Note for `.socket` units: systemd only starts a socket whose service unit
#     exists, so pair it with a `.service` in this list (or name it after an
#     existing service).
#     - Type: str
#     - Required: Yes
#   - sections:
#     Content of the unit as a dictionary of sections (e.g. `Unit`, `Timer`,
#     `Service`, `Install`), following the rendering rules of
#     `quadlet_podman_units`.
#     - Type: dict
#     - Required: Yes
#   - service_state:
#     Per-unit override of `quadlet_podman_service_state`, with the same values.
#     If unset, the unit follows the application-wide value. Use `unmanaged` for
#     units that are only started by other units (e.g. a oneshot service
#     triggered by a timer of the same application).
#     - Type: str
#     - Required: No
#     - Choices: enabled, disabled, running, unmanaged
quadlet_podman_systemd_units: []


# Default sections and settings applied to every unit in `quadlet_podman_units`,
# keyed by unit type. Use this to avoid repeating common settings (e.g. restart
# policy or boot enablement) in each unit; the per-unit `sections` are
# deep-merged on top and take precedence.
#
# Example (restart all containers of the application on failure and start them
# at boot):
#
# ```yaml
# quadlet_podman_unit_defaults:
#   container:
#     Service:
#       Restart: "always"
#       TimeoutStartSec: 300
#     Install:
#       WantedBy: "multi-user.target"
# ```
#
# - Type: dict
# - Required: No
# - Default: {}
# - Dict attributes:
#   - container:
#     Default sections for all units of type `container`. Same structure as the
#     per-unit `sections`.
#     - Type: dict
#     - Required: No
#   - pod: Default sections for all units of type `pod`. Same structure as the
#     per-unit `sections`.
#     - Type: dict
#     - Required: No
#   - volume:
#     Default sections for all units of type `volume`. Same structure as the
#     per-unit `sections`.
#     - Type: dict
#     - Required: No
#   - network:
#     Default sections for all units of type `network`. Same structure as the
#     per-unit `sections`.
#     - Type: dict
#     - Required: No
#   - kube: Default sections for all units of type `kube`. Same structure as the
#     per-unit `sections`.
#     - Type: dict
#     - Required: No
#   - image:
#     Default sections for all units of type `image`. Same structure as the
#     per-unit `sections`.
#     - Type: dict
#     - Required: No
#   - build:
#     Default sections for all units of type `build`. Same structure as the
#     per-unit `sections`.
#     - Type: dict
#     - Required: No
#   - artifact:
#     Default sections for all units of type `artifact`. Same structure as the
#     per-unit `sections`.
#     - Type: dict
#     - Required: No
quadlet_podman_unit_defaults: {}


# List of Podman secrets to manage for the application, created in the scope
# selected by `quadlet_podman_user` (rootful or the given user's rootless
# scope).
#
# Existing secrets are left untouched by default (their value is neither
# compared nor updated), so no secret data appears in diffs or logs. Set
# `force: true` on an item to rotate its value. Note that containers only pick
# up a rotated secret when they are recreated (a plain restart is not sufficient
# for `type=env` secrets).
#
# Reference the secrets from Quadlet units via the `Secret` setting of the
# `Container` section, e.g.
# `Secret: "zammad_db_password,type=env,target=POSTGRES_PASSWORD"`.
#
# The role records the names of the secrets it created in a per-application
# manifest (root-owned, below `/var/lib/ansible-podman-quadlet/`): secrets
# renamed or removed from this list get removed again on the next run, and
# `quadlet_podman_state: "absent"` removes all of the application's secrets even
# when the current list is empty or different.
#
# Example (reference a vaulted variable instead of a literal value in real
# deployments; note that Jinja expressions cannot be shown in this description
# as Ansible templates it during argument validation):
#
# ```yaml
# quadlet_podman_secrets:
#   - name: "zammad_db_password"
#     value: "place-a-vaulted-value-here"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
# - Dict attributes:
#   - name:
#     Name of the Podman secret. Allowed characters: letters, digits, `_`, `.`
#     and `-`.
#     - Type: str
#     - Required: Yes
#   - value:
#     Value of the secret. Required when `state` is `present`. Trailing newlines
#     are stripped (a common source of subtle authentication failures when
#     values come from files or lookups).
#     - Type: str
#     - Required: No
#     - Sensitive: Yes (no_log, values are masked in logs)
#   - state:
#     `present` ensures the secret exists (without updating an existing one
#     unless `force` is `true`), `absent` removes it.
#     - Type: str
#     - Required: No
#     - Default: present
#     - Choices: present, absent
#   - force:
#     If set to `true`, the secret is recreated on every run, updating its value
#     (use for rotation). If `false` (the default), an existing secret is left
#     untouched.
#     - Type: bool
#     - Required: No
#     - Default: false
quadlet_podman_secrets: []


# List of container registries to log into before images are pulled, in the
# scope selected by `quadlet_podman_user`. Needed for images from private
# registries; the credentials are also used by the automatic image updates
# (`AutoUpdate=registry`).
#
# The role records its logins in a per-application manifest (root-owned, below
# `/var/lib/ansible-podman-quadlet/`): registries removed from this list are
# logged out again on the next run, and `quadlet_podman_state: "absent"` logs
# out of all recorded registries, so no credentials linger after removal. Note
# that the authentication file is shared per scope (one per rootless account,
# `/etc/containers/auth.json` for rootful). The role therefore only logs out of
# a registry when no other application's manifest in the same scope still
# declares it: shared credentials stay in place until the last application using
# them is removed or stops declaring the registry.
#
# Example (reference a vaulted variable instead of a literal value in real
# deployments):
#
# ```yaml
# quadlet_podman_registry_auth:
#   - registry: "registry.example.com"
#     username: "deploy"
#     password: "place-a-vaulted-value-here"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
# - Dict attributes:
#   - registry:
#     Registry host to authenticate against (e.g. `registry.example.com`).
#     - Type: str
#     - Required: Yes
#   - username: Username for the registry login.
#     - Type: str
#     - Required: Yes
#   - password: Password or token for the registry login.
#     - Type: str
#     - Required: Yes
#     - Sensitive: Yes (no_log, values are masked in logs)
quadlet_podman_registry_auth: []


# List of host directories to create before the application's services are
# started, typically used as bind-mount sources or to hold configuration created
# via `quadlet_podman_files`.
#
# For rootless applications keep in mind that a container process UID maps to a
# subordinate UID on the host; directories written to by the container may
# therefore need ownership adjustments or the `:U` volume mount option. See the
# role's README for details.
#
# Directories are NOT removed when `quadlet_podman_state` is `absent` (they may
# contain persistent application data); set an item's `state` to `absent` to
# remove it explicitly.
#
# Example:
#
# ```yaml
# quadlet_podman_directories:
#   - path: "/var/lib/podman/zammad/config"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
# - Dict attributes:
#   - path: Absolute path of the directory.
#     - Type: str
#     - Required: Yes
#   - owner:
#     Owner of the directory. Defaults to `root` for rootful applications and to
#     `quadlet_podman_user` for rootless ones.
#     - Type: str
#     - Required: No
#   - group:
#     Group of the directory. Defaults to the primary group of the directory's
#     owner.
#     - Type: str
#     - Required: No
#   - mode:
#     Permissions of the directory, in symbolic or octal notation. Defaults to
#     `u=rwx,g=rx,o=` (`0750`).
#     - Type: str
#     - Required: No
#   - state:
#     `present` ensures the directory exists, `absent` removes it including its
#     content. Handle with care.
#     - Type: str
#     - Required: No
#     - Default: present
#     - Choices: present, absent
quadlet_podman_directories: []


# List of files to manage for the application, e.g. environment files referenced
# via `EnvironmentFile` or configuration files bind-mounted into containers.
# Parent directories must exist (see `quadlet_podman_directories`).
#
# Do not put secrets into environment or configuration files if it can be
# avoided; prefer `quadlet_podman_secrets`.
#
# Changed files trigger a restart of the application's services (a container
# only picks up a changed environment file when it is restarted).
#
# The role records the paths of the files it created in a per-application
# manifest (root-owned, below `/var/lib/ansible-podman-quadlet/`): files renamed
# or removed from this list get removed again on the next run, and
# `quadlet_podman_state: "absent"` removes all of the application's managed
# files even when the current list is empty or different.
#
# Example:
#
# ```yaml
# quadlet_podman_files:
#   - dest: "/var/lib/podman/zammad/config/zammad.env"
#     content: |
#       POSTGRES_DB=zammad_production
#       POSTGRES_HOST=127.0.0.1
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
# - Dict attributes:
#   - dest: Absolute path of the file.
#     - Type: str
#     - Required: Yes
#   - content: Content of the file. Required when `state` is `present`.
#     - Type: str
#     - Required: No
#   - owner:
#     Owner of the file. Defaults to `root` for rootful applications and to
#     `quadlet_podman_user` for rootless ones.
#     - Type: str
#     - Required: No
#   - group:
#     Group of the file. Defaults to the primary group of the file's owner.
#     - Type: str
#     - Required: No
#   - mode: Permissions of the file, in symbolic or octal notation. Defaults to
#     `u=rw,g=r,o=` (`0640`).
#     - Type: str
#     - Required: No
#   - state:
#     `present` ensures the file exists with the given content, `absent` removes
#     it.
#     - Type: str
#     - Required: No
#     - Default: present
#     - Choices: present, absent
quadlet_podman_files: []


# Minimum Podman version this application requires. Unset by default (only the
# role's own baseline check applies).
# quadlet_podman_min_podman_version:
