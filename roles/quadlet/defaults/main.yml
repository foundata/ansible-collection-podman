# Default variables and values for this role.
#
# These variables are designed to be easily overridden (as they have a low
# precedence) and typically allow users to customize the role's behavior.
# Each variable should have a clear comment above it, describing its purpose
# and how it fits into the role's functionality.

---

# Determines whether the managed resources should be `present` or `absent`.
#
# `present` ensures that the application's Quadlet units, secrets, directories
# and files are deployed and its services are managed.
#
# `absent` stops the application's services and removes its Quadlet units,
# secrets and managed files. Directories from `quadlet_podman_directories` and
# named volumes are NOT removed to protect persistent application data; remove
# those manually or with dedicated tasks if really needed.
#
# - Type: str
# - Required: No
# - Default: present
# - Choices: present, absent
quadlet_podman_state: "present"


# Defines the status of the service(s).
#
# `enabled`: Service is running and will start automatically at boot.
#
# `disabled`: Service is stopped and will not start automatically at boot.
#
# `running`: Service is running but will not start automatically at boot. This
# can be used to start a service on the first Ansible run without enabling it
# for boot.
#
# `unmanaged`: Service will not start at boot, and Ansible will not manage its
# running state. This is primarily useful when services are monitored and
# managed by systems other than Ansible.
#
# The singular form (`service`) is used for simplicity. However, the defined
# status applies to all services if multiple are being managed by this role.
#
# The role manages the systemd services generated from the units in
# `quadlet_podman_units`, in dependency order (e.g. a pod before its member
# containers). Note that systemd units generated from Quadlet files cannot be
# enabled or disabled via `systemctl`; whether a service starts at boot is
# governed by the `Install` section of its Quadlet unit (usually
# `WantedBy: "multi-user.target"` or `WantedBy: "default.target"`). For
# `enabled`, ensure the relevant units carry an `Install` section; for
# `disabled`, omit it (the role still stops running services).
#
# - Type: str
# - Required: No
# - Default: enabled
# - Choices: enabled, disabled, running, unmanaged
quadlet_podman_service_state: "enabled"


# Name of the user account to deploy the application for, selecting rootless or
# rootful operation:
#
# - Empty (the default): rootful. Quadlet units are placed below
#   `/etc/containers/systemd/` and the generated services run as system
#   services.
# - Set to a username: rootless. Quadlet units are placed below
#   `~/.config/containers/systemd/` of that account, secrets and registry logins
#   are created in its scope, and the generated services run in its systemd user
#   instance (`systemctl --user`).
#
# The account must already exist and must be enabled for rootless Podman usage,
# including systemd lingering (see `host_podman_rootless_users` of the
# `foundata.podman.host` role). The role fails early if these prerequisites are
# missing.
#
# - Type: str
# - Required: No
# - Default: ""
quadlet_podman_user: ""


# List of the Quadlet units that make up the application. Each list item
# describes one Quadlet file and is rendered from its `sections` dictionary; the
# full set of available sections and settings is documented in
# `man podman-systemd.unit` or
# https://docs.podman.io/en/latest/markdown/podman-systemd.unit.5.html
#
# Rendering rules:
#
# - Sections are rendered in a canonical order (`Unit`, then the type-specific
#   section such as `Container` or `Pod`, then `Service` and `Install`); any
#   other section is passed through as-is.
# - Scalar values are rendered as single `Key=value` lines.
# - List values are rendered as repeated `Key=value` lines (e.g. for `Volume`,
#   `PublishPort`, `Environment`).
# - Boolean values are rendered as `true`/`false`.
#
# The name of the systemd service generated by a unit depends on its type:
# `<name>.service` for `container` and `kube`, `<name>-<type>.service` for all
# other types (e.g. a pod `zammad` becomes `zammad-pod.service`). As a
# convenience, values in the `Unit` section's `After`, `Requires`, `Wants`,
# `BindsTo`, `PartOf` and `Before` settings that match the `name` of another
# unit in this list are expanded to that unit's generated service name
# automatically; values containing a dot (e.g. `network-online.target`) are
# passed through verbatim.
#
# Example (a pod with one member container and a named volume):
#
# ```yaml
# quadlet_podman_units:
#   - name: "zammad"
#     type: "pod"
#     sections:
#       Unit:
#         Description: "Zammad Pod"
#       Pod:
#         PodName: "zammad"
#         PublishPort:
#           - "127.0.0.1:8080:8080"
#       Install:
#         WantedBy: "multi-user.target"
#   - name: "zammad-psql-data"
#     type: "volume"
#     sections:
#       Volume:
#         VolumeName: "zammad-psql-data"
#   - name: "zammad-psql"
#     type: "container"
#     sections:
#       Unit:
#         Description: "Zammad PostgreSQL Database"
#         After:
#           - "zammad-psql-data"
#       Container:
#         ContainerName: "zammad-psql"
#         Image: "docker.io/postgres:18"
#         Pod: "zammad.pod"
#         Volume: "zammad-psql-data.volume:/var/lib/postgresql"
#         AutoUpdate: "registry"
#       Service:
#         Restart: "always"
#       Install:
#         WantedBy: "multi-user.target"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
quadlet_podman_units: []


# Default sections and settings applied to every unit in `quadlet_podman_units`,
# keyed by unit type. Use this to avoid repeating common settings (e.g. restart
# policy or boot enablement) in each unit; the per-unit `sections` are
# deep-merged on top and take precedence.
#
# Example (restart all containers of the application on failure and start them
# at boot):
#
# ```yaml
# quadlet_podman_unit_defaults:
#   container:
#     Service:
#       Restart: "always"
#       TimeoutStartSec: 300
#     Install:
#       WantedBy: "multi-user.target"
# ```
#
# - Type: dict
# - Required: No
# - Default: {}
quadlet_podman_unit_defaults: {}


# List of Podman secrets to manage for the application, created in the scope
# selected by `quadlet_podman_user` (rootful or the given user's rootless
# scope).
#
# Existing secrets are left untouched by default (their value is neither
# compared nor updated), so no secret data appears in diffs or logs. Set
# `force: true` on an item to rotate its value. Note that containers only pick
# up a rotated secret when they are recreated (a plain restart is not sufficient
# for `type=env` secrets).
#
# Reference the secrets from Quadlet units via the `Secret` setting of the
# `Container` section, e.g.
# `Secret: "zammad_db_password,type=env,target=POSTGRES_PASSWORD"`.
#
# Example (reference a vaulted variable instead of a literal value in real
# deployments; note that Jinja expressions cannot be shown in this description
# as Ansible templates it during argument validation):
#
# ```yaml
# quadlet_podman_secrets:
#   - name: "zammad_db_password"
#     value: "place-a-vaulted-value-here"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
quadlet_podman_secrets: []


# List of container registries to log into before images are pulled, in the
# scope selected by `quadlet_podman_user`. Needed for images from private
# registries; the credentials are also used by the automatic image updates
# (`AutoUpdate=registry`).
#
# Example (reference a vaulted variable instead of a literal value in real
# deployments):
#
# ```yaml
# quadlet_podman_registry_auth:
#   - registry: "registry.example.com"
#     username: "deploy"
#     password: "place-a-vaulted-value-here"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
quadlet_podman_registry_auth: []


# List of host directories to create before the application's services are
# started, typically used as bind-mount sources or to hold configuration created
# via `quadlet_podman_files`.
#
# For rootless applications keep in mind that a container process UID maps to a
# subordinate UID on the host; directories written to by the container may
# therefore need ownership adjustments or the `:U` volume mount option. See the
# role's README for details.
#
# Directories are NOT removed when `quadlet_podman_state` is `absent` (they may
# contain persistent application data); set an item's `state` to `absent` to
# remove it explicitly.
#
# Example:
#
# ```yaml
# quadlet_podman_directories:
#   - path: "/var/lib/podman/zammad/config"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
quadlet_podman_directories: []


# List of files to manage for the application, e.g. environment files referenced
# via `EnvironmentFile` or configuration files bind-mounted into containers.
# Parent directories must exist (see `quadlet_podman_directories`).
#
# Do not put secrets into environment or configuration files if it can be
# avoided; prefer `quadlet_podman_secrets`.
#
# Changed files trigger a restart of the application's services (a container
# only picks up a changed environment file when it is restarted).
#
# Example:
#
# ```yaml
# quadlet_podman_files:
#   - dest: "/var/lib/podman/zammad/config/zammad.env"
#     content: |
#       POSTGRES_DB=zammad_production
#       POSTGRES_HOST=127.0.0.1
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
quadlet_podman_files: []


# Minimum Podman version this application requires. Unset by default (only the
# role's own baseline check applies).
# quadlet_podman_min_podman_version:
